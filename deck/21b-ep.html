<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expert Parallelism</title>
<link rel="stylesheet" href="shared/deck.css?v=3">
<style>
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  /* ---- 8 GPUs, experts as chips ---- */
  .gpu {
    position: absolute; top: 118px; width: 141px; height: 168px;
    border: 1.5px solid var(--line); border-radius: 10px; background: rgba(27,30,39,0.5);
    opacity: 0;
  }
  .gpu .glab { position: absolute; top: 4px; width: 100%; text-align: center; font: 600 9.5px ui-monospace, monospace; color: var(--ink-2); }
  .gpu .gcnt { position: absolute; bottom: 5px; width: 100%; text-align: center; font: 600 9px ui-monospace, monospace; color: #7d6a3f; }
  .ggrid { position: absolute; left: 10px; right: 10px; top: 20px; bottom: 22px; display: grid; gap: 3px; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(4, 1fr); }
  .gcell { background: rgba(201,133,0,0.06); border-radius: 2px; }

  #batch {
    position: absolute; left: 358px; top: 94px; font: 700 10.5px ui-monospace, monospace;
    color: var(--accent); border: 1.5px solid rgba(47,214,176,0.6); border-radius: 999px;
    padding: 2px 9px; background: rgba(11,13,18,0.92); opacity: 0; z-index: 6;
  }
  .pk {
    position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 9px rgba(47,214,176,0.8); opacity: 0; z-index: 5;
  }

  #bus {
    position: absolute; left: 44px; top: 296px; width: 1184px; height: 16px;
    border: 2px solid rgba(144,133,233,0.45); border-radius: 8px; opacity: 0;
  }
  #bus .flow {
    position: absolute; inset: 2px; border-radius: 6px; opacity: 0;
    background: repeating-linear-gradient(90deg, rgba(144,133,233,0.45) 0 14px, transparent 14px 28px);
  }
  #bus.live .flow { opacity: 1; animation: busFlow 0.8s linear infinite; }
  @keyframes busFlow { to { background-position: 28px 0; } }
  #buslab { position: absolute; left: 44px; top: 316px; font: 600 9.5px ui-monospace, monospace; color: #9085e9; opacity: 0; }

  .strip { position: absolute; top: 338px; font: 600 11px ui-monospace, monospace; opacity: 0; }
  #capmath { left: 44px; color: #e0a935; }
  #nvchip { right: 44px; color: #6b7284; font-weight: 500; font-size: 10px; }
  #commdue {
    position: absolute; left: 500px; top: 333px; font: 700 11px ui-monospace, monospace;
    color: #9085e9; border: 1.5px solid rgba(144,133,233,0.6); border-radius: 999px;
    padding: 3px 10px; background: rgba(11,13,18,0.92); opacity: 0; z-index: 6;
  }

  /* ---- vs TP ---- */
  #vstp {
    position: absolute; left: 44px; top: 384px; width: 570px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; opacity: 0;
  }
  .vrow { display: flex; gap: 12px; align-items: baseline; opacity: 0; }
  .vrow + .vrow { margin-top: 10px; }
  .vrow .vn { width: 30px; font: 800 13px ui-monospace, monospace; }
  .vrow .vt { font-size: 11.5px; line-height: 1.45; }
  #vrow-tp .vn { color: #6b7284; } #vrow-tp .vt { color: var(--ink-2); }
  #vrow-ep .vn { color: var(--accent); } #vrow-ep .vt { color: #c7cce0; }

  /* ---- overlap Gantt ---- */
  #gantt {
    position: absolute; left: 660px; top: 372px; width: 576px; height: 218px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; opacity: 0;
  }
  #gantt h4 { margin: 0; font-size: 13px; font-weight: 650; }
  #gantt h4 span { font-size: 10.5px; color: var(--ink-2); font-weight: 400; margin-left: 8px; }
  #glanes { position: absolute; left: 62px; top: 46px; width: 500px; height: 130px; }
  .lanelab { position: absolute; left: -50px; width: 42px; text-align: right; font: 700 10px ui-monospace, monospace; opacity: 0; }
  #ll-cores { top: 10px; color: #6fb1ff; }
  #ll-wire { top: 56px; color: #9085e9; }
  .blk {
    position: absolute; height: 30px; border-radius: 5px; opacity: 0;
    font: 700 9.5px ui-monospace, monospace; display: flex; align-items: center; justify-content: center;
  }
  .blk.c { width: 86px; background: rgba(57,135,229,0.3); border: 1.5px solid #3987e5; color: #9ec7f5; top: 0; }
  .blk.a { width: 58px; background: rgba(144,133,233,0.28); border: 1.5px solid #9085e9; color: #b9b1f2; top: 0; }
  #brack { position: absolute; top: 100px; left: 0; height: 8px; border: 1.5px solid #5b647c; border-top: none; opacity: 0; }
  #bracklab { position: absolute; top: 112px; left: 0; width: 100%; text-align: center; font: 600 10px ui-monospace, monospace; color: #9aa1b5; opacity: 0; }
  #stov {
    position: absolute; left: 1092px; top: 464px; font: 800 13px ui-monospace, monospace;
    letter-spacing: 0.05em; border: 3px solid #e04b38; color: #e04b38;
    padding: 3px 9px; border-radius: 5px; transform: rotate(-9deg); opacity: 0; z-index: 8;
    background: rgba(11,13,18,0.6);
  }
  #codesign {
    position: absolute; left: 160px; top: 640px; width: 960px; text-align: center;
    font-size: 13px; font-style: italic; color: var(--accent); opacity: 0;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">Expert Parallelism</div>
  <div class="slide-sub">the capacity fix — and how the interconnect bill gets paid down</div>

  <div id="gpus"></div>
  <div id="batch">token batch</div>
  <div id="bus"><div class="flow"></div></div>
  <div id="buslab">all-to-all interconnect</div>
  <div class="strip" id="capmath"></div>
  <div class="strip" id="nvchip"></div>
  <div id="commdue">all-to-all — the new line item</div>

  <div id="vstp">
    <div class="vrow" id="vrow-tp"><span class="vn"></span><span class="vt"></span></div>
    <div class="vrow" id="vrow-ep"><span class="vn"></span><span class="vt"></span></div>
  </div>

  <div id="gantt">
    <h4>The overlap trick<span>micro-batches in flight</span></h4>
    <div id="glanes">
      <div class="lanelab" id="ll-cores">cores</div>
      <div class="lanelab" id="ll-wire">wire</div>
      <div class="blk c" id="C1" style="left:0">µb1</div>
      <div class="blk a" id="A1" style="left:90px">a2a</div>
      <div class="blk c" id="C2" style="left:152px">µb2</div>
      <div class="blk a" id="A2" style="left:242px">a2a</div>
      <div class="blk c" id="C3" style="left:304px">µb3</div>
      <div class="blk a" id="A3" style="left:394px">a2a</div>
      <div id="brack" style="width:452px"></div>
      <div id="bracklab" style="width:452px">wall-clock</div>
    </div>
  </div>
  <div id="stov">OVERLAPPED</div>
  <div id="codesign"></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/moe.js?v=3"></script>
<script src="shared/gpus.js?v=3"></script>
<script src="shared/manifest.js?v=3"></script>
<script src="shared/deck.js?v=3"></script>
<script>
  // ---- 8 GPU boxes, 112 expert chips each ----
  var host = document.getElementById("gpus");
  for (var i = 0; i < 8; i++) {
    var g = document.createElement("div");
    g.className = "gpu"; g.id = "gpu" + i;
    g.style.left = (44 + i * 149) + "px";
    var cells = "";
    for (var j = 0; j < 28; j++) cells += '<div class="gcell"></div>';
    g.innerHTML = '<div class="glab">GPU ' + i + '</div><div class="ggrid">' + cells +
      '</div><div class="gcnt">112 experts</div>';
    host.appendChild(g);
  }

  // ---- copy from shared data ----
  var capParts = MOE.bill.capMath.split(" → ");
  document.getElementById("capmath").textContent = capParts[0] + " → placed across 8 × B200";
  document.getElementById("nvchip").textContent = GPUS.nvl72.name + " · " + GPUS.nvl72.nvlink.split(" (")[0];
  document.querySelector("#vrow-tp .vn").textContent = "TP";
  document.querySelector("#vrow-tp .vt").textContent = MOE.ep.vsTP[0][1];
  document.querySelector("#vrow-ep .vn").textContent = "EP";
  document.querySelector("#vrow-ep .vt").textContent = MOE.ep.vsTP[1][1];
  document.getElementById("codesign").textContent = "“" + MOE.ep.codesign + "”";

  // packets
  var stage = document.querySelector(".stage");
  var TARGETX = [110, 557, 855, 1004, 408];   // gpu 0, 3, 5, 6, 2 (local)
  for (i = 0; i < 5; i++) {
    var p = document.createElement("div");
    p.className = "pk"; p.id = "pk" + i;
    p.style.left = (388 + i * 12) + "px"; p.style.top = "106px";
    stage.appendChild(p);
  }
  // one expert cell per target GPU lights up during compute
  var hotCells = [0, 3, 5, 6, 2].map(function (gi, k) {
    return document.querySelectorAll("#gpu" + gi + " .gcell")[9 + k * 3];
  });

  var bus = document.getElementById("bus");
  function busOn() { bus.classList.add("live"); }
  function busOff() { bus.classList.remove("live"); }

  // ---- timeline: 4 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the 2.8T model drapes across 8 GPUs — placement solves capacity
  tl.fromTo(".gpu", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.06, ease: "power3.out" })
    .fromTo(".gcell", { backgroundColor: "rgba(201,133,0,0.06)" },
      { backgroundColor: "rgba(201,133,0,0.5)", duration: 0.5, stagger: { each: 0.004, from: "start" }, ease: "power1.inOut" })
    .fromTo("#bus", { opacity: 0 }, { opacity: 1, duration: 0.35 }, "-=0.3")
    .fromTo("#buslab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, "<")
    .fromTo("#capmath", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 })
    .fromTo("#nvchip", { opacity: 0 }, { opacity: 1, duration: 0.35 }, "-=0.15");
  DECK.markStep(tl);

  // beat 2: dispatch — packets fly the all-to-all, compute, combine back
  tl.fromTo("#batch", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" })
    .to(".pk", { opacity: 1, top: 200, duration: 0.45, stagger: 0.04, ease: "power1.in" })
    .call(busOn)
    .to(".pk", { top: 299, duration: 0.3, stagger: 0.03, ease: "power1.in" })
    .to(".pk", { left: function (i) { return TARGETX[i]; }, duration: 0.65, stagger: 0.04, ease: "power2.inOut" })
    .to(".pk", { top: 220, duration: 0.35, stagger: 0.03, ease: "power1.out" })
    .fromTo(hotCells, { boxShadow: "0 0 0 rgba(111,177,255,0)" },
      { backgroundColor: "#6fb1ff", boxShadow: "0 0 12px rgba(111,177,255,0.95)", duration: 0.22, yoyo: true, repeat: 3 })
    .to(".pk", { top: 299, duration: 0.3, stagger: 0.03, ease: "power1.in" })
    .to(".pk", { left: function (i) { return 388 + i * 12; }, duration: 0.6, stagger: 0.04, ease: "power2.inOut" })
    .to(".pk", { top: 200, duration: 0.3, ease: "power1.out" })
    .fromTo("#gpu2", { boxShadow: "0 0 0 rgba(47,214,176,0)" },
      { borderColor: "#2fd6b0", boxShadow: "0 0 18px rgba(47,214,176,0.7)", duration: 0.25, yoyo: true, repeat: 1 })
    .to(".pk", { opacity: 0, duration: 0.25 }, "-=0.2")
    .fromTo("#commdue", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" });
  DECK.markStep(tl);

  // beat 3: two lines on TP vs EP
  tl.fromTo("#vstp", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" })
    .fromTo("#vrow-tp", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.35 })
    .fromTo("#vrow-ep", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.35 }, "+=0.15");
  DECK.markStep(tl);

  // beat 4: overlap — comm hides under the next micro-batch's compute
  tl.fromTo("#gantt", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" })
    .fromTo("#ll-cores", { opacity: 0 }, { opacity: 1, duration: 0.25 })
    .fromTo(".blk", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.25, stagger: 0.07 })
    .fromTo("#brack", { opacity: 0 }, { opacity: 1, duration: 0.3 })
    .fromTo("#bracklab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, "<")
    .to({}, { duration: 0.4 })
    .fromTo("#ll-wire", { opacity: 0 }, { opacity: 1, duration: 0.3 })
    .to("#A1", { top: 46, left: 90, duration: 0.6, ease: "power2.inOut" })
    .to("#A2", { top: 46, left: 180, duration: 0.6, ease: "power2.inOut" }, "<0.08")
    .to("#A3", { top: 46, left: 270, duration: 0.6, ease: "power2.inOut" }, "<0.08")
    .to("#C2", { left: 90, duration: 0.6, ease: "power2.inOut" }, "<0.08")
    .to("#C3", { left: 180, duration: 0.6, ease: "power2.inOut" }, "<")
    .to("#brack", { width: 328, duration: 0.6, ease: "power2.inOut" }, "<")
    .to("#bracklab", { width: 328, duration: 0.6, ease: "power2.inOut" }, "<")
    .fromTo("#stov", { opacity: 0, scale: 2.2, rotate: -9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.in" })
    .fromTo("#codesign", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5 });

  DECK.register(tl, { reset: busOff });
</script>
</body>
</html>
