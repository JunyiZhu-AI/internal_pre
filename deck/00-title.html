<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Kimi K3 to Broad Efficient LLM Techniques</title>
<link rel="stylesheet" href="shared/deck.css?v=29">
<style>
  #t1 {
    position: absolute; left: 0; top: 206px; width: 1280px; text-align: center;
    font-size: 52px; font-weight: 800; letter-spacing: -0.015em; color: #e8eaf0; opacity: 0;
  }
  /* ---- the picker wheel (iPhone-clock style) ---- */
  #wheelwrap {
    position: absolute; left: 0; top: 292px; width: 1280px; height: 198px;
    overflow: hidden; opacity: 0;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 32%, #000 68%, transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0%, #000 32%, #000 68%, transparent 100%);
  }
  #wheel { position: absolute; left: 0; width: 100%; }
  .witem {
    height: 66px; line-height: 66px; text-align: center;
    font-size: 40px; font-weight: 800; letter-spacing: -0.01em; color: #7a8296;
  }
  .witem.hero { color: var(--accent); text-shadow: 0 0 34px rgba(47,214,176,0.35); }
  /* the fixed selection band, like the picker's glass */
  #band {
    position: absolute; left: 240px; top: 358px; width: 800px; height: 66px;
    border-top: 1.5px solid rgba(47,214,176,0.25); border-bottom: 1.5px solid rgba(47,214,176,0.25);
    border-radius: 10px; opacity: 0; pointer-events: none;
  }
  #speaker {
    position: absolute; left: 0; top: 548px; width: 1280px; text-align: center;
    font-size: 17px; color: var(--ink-2); opacity: 0;
  }
  #speaker b { color: #e8eaf0; font-weight: 600; }
</style>
</head>
<body>
<div class="stage">
  <div id="t1">From Kimi K3 to</div>
  <div id="wheelwrap"><div id="wheel"></div></div>
  <div id="band"></div>
  <div id="speaker">Speaker: <b>Junyi Zhu</b></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/bottlenecks.js?v=29"></script>
<script src="shared/manifest.js?v=29"></script>
<script src="shared/deck.js?v=29"></script>
<script>
  // the wheel's strip: the umbrella phrase + every technique in the deck
  // (from the shared roster), padded with duplicate neighbours so the
  // resting frame after a full revolution is pixel-identical to the start
  var HERO = "Broad Efficient LLM Techniques";
  var techs = BN.techniques.map(function (t) { return t[0]; });
  var strip = [techs[techs.length - 1], HERO].concat(techs, [HERO, techs[0]]);
  var wheel = document.getElementById("wheel");
  strip.forEach(function (name) {
    var d = document.createElement("div");
    d.className = "witem" + (name === HERO ? " hero" : "");
    d.textContent = name;
    wheel.appendChild(d);
  });

  var IH = 66, CENTER = (198 - IH) / 2;                  // item height / centering offset
  function yFor(i) { return CENTER - i * IH; }
  var START = 1, END = 2 + techs.length;                 // the two hero positions — identical frames

  // ---- the loop: rest on the hero, then one fast spin through the roster ----
  var wheelTl = null;
  function startWheel() {
    if (wheelTl) { wheelTl.play(0); return; }
    wheelTl = gsap.timeline({ repeat: -1 });
    wheelTl.set(wheel, { y: yFor(START) })
      .to({}, { duration: 2.6 })                         // rest on the hero
      .to(wheel, { y: yFor(END), duration: 1.7, ease: "power2.inOut" });  // spin — count them, don't read them
  }

  // ---- reveal plays by itself on load, like the closing page ----
  var tl = gsap.timeline({ paused: true });
  tl.fromTo("#t1", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" })
    .fromTo("#wheelwrap", { opacity: 0 }, { opacity: 1, duration: 0.6 }, "-=0.25")
    .fromTo("#band", { opacity: 0 }, { opacity: 1, duration: 0.5 }, "<")
    .call(startWheel)
    .fromTo("#speaker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, "+=0.3");

  DECK.register(tl, {
    reset: function () {
      if (wheelTl) wheelTl.pause(0);
      gsap.set(wheel, { y: yFor(START) });
      gsap.delayedCall(0.08, function () { tl.play(); });
    }
  });
  tl.play();
</script>
</body>
</html>
