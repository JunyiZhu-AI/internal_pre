<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoE's Hidden Bill</title>
<link rel="stylesheet" href="shared/deck.css?v=3">
<link rel="stylesheet" href="shared/bottlenecks.css?v=3">
<style>
  /* ---- four bucket cards (slide-02 continuity) ---- */
  .bcard {
    position: absolute; top: 104px; width: 231px; height: 84px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line); padding: 10px 10px 10px 72px; opacity: 0;
  }
  .bcard .bn-icon { position: absolute; left: 2px; top: 10px; transform: scale(0.72); transform-origin: left top; }
  .bcard .bnm { font-size: 13.5px; font-weight: 700; }
  .bcard .bun { margin-top: 3px; font: 600 10px ui-monospace, monospace; color: var(--ink-2); }
  .bcard .bdm { margin-top: 2px; font-size: 10px; color: #6b7284; }
  .rtag {
    position: absolute; top: -10px; right: 10px; font: 700 10px ui-monospace, monospace;
    color: var(--accent); border: 1.5px solid rgba(47,214,176,0.7); border-radius: 999px;
    padding: 2px 8px; background: #0e1a17; opacity: 0;
  }
  #moechip {
    position: absolute; left: 44px; top: 210px; font: 700 12px ui-monospace, monospace;
    color: #e8eaf0; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 11px;
    background: rgba(27,30,39,0.9); opacity: 0;
  }
  #moechip b { color: var(--accent); }

  /* ---- the city: 8 blocks of land ---- */
  #cityland { position: absolute; left: 56px; top: 252px; width: 724px; height: 306px; }
  .blk {
    position: absolute; width: 151px; height: 133px; border-radius: 6px;
    border: 1.5px solid rgba(201,133,0,0.42); background: #151310;
    padding: 6px 6px 18px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 2.5px;
    opacity: 0;
  }
  .blk i { border-radius: 1.5px; background: rgba(201,133,0,0.16); }
  .blk i.on { background: #2fd6b0; box-shadow: 0 0 7px rgba(47,214,176,0.9); }
  .blk .blab {
    position: absolute; bottom: 3px; left: 0; right: 0; text-align: center;
    font: 600 8.5px ui-monospace, monospace; color: rgba(224,169,53,0.75);
  }
  #citycap {
    position: absolute; left: 56px; top: 570px; width: 724px; text-align: center;
    font: 600 11.5px ui-monospace, monospace; color: #e0a935; opacity: 0;
  }
  /* streets + traffic */
  #streets { position: absolute; inset: 0; opacity: 0; }
  .stv { position: absolute; top: 0; height: 306px; width: 22px; left: 0; }
  .sth { position: absolute; left: 0; width: 724px; height: 22px; top: 142px; }
  .stv::before { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; border-left: 1.5px dashed rgba(144,133,233,0.35); }
  .sth::before { content: ""; position: absolute; top: 50%; left: 4px; right: 4px; border-top: 1.5px dashed rgba(144,133,233,0.35); }
  .pkt { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #9085e9; box-shadow: 0 0 8px rgba(144,133,233,0.9); }
  .stv .pkt { left: 7.5px; animation: pktV 2.2s linear infinite; }
  .sth .pkt { top: 7.5px; animation: pktH 2.6s linear infinite; }
  @keyframes pktV { from { top: -8px; } to { top: 306px; } }
  @keyframes pktH { from { left: -8px; } to { left: 724px; } }
  .pkt.rev { animation-direction: reverse; }

  /* ---- right column ---- */
  .rpanel { position: absolute; left: 830px; width: 406px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; opacity: 0; }
  #cappanel { top: 252px; border-color: rgba(201,133,0,0.55); }
  #cappanel .cm1 { font: 700 21px ui-monospace, monospace; color: #e0a935; }
  #cappanel .cm2 { margin-top: 4px; font: 700 16px ui-monospace, monospace; color: #e8eaf0; }
  #cappanel .cm3 { margin-top: 8px; font-size: 11.5px; color: var(--ink-2); line-height: 1.45; }
  #commpanel { top: 430px; border-color: rgba(144,133,233,0.55); }
  #commpanel .co1 { font: 700 14px ui-monospace, monospace; color: #9085e9; }
  #commpanel .co2 { margin-top: 6px; font-size: 12px; color: #c7cce0; line-height: 1.5; }

  /* ---- the reframe ---- */
  #frame { position: absolute; left: 44px; top: 630px; width: 1000px; font: 700 16px ui-monospace, monospace; opacity: 0; }
  #frame .f1 { color: #e8eaf0; }
  #frame .fc { color: #3987e5; text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: rgba(224,75,56,0.8); }
  #frame .fk { color: #e0a935; } #frame .fm { color: #9085e9; }
  #resp { position: absolute; left: 44px; top: 668px; width: 1100px; font-size: 13px; color: var(--ink-2); opacity: 0; display: flex; align-items: center; gap: 10px; }
  .rchip { font: 700 12px ui-monospace, monospace; border-radius: 999px; padding: 3px 12px; border: 1.5px solid; }
  #chipEP { color: var(--accent); border-color: rgba(47,214,176,0.7); background: #0e1a17; }
  #chipPD { color: #6fb1ff; border-color: rgba(111,177,255,0.6); background: #0d1420; }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">MoE's Hidden Bill</div>
  <div class="slide-sub">the four buckets return — watch which meters move when the model turns MoE</div>

  <div id="cards"></div>
  <div id="moechip">the model turns <b>MoE</b> — compute relaxes</div>

  <div id="cityland">
    <div id="streets"></div>
  </div>
  <div id="citycap"></div>

  <div class="rpanel" id="cappanel">
    <div class="cm1"></div>
    <div class="cm2"></div>
    <div class="cm3"></div>
  </div>
  <div class="rpanel" id="commpanel">
    <div class="co1">all-to-all, every MoE layer</div>
    <div class="co2"></div>
  </div>

  <div id="frame"></div>
  <div id="resp"></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/moe.js?v=3"></script>
<script src="shared/bottlenecks.js?v=3"></script>
<script src="shared/manifest.js?v=3"></script>
<script src="shared/deck.js?v=3"></script>
<script>
  // ---- the four bucket cards ----
  var cards = document.getElementById("cards");
  BN.list.forEach(function (b, i) {
    cards.insertAdjacentHTML("beforeend",
      '<div class="bcard" id="bc-' + b.key + '" style="left:' + (44 + i * 243) + 'px">' +
      BN.iconHTML(b.key) +
      '<div class="bnm" style="color:' + b.color + '">' + b.name + "</div>" +
      '<div class="bun">' + b.unit + "</div>" +
      '<div class="bdm">' + b.dom + "</div>" +
      '<span class="rtag">relaxed</span></div>');
  });

  // ---- the 8 blocks of land ----
  var land = document.getElementById("cityland");
  var streets = document.getElementById("streets");
  function seeded(s) { return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
  var rnd = seeded(7);
  for (var r = 0; r < 2; r++) for (var c = 0; c < 4; c++) {
    var blk = document.createElement("div");
    blk.className = "blk";
    blk.style.left = (c * 191) + "px";
    blk.style.top = (r * 173) + "px";
    var litA = Math.floor(rnd() * 44), litB = (litA + 17 + Math.floor(rnd() * 9)) % 44;
    for (var w = 0; w < 44; w++) {
      var i = document.createElement("i");
      if (w === litA || w === litB) i.className = "on";
      blk.appendChild(i);
    }
    blk.insertAdjacentHTML("beforeend", '<span class="blab">B200 · 192 GB</span>');
    land.appendChild(blk);
  }
  // streets: 3 vertical avenues between columns + 1 horizontal between rows
  for (var v = 0; v < 3; v++) {
    var sv = document.createElement("div");
    sv.className = "stv";
    sv.style.left = (151 + v * 191 + 9) + "px";
    sv.innerHTML = '<span class="pkt" style="animation-delay:' + (v * 0.5) + 's"></span>' +
      '<span class="pkt rev" style="animation-delay:' + (v * 0.5 + 1.1) + 's"></span>';
    streets.appendChild(sv);
  }
  var sh = document.createElement("div");
  sh.className = "sth";
  sh.innerHTML = '<span class="pkt"></span><span class="pkt" style="animation-delay:0.9s"></span>' +
    '<span class="pkt rev" style="animation-delay:0.4s"></span><span class="pkt rev" style="animation-delay:1.6s"></span>';
  streets.appendChild(sh);

  // ---- text from shared data ----
  document.getElementById("citycap").textContent = MOE.bill.cap;
  var cm = MOE.bill.capMath.split(" → ");
  document.querySelector("#cappanel .cm1").textContent = cm[0];
  document.querySelector("#cappanel .cm2").textContent = "→ " + cm[1];
  document.querySelector("#cappanel .cm3").textContent = "before any KV cache or activations — capacity is the entry ticket";
  document.querySelector("#commpanel .co2").textContent = MOE.bill.comm;
  var fr = MOE.bill.frame.split(": ");
  document.getElementById("frame").innerHTML =
    '<span class="f1">' + fr[0] + ': </span><span class="fc">compute</span>' +
    '<span class="f1"> → </span><span class="fk">capacity</span><span class="f1"> + </span><span class="fm">interconnect</span>';
  document.getElementById("resp").innerHTML =
    'the systems layer answers: <span class="rchip" id="chipEP">Expert Parallelism</span> then ' +
    '<span class="rchip" id="chipPD">Prefill–Decode disaggregation</span>';

  // ---- timeline: 4 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the buckets return; the model turns MoE; compute relaxes
  tl.fromTo(".bcard", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.1, ease: "power2.out" })
    .fromTo("#moechip", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, "+=0.15")
    .to("#bc-compute", { opacity: 0.4, filter: "grayscale(0.8)", duration: 0.55 }, "+=0.2")
    .fromTo("#bc-compute .rtag", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.5)" }, "-=0.2");
  DECK.markStep(tl);

  // beat 2: capacity flares — 8 blocks of land, windows mostly dark
  tl.fromTo(".blk", { opacity: 0, y: 24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, stagger: 0.07, ease: "back.out(1.5)" })
    .fromTo("#citycap", { opacity: 0 }, { opacity: 1, duration: 0.4 }, "-=0.1")
    .to("#bc-cap", { boxShadow: "0 0 22px rgba(201,133,0,0.7)", borderColor: "rgba(201,133,0,0.9)", duration: 0.16, yoyo: true, repeat: 3 })
    .to(".blk", { borderColor: "rgba(201,133,0,0.85)", boxShadow: "0 0 16px rgba(201,133,0,0.28)", duration: 0.4 }, "<")
    .fromTo("#cappanel", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" })
    .to(".blk", { boxShadow: "none", duration: 0.6 }, "-=0.2");
  DECK.markStep(tl);

  // beat 3: interconnect flares — the avenues jam with all-to-all traffic
  tl.to("#streets", { opacity: 1, duration: 0.5 })
    .to("#bc-comm", { boxShadow: "0 0 22px rgba(144,133,233,0.7)", borderColor: "rgba(144,133,233,0.9)", duration: 0.16, yoyo: true, repeat: 3 }, "-=0.2")
    .fromTo("#commpanel", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" });
  DECK.markStep(tl);

  // beat 4: the reframe + what answers it
  tl.fromTo("#frame", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" })
    .fromTo("#resp", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, "+=0.35")
    .fromTo("#chipEP", { scale: 1 }, { scale: 1.12, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut" })
    .fromTo("#chipPD", { scale: 1 }, { scale: 1.12, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut" });

  DECK.register(tl, {});
</script>
</body>
</html>
