<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoE: conditional computation</title>
<link rel="stylesheet" href="shared/deck.css?v=3">
<style>
  .an { position: absolute; font-size: 10px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: #9aa1b5; }
  .figno { position: absolute; font: 600 9px ui-monospace, Menlo, monospace; letter-spacing: .22em; color: #525a6e; text-transform: uppercase; }
  .bp {
    position: absolute; border: 1px solid var(--line); border-radius: 8px;
    background-image:
      linear-gradient(rgba(154,161,181,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(154,161,181,.045) 1px, transparent 1px);
    background-size: 26px 26px; background-color: rgba(27,30,39,.32);
  }
  svg text { font-family: ui-monospace, Menlo, monospace; }

  #fig { left: 44px; top: 104px; width: 724px; height: 528px; }
  #fig svg { position: absolute; inset: 0; }
  #ffnrect.unz { stroke-dasharray: 6 5; opacity: .45; }
  .exp-pulse { animation: expGlow 2.2s ease-in-out infinite; }
  @keyframes expGlow { 50% { opacity: .55; } }

  .gaugebox { position: absolute; width: 180px; text-align: center; opacity: 0; }
  .glabel { font-size: 10px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; }
  .gval { font: 600 12.5px ui-monospace, Menlo, monospace; color: #e8eaf0; margin-top: 2px; }
  #g-total { left: 806px; top: 112px; }
  #g-flops { left: 1032px; top: 112px; }
  #x5tag { position: absolute; left: 1032px; top: 268px; width: 180px; text-align: center;
    font: 600 10.5px ui-monospace, Menlo, monospace; color: #e04b38; opacity: 0; }

  #dec { position: absolute; left: 806px; top: 298px; width: 430px; }
  #dec .dline { font: 600 11.5px ui-monospace, Menlo, monospace; color: #c7cce0; margin-bottom: 6px; opacity: 0; }
  #dec .dline b { font-weight: 700; }

  .plate { position: absolute; left: 806px; width: 430px; border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 11px; opacity: 0; background: rgba(27,30,39,.5); }
  .plate .pt { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #8a91a5; }
  .plate .pl { font-size: 11px; color: #9aa1b5; line-height: 1.45; margin-top: 3px; }
  .plate .pm { font: 600 10.5px ui-monospace, Menlo, monospace; color: #6b7284; margin-top: 3px; }
  #plateA { top: 372px; }
  #plateB { top: 442px; border-color: rgba(47,214,176,.55); box-shadow: 0 0 14px rgba(47,214,176,.12); }
  #plateB .pt { color: var(--accent); }
  #plateB .pl { color: #c7cce0; }
  #plateB .pm { color: #9ec7f5; }
  #never { position: absolute; left: 806px; top: 528px; width: 430px;
    font: 600 10.5px ui-monospace, Menlo, monospace; color: #e0a935; opacity: 0; }

  .chip { position: absolute; left: 806px; width: 430px; border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 11px; font-size: 11.5px; line-height: 1.45; color: #c7cce0;
    background: rgba(27,30,39,.5); opacity: 0; }
  #chip1 { top: 552px; }
  #chip2 { top: 604px; border-color: rgba(224,169,53,.6); color: #e0a935; }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">MoE: conditional computation</div>
  <div class="slide-sub" id="sub"></div>

  <div class="bp" id="fig">
    <svg viewBox="0 0 724 528" width="724" height="528">
      <defs>
        <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M 0 0 L 8 4 L 0 8 z" fill="#6b7284"/>
        </marker>
      </defs>

      <!-- dense transformer layer (visible at load) -->
      <g stroke="#3d4356" fill="none" stroke-width="1.2">
        <line x1="20" y1="68" x2="74" y2="68" marker-end="url(#ah)"/>
        <rect x="80" y="40" width="100" height="56" rx="3"/>
        <line x1="180" y1="68" x2="234" y2="68" marker-end="url(#ah)"/>
        <line x1="360" y1="68" x2="424" y2="68" marker-end="url(#ah)"/>
      </g>
      <rect id="ffnrect" x="240" y="32" width="120" height="72" rx="3" fill="none" stroke="#3987e5" stroke-width="1.6"/>
      <text x="130" y="72" text-anchor="middle" fill="#9aa1b5" font-size="11">ATTN</text>
      <text id="ffnlbl" x="300" y="62" text-anchor="middle" fill="#9ec7f5" font-size="12">FFN</text>
      <text id="ffnsub" x="300" y="80" text-anchor="middle" fill="#6b7284" font-size="8.5">≈ 2/3 OF PARAMS</text>
      <text id="denselbl" x="300" y="24" text-anchor="middle" fill="#6b7284" font-size="9" letter-spacing="2">DENSE</text>

      <!-- ghost dense model (beat 3) -->
      <g id="ghost" opacity="0">
        <rect x="460" y="28" width="244" height="80" rx="3" fill="none" stroke="#e04b38" stroke-opacity=".5" stroke-width="1.3" stroke-dasharray="6 5"/>
        <text x="582" y="50" text-anchor="middle" fill="#e08074" font-size="10">DENSE GHOST — LLAMA-2-70B</text>
        <text x="582" y="70" text-anchor="middle" fill="#8a91a5" font-size="9.5" id="ghostl1"></text>
        <text x="582" y="88" text-anchor="middle" fill="#e08074" font-size="9.5" id="ghostl2"></text>
      </g>

      <!-- unzipped MoE subsystem (beat 1, drawn on) -->
      <path class="dr" id="lead" d="M 300 104 V 128 H 360 V 148" fill="none" stroke="#3d4356" stroke-width="1.2"/>
      <rect class="dr" x="300" y="150" width="120" height="45" rx="3" fill="none" stroke="#9aa1b5" stroke-width="1.4"/>
      <text class="lbl" x="360" y="177" text-anchor="middle" fill="#c7cce0" font-size="11" opacity="0">ROUTER</text>
      <text class="lbl" x="434" y="166" fill="#6b7284" font-size="9.5" opacity="0">TOP-2 OF 8</text>
      <text class="lbl" x="434" y="182" fill="#6b7284" font-size="9.5" opacity="0">SWITCH: K = 1</text>
      <text class="lbl" x="286" y="176" text-anchor="end" fill="#6b7284" font-size="9" opacity="0">MOE SUBSYSTEM</text>

      <g id="fans"></g>
      <g id="experts"></g>
      <g id="comb"></g>

      <circle id="tk0" cx="300" cy="110" r="5" fill="#e8eaf0" opacity="0"/>
      <circle id="tk1" cx="360" cy="177" r="5" fill="#e8eaf0" opacity="0"/>
      <circle id="tk2" cx="360" cy="177" r="5" fill="#e8eaf0" opacity="0"/>
    </svg>
    <div class="figno" style="left:14px; bottom:9px;">Fig. 18 — MoE layer · schematic</div>
  </div>

  <div class="gaugebox" id="g-total">
    <div class="glabel" style="color:#e0a935;">total params</div>
    <div class="gval" id="totalval">0 B</div>
  </div>
  <div class="gaugebox" id="g-flops">
    <div class="glabel" style="color:#6fb1ff;">FLOPs / token</div>
    <div class="gval" id="flopsval">∝ 0 B active</div>
  </div>
  <div id="x5tag"></div>

  <div id="dec">
    <div class="dline" id="dec1" style="color:#6fb1ff;"></div>
    <div class="dline" id="dec2" style="color:#e0a935;"></div>
    <div class="dline" id="dec3" style="color:#2fd6b0;"></div>
  </div>

  <div class="plate" id="plateA">
    <div class="pt" id="pat"></div>
    <div class="pl" id="pal"></div>
    <div class="pm" id="pam"></div>
  </div>
  <div class="plate" id="plateB">
    <div class="pt" id="pbt"></div>
    <div class="pl" id="pbl"></div>
    <div class="pm" id="pbm"></div>
  </div>
  <div id="never"></div>

  <div class="chip" id="chip1"></div>
  <div class="chip" id="chip2"></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/moe.js?v=3"></script>
<script src="shared/manifest.js?v=3"></script>
<script src="shared/deck.js?v=3"></script>
<script>
  // ---- static content from MOE ----
  document.getElementById("sub").textContent = MOE.mech;
  document.getElementById("dec1").textContent = MOE.decouple.flops;
  document.getElementById("dec2").textContent = MOE.decouple.quality;
  document.getElementById("dec3").textContent = MOE.decouple.arb;
  document.getElementById("pat").textContent = MOE.dual.isoFlop[0];
  document.getElementById("pal").textContent = MOE.dual.isoFlop[1];
  document.getElementById("pam").textContent = MOE.dual.isoFlop[2];
  document.getElementById("pbt").textContent = MOE.dual.isoQuality[0];
  document.getElementById("pbl").textContent = MOE.dual.isoQuality[1];
  document.getElementById("pbm").textContent = MOE.dual.isoQuality[2];
  document.getElementById("never").textContent = MOE.dual.never;
  document.getElementById("chip1").textContent = MOE.whyEveryone;
  document.getElementById("chip2").textContent = MOE.keepBoth;
  var MX = MOE.mixtral;
  document.getElementById("ghostl1").textContent = "reads all " + MX.dense + " B params, every token";
  document.getElementById("ghostl2").textContent = "FLOPs/token " + MX.ratio + " the MoE's";
  document.getElementById("x5tag").textContent = "dense " + MX.dense + " B — " + MX.ratio + " hotter";

  // ---- expert row (SVG built here) ----
  var CX = [96, 172, 248, 324, 400, 476, 552, 628];
  var ACTIVE = { 2: 1, 5: 1 };
  var fans = document.getElementById("fans");
  var experts = document.getElementById("experts");
  var comb = document.getElementById("comb");
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, at, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in at) e.setAttribute(k, at[k]);
    parent.appendChild(e);
    return e;
  }
  CX.forEach(function (cx, i) {
    var on = ACTIVE[i];
    el("line", { x1: 360, y1: 195, x2: cx, y2: 248,
      stroke: on ? "#2fd6b0" : "#3d4356", "stroke-width": on ? 1.6 : 1,
      "class": on ? "dr fan-on" : "fadein", "stroke-dasharray": on ? "" : "3 4", opacity: on ? 1 : 0 }, fans);
    var g = el("g", { "class": on ? "" : "fadein", opacity: on ? 1 : 0 }, experts);
    el("rect", { x: cx - 28, y: 250, width: 56, height: 140, rx: 3, fill: "none",
      stroke: on ? "#2fd6b0" : "#3d4356", "stroke-width": on ? 1.6 : 1,
      "class": on ? "dr" : "" }, g);
    [285, 320, 355].forEach(function (y) {
      var at = { x1: cx - 17, y1: y, x2: cx + 17, y2: y, stroke: "#2a2e3b", "stroke-width": 1 };
      if (on) { at["class"] = "lbl"; at.opacity = 0; }
      el("line", at, g);
    });
    var t = el("text", { x: cx, y: 380, "text-anchor": "middle", fill: on ? "#2fd6b0" : "#6b7284",
      "font-size": 9, "class": on ? "lbl" : "" }, g);
    if (on) t.setAttribute("opacity", 0);
    t.textContent = "E" + (i + 1);
    if (on) {
      el("rect", { id: "expfill" + i, x: cx - 28, y: 250, width: 56, height: 140, rx: 3,
        fill: "#2fd6b0", opacity: 0 }, g);
      el("line", { x1: cx, y1: 390, x2: cx, y2: 430, stroke: "#2fd6b0", "stroke-width": 1.4, "class": "dr" }, comb);
    }
  });
  el("line", { x1: 96, y1: 430, x2: 628, y2: 430, stroke: "#3d4356", "stroke-width": 1.2, "class": "dr" }, comb);
  el("line", { x1: 360, y1: 430, x2: 360, y2: 444, stroke: "#3d4356", "stroke-width": 1.2, "class": "dr" }, comb);
  el("circle", { cx: 360, cy: 458, r: 12, fill: "none", stroke: "#9aa1b5", "stroke-width": 1.3, "class": "dr" }, comb);
  var sig = el("text", { x: 360, y: 463, "text-anchor": "middle", fill: "#c7cce0", "font-size": 12, "class": "lbl", opacity: 0 }, comb);
  sig.textContent = "Σ";
  el("line", { x1: 360, y1: 470, x2: 360, y2: 494, stroke: "#3d4356", "stroke-width": 1.2, "class": "dr" }, comb);

  // draw-on prep
  document.querySelectorAll(".dr").forEach(function (p) {
    var L = p.getTotalLength();
    p.style.strokeDasharray = L + " " + L;
    p.style.strokeDashoffset = L;
  });

  // ---- gauges ----
  function makeGauge(hostId, o) {
    var cx = 90, cy = 94, R = 62;
    function pt(f, r) { var a = Math.PI * (1 - f); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; }
    function arc(f0, f1, r) {
      var a = pt(f0, r), b = pt(f1, r);
      return "M " + a[0].toFixed(1) + " " + a[1].toFixed(1) + " A " + r + " " + r + " 0 0 1 " + b[0].toFixed(1) + " " + b[1].toFixed(1);
    }
    var s = '<svg width="180" height="112" viewBox="0 0 180 112">';
    s += '<path d="' + arc(0, 1, R) + '" fill="none" stroke="#2f3442" stroke-width="1.5"/>';
    if (o.red) s += '<path d="' + arc(o.red[0], o.red[1], R) + '" fill="none" stroke="rgba(224,75,56,.8)" stroke-width="4"/>';
    for (var i = 0; i <= 8; i++) {
      var f = i / 8, a = pt(f, R), b = pt(f, R - (i % 2 ? 4 : 8));
      s += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" stroke="#4a5066" stroke-width="1"/>';
    }
    s += '<text x="' + (cx - R) + '" y="' + (cy + 15) + '" text-anchor="middle" font-size="8.5" fill="#6b7284">' + (o.lo || "0") + "</text>";
    s += '<text x="' + (cx + R) + '" y="' + (cy + 15) + '" text-anchor="middle" font-size="8.5" fill="#6b7284">' + (o.hi || "") + "</text>";
    var n = pt(0, R - 13);
    if (o.ghost) s += '<line class="ghostn" x1="' + cx + '" y1="' + cy + '" x2="' + n[0].toFixed(1) + '" y2="' + n[1].toFixed(1) + '" stroke="' + o.ghost + '" stroke-width="1.8" stroke-dasharray="4 3" opacity="0"/>';
    s += '<line class="needle" x1="' + cx + '" y1="' + cy + '" x2="' + n[0].toFixed(1) + '" y2="' + n[1].toFixed(1) + '" stroke="' + o.color + '" stroke-width="2.4" stroke-linecap="round"/>';
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="3.2" fill="#0b0d12" stroke="' + o.color + '" stroke-width="1.4"/></svg>';
    var host = document.getElementById(hostId);
    host.querySelector(".gval").insertAdjacentHTML("beforebegin", s);
    var nd = host.querySelector(".needle");
    gsap.set(nd, { svgOrigin: "90 94" });
    var gh = host.querySelector(".ghostn");
    if (gh) gsap.set(gh, { svgOrigin: "90 94" });
    return { needle: nd, ghost: gh };
  }
  var gT = makeGauge("g-total", { color: "#e0a935", hi: "70 B" });
  var gF = makeGauge("g-flops", { color: "#6fb1ff", hi: "70 B", ghost: "#e04b38" });

  function count(id, from, to, dur, fmt) {
    var o = { v: from }, e = document.getElementById(id);
    return gsap.to(o, { v: to, duration: dur, ease: "power2.inOut",
      onUpdate: function () { e.textContent = fmt(o.v); } });
  }

  var ffnrect = document.getElementById("ffnrect");

  // ---- timeline: 4 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the FFN unzips into router + experts; a token runs top-2
  tl.call(function () { ffnrect.classList.add("unz"); })
    .to("#denselbl", { opacity: 0, duration: .3 })
    .to("#ffnsub", { opacity: .3, duration: .3 }, "<")
    .to("#lead", { strokeDashoffset: 0, duration: .35, ease: "none" })
    .to("#fig rect.dr", { strokeDashoffset: 0, duration: .45, stagger: .06, ease: "power1.inOut" })
    .to("#fans .dr", { strokeDashoffset: 0, duration: .4, stagger: .05, ease: "none" }, "-=0.3")
    .to(".fadein", { opacity: .55, duration: .4, stagger: .02 }, "<")
    .to("#comb .dr", { strokeDashoffset: 0, duration: .4, stagger: .05, ease: "none" }, "-=0.1")
    .to(".lbl", { opacity: 1, duration: .35, stagger: .03 }, "-=0.2")
    .to("#tk0", { keyframes: [
      { opacity: 1, duration: .08 }, { y: 18, duration: .16, ease: "none" },
      { x: 60, duration: .2, ease: "none" }, { y: 44, duration: .18, ease: "none" },
      { opacity: 0, duration: .08 }] })
    .to("#tk1", { keyframes: [
      { opacity: 1, duration: .06 }, { x: -112, y: 143, duration: .38, ease: "power1.inOut" },
      { y: 238, duration: .3, ease: "none" }, { x: 0, y: 266, duration: .25, ease: "power1.inOut" },
      { y: 300, duration: .2, ease: "none" }, { opacity: 0, duration: .08 }] }, "-=0.06")
    .to("#tk2", { keyframes: [
      { opacity: 1, duration: .06 }, { x: 116, y: 143, duration: .38, ease: "power1.inOut" },
      { y: 238, duration: .3, ease: "none" }, { x: 0, y: 266, duration: .25, ease: "power1.inOut" },
      { y: 300, duration: .2, ease: "none" }, { opacity: 0, duration: .08 }] }, "<")
    .to("#expfill2, #expfill5", { opacity: .3, duration: .16, yoyo: true, repeat: 1 }, "-=0.75");
  DECK.markStep(tl);

  // beat 2: the decoupling — total spikes, FLOPs/token stays put
  tl.to("#g-total", { opacity: 1, duration: .4 })
    .to("#g-flops", { opacity: 1, duration: .4 }, "<0.12")
    .add(count("totalval", 0, MX.total, .9, function (v) { return Math.round(v) + " B"; }), "+=0.1")
    .to(gT.needle, { rotation: MX.total / 70 * 180, duration: .9, ease: "power2.inOut" }, "<")
    .add(count("flopsval", 0, MX.active, .9, function (v) { return "∝ " + Math.round(v) + " B active"; }), "<")
    .to(gF.needle, { rotation: MX.active / 70 * 180, duration: .9, ease: "power2.inOut" }, "<")
    .to("#dec .dline", { opacity: 1, duration: .35, stagger: .14 }, "-=0.2");
  DECK.markStep(tl);

  // beat 3: iso-FLOP vs iso-quality; the dense ghost runs 5x hotter
  tl.to("#plateA", { opacity: .75, duration: .4 })
    .to("#plateB", { opacity: 1, duration: .4 }, "<0.15")
    .to("#never", { opacity: 1, duration: .35 })
    .to("#ghost", { opacity: 1, duration: .45 })
    .to(gF.ghost, { opacity: .9, rotation: MX.dense / 70 * 180, duration: .9, ease: "power2.inOut" }, "<0.2")
    .to("#x5tag", { opacity: 1, duration: .35 }, "-=0.3");
  DECK.markStep(tl);

  // beat 4: why everyone does it — and what it keeps
  tl.to("#chip1", { opacity: 1, y: 0, duration: .45, ease: "power2.out" })
    .to("#chip2", { opacity: 1, duration: .45, ease: "power2.out" }, "+=0.15");

  DECK.register(tl, {
    reset: function () { ffnrect.classList.remove("unz"); }
  });
</script>
</body>
</html>
