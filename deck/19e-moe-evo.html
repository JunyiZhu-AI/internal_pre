<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The sparsity race</title>
<link rel="stylesheet" href="shared/deck.css?v=3">
<style>
  .an { position: absolute; font-size: 10px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: #9aa1b5; }
  .figno { position: absolute; font: 600 9px ui-monospace, Menlo, monospace; letter-spacing: .22em; color: #525a6e; text-transform: uppercase; }
  .bp {
    position: absolute; border: 1px solid var(--line); border-radius: 8px;
    background-image:
      linear-gradient(rgba(154,161,181,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(154,161,181,.045) 1px, transparent 1px);
    background-size: 26px 26px; background-color: rgba(27,30,39,.32);
  }
  svg text { font-family: ui-monospace, Menlo, monospace; }

  .axcard { width: 340px; height: 166px; opacity: 0; }
  .axcard .an { left: 12px; top: 10px; color: #c7cce0; }
  .axcard svg { position: absolute; left: 10px; top: 32px; }
  .axcard .tx { position: absolute; left: 172px; top: 46px; width: 158px;
    font-size: 11px; color: #9aa1b5; line-height: 1.5; }
  .axcard .tg { position: absolute; left: 172px; top: 118px;
    font: 600 9px ui-monospace, Menlo, monospace; letter-spacing: .14em; color: #525a6e; text-transform: uppercase; }
  #ax1 { left: 44px; top: 104px; }
  #ax2 { left: 44px; top: 282px; }
  #ax3 { left: 44px; top: 460px; }
  .scell { animation: sPulse 2s ease-in-out infinite; }
  @keyframes sPulse { 50% { opacity: .45; } }

  #chart { left: 420px; top: 104px; width: 816px; height: 522px; }
  #chart svg { position: absolute; inset: 0; }

  #interp { position: absolute; left: 872px; top: 128px; width: 352px;
    font-size: 12.5px; font-style: italic; color: var(--accent); line-height: 1.5; opacity: 0; }

  #callout { position: absolute; left: 1096px; top: 300px; width: 128px;
    border: 1px solid rgba(47,214,176,.55); border-radius: 6px; padding: 7px 9px;
    background: rgba(11,13,18,.88); opacity: 0; }
  #callout .c1 { font-size: 9.5px; font-weight: 700; letter-spacing: .1em; color: var(--accent); text-transform: uppercase; }
  #callout .c2 { font: 600 9.5px ui-monospace, Menlo, monospace; color: #c7cce0; margin-top: 4px; line-height: 1.5; }
  #callout .c3 { font: 700 10px ui-monospace, Menlo, monospace; color: var(--accent); margin-top: 4px; }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">The sparsity race</div>
  <div class="slide-sub">three axes of MoE evolution — and the race they produced</div>

  <div class="bp axcard" id="ax1">
    <div class="an" id="ax1t"></div>
    <svg width="150" height="122" viewBox="0 0 150 122"></svg>
    <div class="tx">split each expert into many small ones — more combinations</div>
    <div class="tg">deepseekmoe</div>
  </div>
  <div class="bp axcard" id="ax2">
    <div class="an" id="ax2t"></div>
    <svg width="150" height="122" viewBox="0 0 150 122"></svg>
    <div class="tx">one always-on generalist — routed experts specialize</div>
    <div class="tg">common knowledge</div>
  </div>
  <div class="bp axcard" id="ax3">
    <div class="an" id="ax3t"></div>
    <svg width="150" height="122" viewBox="0 0 150 122"></svg>
    <div class="tx">more routed experts, active ≈ constant</div>
    <div class="tg">activation rate ↓</div>
  </div>

  <div class="bp" id="chart">
    <svg viewBox="0 0 816 522" width="816" height="522"></svg>
    <div class="figno" style="left:14px; bottom:9px;">Fig. 19</div>
  </div>
  <div id="interp"></div>
  <div id="callout">
    <div class="c1" id="co1"></div>
    <div class="c2" id="co2"></div>
    <div class="c3" id="co3"></div>
  </div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/moe.js?v=3"></script>
<script src="shared/manifest.js?v=3"></script>
<script src="shared/deck.js?v=3"></script>
<script>
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, at, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in at) e.setAttribute(k, at[k]);
    parent.appendChild(e);
    return e;
  }

  // ---- axis cards ----
  document.getElementById("ax1t").textContent = "axis 1 · " + MOE.axes[0][0];
  document.getElementById("ax2t").textContent = "axis 2 · " + MOE.axes[1][0];
  document.getElementById("ax3t").textContent = "axis 3 · " + MOE.axes[2][0];

  var s1 = document.querySelector("#ax1 svg");
  el("rect", { x: 14, y: 6, width: 104, height: 104, fill: "none", stroke: "#9aa1b5", "stroke-width": 1.2, "class": "dr g1" }, s1);
  el("line", { x1: 66, y1: 6, x2: 66, y2: 110, stroke: "#9aa1b5", "stroke-width": 1, "class": "dr g1" }, s1);
  el("line", { x1: 14, y1: 58, x2: 118, y2: 58, stroke: "#9aa1b5", "stroke-width": 1, "class": "dr g1" }, s1);
  [19, 32, 45, 71, 84, 97].forEach(function (o) {
    el("line", { x1: 14 + o, y1: 6, x2: 14 + o, y2: 110, stroke: "#3d4356", "stroke-width": .6, "class": "dr g2" }, s1);
    el("line", { x1: 14, y1: 6 + o, x2: 118, y2: 6 + o, stroke: "#3d4356", "stroke-width": .6, "class": "dr g2" }, s1);
  });

  var s2 = document.querySelector("#ax2 svg");
  for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) {
    el("rect", { x: 14 + c * 36, y: 6 + r * 36, width: 30, height: 30, fill: "none",
      stroke: "#3d4356", "stroke-width": 1, "class": "dr" }, s2);
  }
  el("rect", { x: 14, y: 6, width: 30, height: 30, fill: "#2fd6b0", opacity: .3, "class": "scell" }, s2);
  el("rect", { x: 14, y: 6, width: 30, height: 30, fill: "none", stroke: "#2fd6b0", "stroke-width": 1.5, "class": "dr" }, s2);
  var st = el("text", { x: 29, y: 26, "text-anchor": "middle", fill: "#2fd6b0", "font-size": 12, "class": "clbl", opacity: 0 }, s2);
  st.textContent = "S";
  var st2 = el("text", { x: 29, y: 120, "text-anchor": "middle", fill: "#6b7284", "font-size": 8.5, "class": "clbl", opacity: 0 }, s2);
  st2.textContent = "ALWAYS ON";

  var s3 = document.querySelector("#ax3 svg");
  for (var rr = 0; rr < 2; rr++) for (var cc = 0; cc < 13; cc++) {
    var lit = (rr === 0 && cc === 3) || (rr === 1 && cc === 9);
    el("rect", { x: 8 + cc * 10.6, y: 38 + rr * 20, width: 8, height: 13,
      fill: lit ? "#2fd6b0" : "none", "fill-opacity": lit ? .8 : 0,
      stroke: lit ? "#2fd6b0" : "#3d4356", "stroke-width": lit ? 1.2 : .8, "class": "dr" }, s3);
  }

  // ---- the race chart ----
  var svg = document.querySelector("#chart svg");
  var X0 = 86, Y0 = 432, XMAX = 790, SCALE = 370 / 3000;
  function y(v) { return Y0 - v * SCALE; }

  // axes + gridlines
  var gAxes = el("g", {}, svg);
  el("line", { x1: X0, y1: 46, x2: X0, y2: Y0, stroke: "#4a5066", "stroke-width": 1.2, "class": "dr ax" }, gAxes);
  el("line", { x1: X0, y1: Y0, x2: XMAX, y2: Y0, stroke: "#4a5066", "stroke-width": 1.2, "class": "dr ax" }, gAxes);
  [[1000, "1 T"], [2000, "2 T"], [3000, "3 T"]].forEach(function (t) {
    el("line", { x1: X0, y1: y(t[0]), x2: XMAX, y2: y(t[0]), stroke: "#2a2e3b", "stroke-width": .8,
      "stroke-dasharray": "4 5", "class": "grid", opacity: 0 }, gAxes);
    var tx = el("text", { x: X0 - 8, y: y(t[0]) + 3, "text-anchor": "end", fill: "#6b7284", "font-size": 9.5, "class": "grid", opacity: 0 }, gAxes);
    tx.textContent = t[1];
  });
  var ylab = el("text", { x: X0 - 8, y: 40, "text-anchor": "end", fill: "#6b7284", "font-size": 9, "class": "grid", opacity: 0 }, gAxes);
  ylab.textContent = "PARAMS";

  var CXS = [212, 422, 632], BW = 84;
  function fmtT(v) { return v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + " T" : v + " B"; }
  var bars = [];
  MOE.evo.forEach(function (m, i) {
    var cx = CXS[i], h = m.total * SCALE;
    var g = el("g", { "class": "mg" + i }, svg);
    var bar = el("rect", { x: cx - BW / 2, y: y(m.total), width: BW, height: h,
      fill: m.color, "fill-opacity": .1, stroke: m.color, "stroke-width": 1.4 }, g);
    bars.push(bar);
    var v = el("text", { x: cx, y: y(m.total) - 10, "text-anchor": "middle", fill: m.color,
      "font-size": 14, "font-weight": 700, "class": "ml" + i, opacity: 0 }, g);
    v.textContent = fmtT(m.total) + " total";
    var n = el("text", { x: cx, y: Y0 + 20, "text-anchor": "middle", fill: m.color, "font-size": 11.5,
      "font-weight": 700, "class": "ml" + i, opacity: 0 }, g);
    n.textContent = m.name;
    var yr = el("text", { x: cx, y: Y0 + 34, "text-anchor": "middle", fill: "#6b7284", "font-size": 9.5,
      "class": "ml" + i, opacity: 0 }, g);
    yr.textContent = m.year;
    // activation strip
    var sw = 150, sx = cx - sw / 2, sy = Y0 + 46;
    var gs = el("g", { "class": "ml" + i, opacity: 0 }, g);
    el("rect", { x: sx, y: sy, width: sw, height: 11, fill: "none", stroke: "#3d4356", "stroke-width": 1 }, gs);
    var frac = m.topk / m.routed;
    el("rect", { x: sx + 1, y: sy + 1, width: Math.max(2.5, frac * sw), height: 9, fill: "#2fd6b0" }, gs);
    var pc = el("text", { x: sx + sw + 8, y: sy + 10, fill: "#2fd6b0", "font-size": 9.5 }, gs);
    pc.textContent = (frac * 100).toFixed(1) + "%";
    var cap = el("text", { x: cx, y: sy + 28, "text-anchor": "middle", fill: "#8a91a5", "font-size": 9.5 }, gs);
    cap.textContent = m.routed + " routed · top-" + m.topk + " + " + m.shared + " shared";
    // active marker on the main chart
    el("rect", { x: cx - 5, y: y(m.active) - 2, width: 10, height: 4, fill: "#2fd6b0", "class": "ml" + i, opacity: 0 }, g);
  });

  // detail inset (beat 4)
  var gD = el("g", {}, svg);
  el("ellipse", { cx: 422, cy: 427, rx: 250, ry: 13, fill: "none", stroke: "#2fd6b0",
    "stroke-width": 1, "stroke-dasharray": "5 5", "class": "det", opacity: 0 }, gD);
  el("path", { d: "M 330 414 C 300 340, 290 260, 286 202", fill: "none", stroke: "#3d4356",
    "stroke-width": .9, "stroke-dasharray": "3 4", "class": "det", opacity: 0 }, gD);
  var gI = el("g", { "class": "det", opacity: 0 }, gD);
  el("rect", { x: 150, y: 62, width: 280, height: 138, rx: 4, fill: "#12141a", "fill-opacity": .92,
    stroke: "#2fd6b0", "stroke-opacity": .5, "stroke-width": 1, "stroke-dasharray": "6 5" }, gI);
  var dt = el("text", { x: 164, y: 82, fill: "#9aa1b5", "font-size": 9, "letter-spacing": "1.5" }, gI);
  dt.textContent = "DETAIL A — ACTIVE PARAMS (B)";
  el("line", { x1: 190, y1: 96, x2: 190, y2: 178, stroke: "#4a5066", "stroke-width": 1 }, gI);
  el("line", { x1: 190, y1: 178, x2: 410, y2: 178, stroke: "#4a5066", "stroke-width": 1 }, gI);
  [[0, 178], [25, 137], [50, 96]].forEach(function (t) {
    var tx = el("text", { x: 184, y: t[1] + 3, "text-anchor": "end", fill: "#6b7284", "font-size": 8.5 }, gI);
    tx.textContent = t[0];
  });
  var IPX = [225, 305, 385];
  function iy(v) { return 178 - v * 1.64; }
  var pts = MOE.evo.map(function (m, i) { return IPX[i] + "," + iy(m.active); }).join(" ");
  el("polyline", { points: pts, fill: "none", stroke: "#2fd6b0", "stroke-width": 1.6, "class": "dr dline" }, gI);
  MOE.evo.forEach(function (m, i) {
    el("circle", { cx: IPX[i], cy: iy(m.active), r: 3.5, fill: "#12141a", stroke: "#2fd6b0", "stroke-width": 1.4 }, gI);
    var t = el("text", { x: IPX[i], y: iy(m.active) - 9, "text-anchor": "middle", fill: "#c7cce0", "font-size": 10, "font-weight": 700 }, gI);
    t.textContent = m.active;
  });
  var flat = el("text", { x: 350, y: 168, "text-anchor": "middle", fill: "#2fd6b0", "font-size": 10, "font-style": "italic" }, gI);
  flat.textContent = "≈ flat";

  // callout + interp text
  var K3 = MOE.evo[2];
  document.getElementById("co1").textContent = K3.label;
  document.getElementById("co2").innerHTML = K3.routed + " routed<br>top-" + K3.topk + " + " + K3.shared + " shared";
  document.getElementById("co3").textContent = MOE.k3rate;
  document.getElementById("interp").textContent = "“" + MOE.interp + "”";

  // draw-on prep
  document.querySelectorAll(".dr").forEach(function (p) {
    var L = p.getTotalLength();
    p.style.strokeDasharray = L + " " + L;
    p.style.strokeDashoffset = L;
  });
  bars.forEach(function (b) { gsap.set(b, { transformOrigin: "50% 100%", scaleY: 0 }); });

  // ---- timeline: 4 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the three axes of evolution
  tl.to("#ax1", { opacity: 1, duration: .4 })
    .to("#ax1 .g1", { strokeDashoffset: 0, duration: .4, stagger: .06, ease: "none" }, "-=0.2")
    .to("#ax1 .g2", { strokeDashoffset: 0, duration: .3, stagger: .02, ease: "none" })
    .to("#ax2", { opacity: 1, duration: .4 }, "-=0.2")
    .to("#ax2 .dr", { strokeDashoffset: 0, duration: .35, stagger: .03, ease: "none" }, "-=0.2")
    .to("#ax2 .clbl", { opacity: 1, duration: .3 })
    .to("#ax3", { opacity: 1, duration: .4 }, "-=0.25")
    .to("#ax3 .dr", { strokeDashoffset: 0, duration: .3, stagger: .015, ease: "none" }, "-=0.2");
  DECK.markStep(tl);

  // beat 2: the chart draws; V3 then K2 enter the race
  tl.to(".ax", { strokeDashoffset: 0, duration: .5, ease: "power1.inOut" })
    .to(".grid", { opacity: 1, duration: .35 }, "-=0.2")
    .to(bars[0], { scaleY: 1, duration: .55, ease: "power2.out" })
    .to(".ml0", { opacity: 1, duration: .35, stagger: .05 }, "-=0.25")
    .to(bars[1], { scaleY: 1, duration: .55, ease: "power2.out" }, "+=0.15")
    .to(".ml1", { opacity: 1, duration: .35, stagger: .05 }, "-=0.25");
  DECK.markStep(tl);

  // beat 3: K3 — 2.8T, and the activation rate still falls
  tl.to(bars[2], { scaleY: 1, duration: .8, ease: "power2.inOut" })
    .to(".ml2", { opacity: 1, duration: .35, stagger: .05 }, "-=0.3")
    .to("#callout", { opacity: 1, duration: .4 });
  DECK.markStep(tl);

  // beat 4: detail view — active is flat; the interpretation
  tl.to(".det", { opacity: 1, duration: .45, stagger: .12 })
    .to(".dline", { strokeDashoffset: 0, duration: .6, ease: "power1.inOut" }, "-=0.2")
    .to("#interp", { opacity: 1, duration: .5 });

  DECK.register(tl, {});
</script>
</body>
</html>
