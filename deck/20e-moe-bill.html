<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoE's hidden bill</title>
<link rel="stylesheet" href="shared/deck.css?v=3">
<link rel="stylesheet" href="shared/bottlenecks.css?v=3">
<style>
  .an { position: absolute; font-size: 10px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: #9aa1b5; }
  .figno { position: absolute; font: 600 9px ui-monospace, Menlo, monospace; letter-spacing: .22em; color: #525a6e; text-transform: uppercase; }
  .bp {
    position: absolute; border: 1px solid var(--line); border-radius: 8px;
    background-image:
      linear-gradient(rgba(154,161,181,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(154,161,181,.045) 1px, transparent 1px);
    background-size: 26px 26px; background-color: rgba(27,30,39,.32);
  }
  svg text { font-family: ui-monospace, Menlo, monospace; }

  .pan { position: absolute; top: 104px; width: 289px; height: 178px; opacity: 0; }
  .pan .an { left: 12px; top: 10px; }
  .pan .bn-icon { position: absolute; left: 4px; top: 56px; transform: scale(.82); }
  .pan .ghost { position: absolute; right: 12px; top: 34px; }
  .pan .gval { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
    font: 600 10px ui-monospace, Menlo, monospace; color: #6b7284; }
  .pan .gsvg { position: absolute; left: 100px; top: 36px; }

  #modesw { position: absolute; left: 44px; top: 296px; width: 270px; height: 52px; opacity: 0; }
  #modesw text { font-weight: 700; letter-spacing: 2px; }

  #capzone { left: 44px; top: 362px; width: 580px; height: 254px; opacity: 0; }
  #capzone svg { position: absolute; inset: 0; }
  #commzone { left: 648px; top: 362px; width: 588px; height: 254px; opacity: 0; }
  #commzone svg { position: absolute; inset: 0; }
  .a2a line.flow { stroke-dasharray: 7 6; animation: a2aDash 0.8s linear infinite; }
  @keyframes a2aDash { to { stroke-dashoffset: -26; } }

  #frame { position: absolute; left: 44px; top: 636px; width: 930px; opacity: 0; }
  #frame .f1 { font: 700 15px ui-monospace, Menlo, monospace; color: #e8eaf0; }
  #frame .f1 .cb { color: #3987e5; opacity: .65; }
  #frame .f1 .ca { color: #e0a935; }
  #frame .f1 .cc { color: #9085e9; }
  #resp { position: absolute; left: 44px; top: 664px; width: 930px;
    font-size: 11.5px; color: var(--ink-2); font-style: italic; opacity: 0; }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">MoE's hidden bill</div>
  <div class="slide-sub">the four meters, revisited — the model turns MoE</div>

  <div id="panels"></div>

  <svg id="modesw" viewBox="0 0 270 52">
    <text id="swdense" x="98" y="31" text-anchor="end" font-size="11" fill="#9aa1b5">DENSE</text>
    <circle cx="135" cy="26" r="14" fill="none" stroke="#4a5066" stroke-width="1.4"/>
    <line id="swptr" x1="135" y1="26" x2="126" y2="15" stroke="#e8eaf0" stroke-width="2.2" stroke-linecap="round"/>
    <text id="swmoe" x="172" y="31" font-size="11" fill="#6b7284">MOE</text>
  </svg>

  <div class="bp" id="capzone">
    <div class="an" style="color:#e0a935;">resident weights</div>
    <svg viewBox="0 0 580 254" width="580" height="254"></svg>
    <div class="figno" style="left:14px; bottom:8px;">Fig. 20a — capacity</div>
  </div>

  <div class="bp" id="commzone">
    <div class="an" style="color:#9085e9;">expert shards</div>
    <svg viewBox="0 0 588 254" width="588" height="254" class="a2a"></svg>
    <div class="figno" style="left:14px; bottom:8px;">Fig. 20b — interconnect</div>
  </div>

  <div id="frame"><div class="f1" id="framet"></div></div>
  <div id="resp"></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/moe.js?v=3"></script>
<script src="shared/bottlenecks.js?v=3"></script>
<script src="shared/manifest.js?v=3"></script>
<script src="shared/deck.js?v=3"></script>
<script>
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, at, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in at) e.setAttribute(k, at[k]);
    parent.appendChild(e);
    return e;
  }

  // ---- gauge (instrument face) ----
  function gaugeSVG(color) {
    var cx = 90, cy = 94, R = 62;
    function pt(f, r) { var a = Math.PI * (1 - f); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; }
    function arc(f0, f1, r) {
      var a = pt(f0, r), b = pt(f1, r);
      return "M " + a[0].toFixed(1) + " " + a[1].toFixed(1) + " A " + r + " " + r + " 0 0 1 " + b[0].toFixed(1) + " " + b[1].toFixed(1);
    }
    var s = '<svg class="gsvg" width="180" height="112" viewBox="0 0 180 112">';
    s += '<path d="' + arc(0, 1, R) + '" fill="none" stroke="#2f3442" stroke-width="1.5"/>';
    s += '<path d="' + arc(.78, 1, R) + '" fill="none" stroke="rgba(224,75,56,.8)" stroke-width="4"/>';
    for (var i = 0; i <= 8; i++) {
      var f = i / 8, a = pt(f, R), b = pt(f, R - (i % 2 ? 4 : 8));
      s += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" stroke="#4a5066" stroke-width="1"/>';
    }
    var n = pt(0, R - 13);
    s += '<line class="needle" x1="' + cx + '" y1="' + cy + '" x2="' + n[0].toFixed(1) + '" y2="' + n[1].toFixed(1) + '" stroke="' + color + '" stroke-width="2.4" stroke-linecap="round"/>';
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="3.2" fill="#0b0d12" stroke="' + color + '" stroke-width="1.4"/></svg>';
    return s;
  }

  // ---- four instrument panels from BN.list ----
  var DENSE_AT = { compute: .64, bw: .56, cap: .46, comm: .2 };
  var host = document.getElementById("panels");
  var needles = {};
  BN.list.forEach(function (b, i) {
    var d = document.createElement("div");
    d.className = "pan bp";
    d.id = "pan-" + b.key;
    d.style.left = (44 + i * 301) + "px";
    d.innerHTML = '<div class="an" style="color:' + b.color + '">' + b.name + "</div>" +
      BN.iconHTML(b.key) + gaugeSVG(b.color) +
      '<div class="gval">' + b.unit + "</div>";
    host.appendChild(d);
    var nd = d.querySelector(".needle");
    gsap.set(nd, { svgOrigin: "90 94", rotation: DENSE_AT[b.key] * 180 });
    needles[b.key] = nd;
  });

  gsap.set("#swptr", { svgOrigin: "135 26" });

  // ---- capacity schematic ----
  var K3 = MOE.evo[2];
  var capParts = MOE.bill.capMath.split(" → ");         // ["2.8T @ 4-bit ≈ 1.4 TB of weights", "≥ 8 B200s (192 GB) before KV or activations"]
  var idleLine = MOE.bill.cap.split(" — ")[1];          // "even though ~98% are idle for any given token"
  var cs = document.querySelector("#capzone svg");
  var capg = el("g", {}, cs);
  var t1 = el("text", { x: 20, y: 48, fill: "#e0a935", "font-size": 12, "font-weight": 700, "class": "cfade", opacity: 0 }, capg);
  t1.textContent = capParts[0];
  el("rect", { x: 20, y: 58, width: 540, height: 26, fill: "#c98500", "fill-opacity": .1,
    stroke: "#e0a935", "stroke-width": 1.2, "class": "cdr" }, capg);
  for (var i = 1; i < 20; i++)
    el("line", { x1: 20 + i * 27, y1: 58, x2: 20 + i * 27, y2: 84, stroke: "#c98500", "stroke-opacity": .25, "stroke-width": .8, "class": "cdr" }, capg);
  el("rect", { x: 21, y: 59, width: 9.7, height: 24, fill: "#2fd6b0", "class": "cfade", opacity: 0 }, capg);
  var t2 = el("text", { x: 21, y: 100, fill: "#2fd6b0", "font-size": 9.5, "class": "cfade", opacity: 0 }, capg);
  t2.textContent = "active " + K3.active + " B";
  var t3 = el("text", { x: 560, y: 100, "text-anchor": "end", fill: "#9aa1b5", "font-size": 10.5, "font-style": "italic", "class": "cfade", opacity: 0 }, capg);
  t3.textContent = idleLine;
  // 8 x B200 modules
  var bg = el("g", {}, cs);
  for (var m = 0; m < 8; m++) {
    var bx = 20 + m * 68;
    el("rect", { x: bx, y: 138, width: 58, height: 56, rx: 3, fill: "none", stroke: "#e0a935",
      "stroke-opacity": .75, "stroke-width": 1.2, "class": "cdr b200r" }, bg);
    var bt = el("text", { x: bx + 29, y: 162, "text-anchor": "middle", fill: "#c7cce0", "font-size": 9.5, "class": "cfade", opacity: 0 }, bg);
    bt.textContent = "B200";
    var bc = el("text", { x: bx + 29, y: 178, "text-anchor": "middle", fill: "#6b7284", "font-size": 8.5, "class": "cfade", opacity: 0 }, bg);
    bc.textContent = "192 GB";
  }
  el("path", { d: "M 20 210 V 218 H 564 V 210", fill: "none", stroke: "#4a5066", "stroke-width": 1, "class": "cdr" }, bg);
  var t4 = el("text", { x: 564, y: 236, "text-anchor": "end", fill: "#e0a935", "font-size": 11, "font-weight": 700, "class": "cfade", opacity: 0 }, bg);
  t4.textContent = capParts[1];

  // ---- interconnect schematic ----
  var commParts = MOE.bill.comm.split(" → ");           // ["experts live on different GPUs", "every MoE layer is an all-to-all token exchange"]
  var ms = document.querySelector("#commzone svg");
  var CTRS = [[150, 78], [438, 78], [150, 178], [438, 178]];
  // all-to-all links first (under boxes)
  var links = el("g", {}, ms);
  for (var a = 0; a < 4; a++) for (var b = a + 1; b < 4; b++) {
    el("line", { x1: CTRS[a][0], y1: CTRS[a][1], x2: CTRS[b][0], y2: CTRS[b][1],
      stroke: "#9085e9", "stroke-width": 1.4, "stroke-opacity": .75, "class": "mfade", opacity: 0 }, links);
  }
  CTRS.forEach(function (c, gi) {
    var g = el("g", {}, ms);
    el("rect", { x: c[0] - 65, y: c[1] - 34, width: 130, height: 68, rx: 4, fill: "#12141a",
      stroke: "#9aa1b5", "stroke-opacity": .8, "stroke-width": 1.1, "class": "mdr" }, g);
    for (var e = 0; e < 4; e++) {
      el("rect", { x: c[0] - 52 + e * 23, y: c[1] - 20, width: 16, height: 16, rx: 2, fill: "none",
        stroke: "#9085e9", "stroke-width": 1.1, "class": "mdr" }, g);
    }
    var gt = el("text", { x: c[0], y: c[1] + 22, "text-anchor": "middle", fill: "#6b7284", "font-size": 9, "class": "mfade", opacity: 0 }, g);
    gt.textContent = "GPU " + gi + " · experts";
  });
  var mt = el("text", { x: 574, y: 242, "text-anchor": "end", fill: "#9085e9", "font-size": 11, "font-weight": 700, "class": "mfade", opacity: 0 }, ms);
  mt.textContent = commParts[1];

  // ---- frame + response ----
  document.getElementById("framet").innerHTML = MOE.bill.frame
    .replace("compute", '<span class="cb">compute</span>')
    .replace("capacity", '<span class="ca">capacity</span>')
    .replace("interconnect", '<span class="cc">interconnect</span>');
  document.getElementById("resp").textContent = MOE.bill.response;

  // draw-on prep
  document.querySelectorAll(".cdr, .mdr").forEach(function (p) {
    var L = p.getTotalLength();
    p.style.strokeDasharray = L + " " + L;
    p.style.strokeDashoffset = L;
  });

  function flowOn() {
    document.querySelectorAll("#commzone .a2a line.mfade").forEach(function (l) { l.classList.add("flow"); });
  }
  function flowOff() {
    document.querySelectorAll("#commzone .flow").forEach(function (l) { l.classList.remove("flow"); });
  }

  // ---- timeline: 4 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the instruments return; the switch flips to MoE; compute relaxes
  tl.to(".pan", { opacity: 1, duration: .45, stagger: .1, ease: "power2.out" })
    .to("#modesw", { opacity: 1, duration: .35 }, "-=0.2")
    .to("#swptr", { rotation: 66, duration: .6, ease: "back.out(1.6)", delay: .15 })
    .to("#swmoe", { fill: "#2fd6b0", duration: .3 }, "<0.3")
    .to("#swdense", { opacity: .35, duration: .3 }, "<")
    .to(needles.compute, { rotation: .16 * 180, duration: .9, ease: "power2.inOut" })
    .to("#pan-compute", { opacity: .55, duration: .5 }, "<0.3");
  DECK.markStep(tl);

  // beat 2: capacity flares — all of it resident, ~98% idle
  tl.to("#capzone", { opacity: 1, duration: .4 })
    .to("#capzone .cdr", { strokeDashoffset: 0, duration: .5, stagger: .015, ease: "none" }, "-=0.1")
    .to("#capzone .cfade", { opacity: 1, duration: .35, stagger: .03 }, "-=0.2")
    .to(needles.cap, { rotation: .93 * 180, duration: .9, ease: "power2.inOut" }, "-=0.6")
    .to("#pan-cap", { boxShadow: "0 0 22px rgba(201,133,0,.35)", borderColor: "rgba(224,169,53,.8)", duration: .4 }, "<0.4");
  DECK.markStep(tl);

  // beat 3: interconnect flares — every MoE layer is an all-to-all
  tl.to("#commzone", { opacity: 1, duration: .4 })
    .to("#commzone .mdr", { strokeDashoffset: 0, duration: .5, stagger: .012, ease: "none" }, "-=0.1")
    .to("#commzone .mfade", { opacity: 1, duration: .35, stagger: .04 }, "-=0.2")
    .call(flowOn)
    .to(needles.comm, { rotation: .9 * 180, duration: .9, ease: "power2.inOut" }, "-=0.7")
    .to("#pan-comm", { boxShadow: "0 0 22px rgba(144,133,233,.35)", borderColor: "rgba(144,133,233,.8)", duration: .4 }, "<0.4");
  DECK.markStep(tl);

  // beat 4: the reframe — and where the talk goes next
  tl.to("#frame", { opacity: 1, y: 0, duration: .5, ease: "power2.out" })
    .to("#resp", { opacity: 1, duration: .4 }, "+=0.2");

  DECK.register(tl, { reset: flowOff });
</script>
</body>
</html>
