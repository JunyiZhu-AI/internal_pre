<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expert Parallelism</title>
<link rel="stylesheet" href="shared/deck.css?v=3">
<style>
  /* ---- GPU districts ---- */
  #rack { position: absolute; left: 44px; top: 138px; width: 740px; height: 370px; }
  .gpu {
    position: absolute; width: 168px; height: 158px; border-radius: 10px;
    border: 1.5px solid rgba(57,135,229,0.45); background: #10141d; padding: 26px 10px 24px; opacity: 0;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  .gpu .gl { position: absolute; top: 6px; left: 10px; font: 700 10px ui-monospace, monospace; color: #6fb1ff; }
  .gpu .ge { position: absolute; bottom: 5px; right: 10px; font: 600 9.5px ui-monospace, monospace; color: rgba(224,169,53,0.8); }
  .chip { border-radius: 3px; background: rgba(201,133,0,0.3); border: 1px solid rgba(201,133,0,0.35); transform: scale(0); }
  #drape {
    position: absolute; left: 44px; top: 108px; width: 740px; text-align: center;
    font: 700 12.5px ui-monospace, monospace; color: #e0a935; opacity: 0;
  }
  #mesh { position: absolute; left: 44px; top: 138px; width: 740px; height: 370px; pointer-events: none; }
  #mesh line { stroke: rgba(144,133,233,0.35); stroke-width: 1.2; }
  .fly { position: absolute; left: 0; top: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 9px rgba(47,214,176,0.9); opacity: 0; z-index: 6; }

  /* phase chips */
  #phases { position: absolute; left: 44px; top: 524px; width: 740px; display: flex; gap: 14px; justify-content: center; }
  .ph { font: 700 12px ui-monospace, monospace; border: 1.5px solid var(--line); color: #5b6172; border-radius: 999px; padding: 4px 14px; background: rgba(27,30,39,0.8); opacity: 0; }
  #ph1.hot { color: #9085e9; border-color: rgba(144,133,233,0.8); }
  #ph2.hot { color: #6fb1ff; border-color: rgba(111,177,255,0.8); }
  #ph3.hot { color: var(--accent); border-color: rgba(47,214,176,0.8); }
  #phases .arr { color: #3a3f4f; font-size: 14px; align-self: center; opacity: 0; }

  /* ---- vs TP (right) ---- */
  .vsrow { position: absolute; left: 830px; width: 406px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; opacity: 0; }
  #vstp { top: 138px; filter: grayscale(0.25); }
  #vsep { top: 240px; border-color: rgba(47,214,176,0.6); }
  .vsrow .vn { font: 700 13px ui-monospace, monospace; }
  #vstp .vn { color: #8a91a5; } #vsep .vn { color: var(--accent); }
  .vsrow .vd { margin-top: 5px; font-size: 12px; color: #c7cce0; line-height: 1.45; }
  #nvl {
    position: absolute; left: 830px; top: 348px; font: 600 11px ui-monospace, monospace;
    color: #9085e9; border: 1.5px solid rgba(144,133,233,0.5); border-radius: 999px;
    padding: 4px 12px; background: rgba(20,18,32,0.8); opacity: 0;
  }

  /* ---- overlap gantt ---- */
  #gantt { position: absolute; left: 830px; top: 420px; width: 406px; height: 190px; opacity: 0; }
  #gantt .gt { font-size: 11.5px; color: var(--ink-2); margin-bottom: 10px; line-height: 1.4; }
  .lane { position: absolute; left: 0; right: 0; height: 30px; }
  #laneC { top: 58px; } #laneN { top: 96px; }
  .lane .ll { position: absolute; left: 0; top: 7px; font: 700 10px ui-monospace, monospace; color: var(--ink-2); width: 62px; }
  .gblk {
    position: absolute; top: 0; height: 26px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font: 700 9.5px ui-monospace, monospace; opacity: 0;
  }
  .gblk.c { background: rgba(57,135,229,0.3); border: 1px solid rgba(57,135,229,0.7); color: #9ec7f5; }
  .gblk.n { background: rgba(144,133,233,0.22); border: 1px solid rgba(144,133,233,0.6); color: #b7aff5; }
  #gaxis { position: absolute; left: 66px; right: 0; top: 134px; border-top: 1px solid var(--line); }
  #gaxis span { position: absolute; top: 3px; font: 500 9px ui-monospace, monospace; color: #5b6172; }

  /* ---- codesign line ---- */
  #codesign {
    position: absolute; left: 44px; top: 668px; width: 1100px; font-size: 13.5px; font-weight: 600;
    color: var(--accent); opacity: 0; display: flex; gap: 10px; align-items: baseline;
  }
  #codesign .mark { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">Expert Parallelism</div>
  <div class="slide-sub" id="sub"></div>

  <div id="drape"></div>
  <div id="rack"><svg id="mesh" width="740" height="370"></svg></div>

  <div id="phases">
    <span class="ph" id="ph1">dispatch · all-to-all</span><span class="arr">→</span>
    <span class="ph" id="ph2">compute at experts</span><span class="arr">→</span>
    <span class="ph" id="ph3">combine back</span>
  </div>

  <div class="vsrow" id="vstp"><div class="vn"></div><div class="vd"></div></div>
  <div class="vsrow" id="vsep"><div class="vn"></div><div class="vd"></div></div>
  <div id="nvl"></div>

  <div id="gantt">
    <div class="gt"></div>
    <div class="lane" id="laneC"><span class="ll">compute</span></div>
    <div class="lane" id="laneN"><span class="ll">network</span></div>
    <div id="gaxis"><span style="left:0">micro-batches →</span></div>
  </div>

  <div id="codesign"><span class="mark"></span><span></span></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/moe.js?v=3"></script>
<script src="shared/gpus.js?v=3"></script>
<script src="shared/manifest.js?v=3"></script>
<script src="shared/deck.js?v=3"></script>
<script>
  document.getElementById("sub").textContent = MOE.ep.what;
  document.getElementById("drape").textContent = "the 2.8T model drapes across 8 GPUs — 112 experts each";
  document.querySelector("#vstp .vn").textContent = MOE.ep.vsTP[0][0];
  document.querySelector("#vstp .vd").textContent = MOE.ep.vsTP[0][1];
  document.querySelector("#vsep .vn").textContent = MOE.ep.vsTP[1][0];
  document.querySelector("#vsep .vd").textContent = MOE.ep.vsTP[1][1];
  document.getElementById("nvl").textContent = GPUS.nvl72.name + " · " + GPUS.nvl72.nvlink;
  document.querySelector("#gantt .gt").textContent = MOE.ep.reality;
  document.querySelector("#codesign span:last-child").textContent = MOE.ep.codesign;

  // ---- build 8 GPU districts (rack-local coords) ----
  var rack = document.getElementById("rack");
  var centers = [];
  for (var r = 0; r < 2; r++) for (var c = 0; c < 4; c++) {
    var g = document.createElement("div");
    g.className = "gpu";
    g.style.left = (c * 190) + "px";
    g.style.top = (r * 192) + "px";
    g.innerHTML = '<span class="gl">GPU ' + (r * 4 + c) + "</span>";
    for (var k = 0; k < 12; k++) { var ch = document.createElement("i"); ch.className = "chip"; g.appendChild(ch); }
    g.insertAdjacentHTML("beforeend", '<span class="ge">112 experts</span>');
    rack.appendChild(g);
    centers.push([c * 190 + 84, r * 192 + 79]);
  }
  // all-to-all mesh lines (faint, shown during dispatch)
  var mesh = document.getElementById("mesh");
  for (var a = 0; a < 8; a++) for (var b = a + 1; b < 8; b++) {
    var ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
    ln.setAttribute("x1", centers[a][0]); ln.setAttribute("y1", centers[a][1]);
    ln.setAttribute("x2", centers[b][0]); ln.setAttribute("y2", centers[b][1]);
    ln.setAttribute("opacity", 0);
    mesh.appendChild(ln);
  }
  // flying tokens
  function seeded(s) { return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
  var rnd = seeded(11);
  var flights = [];
  for (var f = 0; f < 16; f++) {
    var d = document.createElement("div");
    d.className = "fly";
    rack.appendChild(d);
    var from = Math.floor(rnd() * 8), to = Math.floor(rnd() * 8);
    if (to === from) to = (to + 3) % 8;
    var jx = (rnd() - 0.5) * 90, jy = (rnd() - 0.5) * 70;
    flights.push({ el: d, sx: centers[from][0], sy: centers[from][1], tx: centers[to][0] + jx, ty: centers[to][1] + jy });
  }

  // ---- overlap gantt blocks ----
  var SLOT = 82, GX = 66;
  var laneC = document.getElementById("laneC"), laneN = document.getElementById("laneN");
  for (var m = 0; m < 4; m++) {
    laneC.insertAdjacentHTML("beforeend",
      '<div class="gblk c" style="left:' + (GX + m * (SLOT + 4)) + "px;width:" + SLOT + 'px">mb' + (m + 1) + "</div>");
    if (m < 3) laneN.insertAdjacentHTML("beforeend",
      '<div class="gblk n" style="left:' + (GX + SLOT * 0.55 + m * (SLOT + 4)) + "px;width:" + SLOT + 'px">a2a mb' + (m + 2) + "</div>");
  }

  function setPhase(n) {
    ["ph1", "ph2", "ph3"].forEach(function (id, i) {
      document.getElementById(id).classList.toggle("hot", i === n);
    });
  }

  // ---- timeline: 4 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: eight districts rise; the model drapes across them
  tl.fromTo(".gpu", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.07, ease: "power2.out" })
    .to(".chip", { scale: 1, duration: 0.35, stagger: { each: 0.008, from: "random" }, ease: "back.out(2)" }, "-=0.2")
    .fromTo("#drape", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.45 });
  DECK.markStep(tl);

  // beat 2: a batch dispatches — all-to-all, compute, combine
  tl.fromTo(".ph", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.08 })
    .to("#phases .arr", { opacity: 1, duration: 0.25 }, "<0.1")
    .call(function () { setPhase(0); })
    .to("#mesh line", { opacity: 1, duration: 0.4, stagger: 0.006 }, "+=0.05");
  flights.forEach(function (fl, i) {
    tl.fromTo(fl.el, { x: fl.sx, y: fl.sy, opacity: 0 },
      { opacity: 1, duration: 0.12, immediateRender: false }, "out+=" + (i * 0.045));
    tl.to(fl.el, { x: fl.tx, y: fl.ty, duration: 0.65, ease: "power1.inOut" }, "<");
  });
  tl.call(function () { setPhase(1); })
    .to("#mesh line", { opacity: 0.15, duration: 0.3 }, "<")
    .to(".chip", {
      backgroundColor: "rgba(57,135,229,0.85)", borderColor: "#6fb1ff",
      boxShadow: "0 0 10px rgba(111,177,255,0.8)", duration: 0.3, yoyo: true, repeat: 1,
      stagger: { each: 0.006, from: "random" }
    })
    .call(function () { setPhase(2); });
  flights.forEach(function (fl, i) {
    tl.to(fl.el, { x: fl.sx, y: fl.sy, duration: 0.55, ease: "power1.inOut" }, "back+=" + (i * 0.03));
    tl.to(fl.el, { opacity: 0, duration: 0.15 }, ">-0.1");
  });
  tl.to("#mesh line", { opacity: 0, duration: 0.35 }, "-=0.3");
  DECK.markStep(tl);

  // beat 3: why not tensor parallelism
  tl.call(function () { setPhase(-1); })
    .fromTo("#vstp", { opacity: 0, x: 20 }, { opacity: 0.85, x: 0, duration: 0.4, ease: "power2.out" })
    .fromTo("#vsep", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, "+=0.15")
    .fromTo("#nvl", { opacity: 0 }, { opacity: 1, duration: 0.4 });
  DECK.markStep(tl);

  // beat 4: hide the latency — overlap compute and communication
  tl.fromTo("#gantt", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" })
    .fromTo(".gblk.c", { opacity: 0, scaleX: 0.3, transformOrigin: "left center" },
      { opacity: 1, scaleX: 1, duration: 0.35, stagger: 0.14, ease: "power2.out" })
    .fromTo(".gblk.n", { opacity: 0, scaleX: 0.3, transformOrigin: "left center" },
      { opacity: 1, scaleX: 1, duration: 0.35, stagger: 0.14, ease: "power2.out" }, "-=0.5")
    .fromTo("#codesign", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, "+=0.2");

  DECK.register(tl, {
    reset: function () { setPhase(-1); }
  });
</script>
</body>
</html>
