<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoE's Hidden Bill</title>
<link rel="stylesheet" href="shared/deck.css?v=3">
<link rel="stylesheet" href="shared/bottlenecks.css?v=3">
<style>
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  /* ---- the four buckets return (slide-02 continuity) ---- */
  .bk {
    position: absolute; left: 44px; width: 390px; height: 114px;
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px;
    display: flex; align-items: center; gap: 14px; padding: 0 14px; opacity: 0;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .bk .bktxt .bkn { font-size: 14px; font-weight: 700; }
  .bk .bktxt .bku { font: 600 10.5px ui-monospace, monospace; opacity: 0.75; margin-top: 1px; }
  .bk .bktxt .bkd { font-size: 10px; color: var(--ink-2); margin-top: 3px; }
  .bk.dimmed { opacity: 0.3 !important; filter: grayscale(0.75); }
  .bk.lit-amber { border-color: #c98500; box-shadow: 0 0 18px rgba(201,133,0,0.35); }
  .bk.lit-purple { border-color: #9085e9; box-shadow: 0 0 18px rgba(144,133,233,0.35); }
  .zflash { position: absolute; opacity: 0; pointer-events: none; z-index: 20; border-radius: 12px; left: 40px; width: 398px; height: 122px; }
  #fl-compute { border: 3px solid #3987e5; box-shadow: 0 0 26px rgba(57,135,229,0.8); }
  #fl-cap { border: 3px solid #c98500; box-shadow: 0 0 26px rgba(201,133,0,0.8); }
  #fl-comm { border: 3px solid #9085e9; box-shadow: 0 0 26px rgba(144,133,233,0.8); }

  /* ---- the invoice ---- */
  #inv {
    position: absolute; left: 490px; top: 112px; width: 746px; height: 492px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 22px; opacity: 0;
  }
  .invhead { display: flex; align-items: baseline; border-bottom: 1.5px solid #3a3f4f; padding-bottom: 9px; }
  .invhead .t { font: 800 15px ui-monospace, monospace; letter-spacing: 0.2em; color: #e8eaf0; }
  .invhead .n { margin-left: auto; font-size: 11px; color: var(--ink-2); }
  #moechip {
    position: absolute; left: 610px; top: 100px; font: 800 12px ui-monospace, monospace;
    color: var(--accent); border: 2px solid var(--accent); border-radius: 8px;
    padding: 3px 10px; background: rgba(11,13,18,0.92); opacity: 0; z-index: 7;
    box-shadow: 0 0 16px rgba(47,214,176,0.35);
  }
  .irow { display: flex; align-items: baseline; gap: 10px; margin-top: 16px; opacity: 0; }
  .irow .ilab { font-size: 13.5px; font-weight: 650; }
  .irow .idots { flex: 1; border-bottom: 1.5px dotted #3a3f4f; transform: translateY(-3px); }
  .irow .iamt { font: 700 13px ui-monospace, monospace; color: #c7cce0; white-space: nowrap; }
  .iamt s { color: #6b7284; text-decoration: none; }
  .iamt s.struck { text-decoration: line-through; text-decoration-color: #e04b38; text-decoration-thickness: 2px; }
  .iamt b { margin-left: 10px; opacity: 0; }
  .isub { margin: 5px 0 0 18px; font: 500 10.5px ui-monospace, monospace; color: #9aa1b5; opacity: 0; }
  .ichip {
    display: inline-block; margin: 7px 0 0 18px; font: 700 10.5px ui-monospace, monospace;
    color: #e0a935; border: 1.5px solid rgba(201,133,0,0.6); border-radius: 999px;
    padding: 2px 9px; opacity: 0;
  }
  #invrule { margin-top: 18px; border-top: 1.5px solid #3a3f4f; opacity: 0; }
  #frame { margin-top: 14px; font-size: 13px; color: var(--ink-2); opacity: 0; }
  #frame .fx { font: 700 14px ui-monospace, monospace; }
  #resp { margin-top: 14px; font-size: 11px; color: var(--ink-2); opacity: 0; display: flex; align-items: center; gap: 10px; }
  .rchip {
    font: 700 11.5px ui-monospace, monospace; color: var(--accent);
    border: 1.5px solid rgba(47,214,176,0.55); border-radius: 8px; padding: 5px 11px;
    background: rgba(11,13,18,0.6);
  }
  .rchip span { color: var(--ink-2); font-weight: 500; margin-left: 6px; }
  #stmoved {
    position: absolute; left: 750px; top: 528px; font: 800 23px ui-monospace, monospace;
    letter-spacing: 0.06em; border: 3.5px solid #e04b38; color: #e04b38;
    padding: 6px 14px; border-radius: 6px; transform: rotate(-9deg); opacity: 0; z-index: 8;
    background: rgba(11,13,18,0.6); box-shadow: 0 4px 16px rgba(0,0,0,0.45);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">MoE's Hidden Bill</div>
  <div class="slide-sub">the four buckets return — what did conditional computation actually buy?</div>

  <div id="buckets"></div>
  <div class="zflash" id="fl-compute"></div>
  <div class="zflash" id="fl-cap"></div>
  <div class="zflash" id="fl-comm"></div>

  <div id="inv">
    <div class="invhead"><span class="t">INVOICE</span><span class="n">serving Kimi K3 · 2.8 T MoE · per token</span></div>
    <div class="irow" id="ir-comp">
      <span class="ilab" style="color:#6fb1ff">Compute — matmuls</span>
      <span class="idots"></span>
      <span class="iamt"><s id="compOld">2.8 T if dense</s><b id="compNew" style="color:#2fd6b0">41 B active</b></span>
    </div>
    <div class="irow" id="ir-cap">
      <span class="ilab" style="color:#e0a935">Memory capacity — weights resident</span>
      <span class="idots"></span>
      <span class="iamt" id="capAmt" style="color:#e0a935">0.0 TB</span>
    </div>
    <div class="isub" id="cap-s1"></div>
    <div class="isub" id="cap-s2"></div>
    <div><span class="ichip" id="cap-idle"></span></div>
    <div class="irow" id="ir-comm">
      <span class="ilab" style="color:#9085e9">Interconnect — every MoE layer</span>
      <span class="idots"></span>
      <span class="iamt" style="color:#9085e9">all-to-all</span>
    </div>
    <div class="isub" id="comm-s1"></div>
    <div id="invrule"></div>
    <div id="frame"></div>
    <div id="resp"></div>
  </div>
  <div id="moechip">goes MoE</div>
  <div id="stmoved">BOTTLENECK MOVED</div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/moe.js?v=3"></script>
<script src="shared/bottlenecks.js?v=3"></script>
<script src="shared/manifest.js?v=3"></script>
<script src="shared/deck.js?v=3"></script>
<script>
  // ---- the four bucket cards (BN.list + BN.iconHTML) ----
  var TOPS = { compute: 118, bw: 250, cap: 382, comm: 514 };
  var host = document.getElementById("buckets");
  BN.list.forEach(function (b) {
    var d = document.createElement("div");
    d.className = "bk"; d.id = "bk-" + b.key;
    d.style.top = TOPS[b.key] + "px";
    d.innerHTML = BN.iconHTML(b.key) +
      '<div class="bktxt"><div class="bkn" style="color:' + b.color + '">' + b.name + "</div>" +
      '<div class="bku" style="color:' + b.color + '">' + b.unit + "</div>" +
      '<div class="bkd">' + b.dom + "</div></div>";
    host.appendChild(d);
  });
  ["compute", "cap", "comm"].forEach(function (k) {
    document.getElementById("fl-" + k).style.top = (TOPS[k] - 4) + "px";
  });

  // ---- invoice copy from MOE.bill ----
  var capParts = MOE.bill.capMath.split(" → ");
  document.getElementById("cap-s1").textContent = capParts[0];
  document.getElementById("cap-s2").textContent = "→ " + capParts[1];
  document.getElementById("cap-idle").textContent = MOE.bill.cap.split("— even though ")[1];
  var commParts = MOE.bill.comm.split(" → ");
  document.getElementById("comm-s1").textContent = commParts[0] + " → " + commParts[1];
  var fp = MOE.bill.frame.split(": ");
  document.getElementById("frame").innerHTML = fp[0] + ": <span class='fx'>" +
    fp[1].replace("compute", '<span style="color:#6fb1ff">compute</span>')
         .replace("capacity", '<span style="color:#e0a935">capacity</span>')
         .replace("interconnect", '<span style="color:#9085e9">interconnect</span>') + "</span>";
  var rp = MOE.bill.response.split(": ");
  document.getElementById("resp").innerHTML = rp[0] + ":" +
    '<span class="rchip">EP<span>Expert Parallelism</span></span>' +
    '<span class="rchip">PD<span>Prefill–Decode disaggregation</span></span>';

  // ---- DOM mutators (undone in reset) ----
  var compOld = document.getElementById("compOld");
  var bkComp = null;
  function strikeCompute() {
    compOld.classList.add("struck");
    document.getElementById("bk-compute").classList.add("dimmed");
  }
  function litCap() { document.getElementById("bk-cap").classList.add("lit-amber"); }
  function litComm() { document.getElementById("bk-comm").classList.add("lit-purple"); }

  var cap = { v: 0 };
  var capAmt = document.getElementById("capAmt");
  function paintCap() { capAmt.textContent = cap.v.toFixed(1) + " TB"; }

  // ---- timeline: 4 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: buckets return; the model goes MoE — compute relaxes, line struck
  tl.fromTo(".bk", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.1, ease: "power3.out" })
    .fromTo("#inv", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, "-=0.2")
    .fromTo("#ir-comp", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35 })
    .fromTo("#moechip", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)" }, "+=0.15")
    .fromTo("#fl-compute", { opacity: 0 }, { opacity: 1, duration: 0.09, yoyo: true, repeat: 3 })
    .call(strikeCompute)
    .fromTo("#compNew", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" });
  DECK.markStep(tl);

  // beat 2: the capacity line flares — 1.4 TB resident, ~98% idle
  tl.fromTo("#ir-cap", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35 })
    .fromTo("#fl-cap", { opacity: 0 }, { opacity: 1, duration: 0.09, yoyo: true, repeat: 3 })
    .call(litCap)
    .to(cap, { v: 1.4, duration: 0.8, ease: "power2.out", onUpdate: paintCap }, "-=0.2")
    .fromTo("#cap-s1", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.32 }, "-=0.3")
    .fromTo("#cap-s2", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.32 })
    .fromTo("#cap-idle", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" });
  DECK.markStep(tl);

  // beat 3: the interconnect line flares — all-to-all, every MoE layer
  tl.fromTo("#ir-comm", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35 })
    .fromTo("#fl-comm", { opacity: 0 }, { opacity: 1, duration: 0.09, yoyo: true, repeat: 3 })
    .call(litComm)
    .fromTo("#comm-s1", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.32 });
  DECK.markStep(tl);

  // beat 4: the reframe stamp + what the systems layer answers with
  tl.fromTo("#invrule", { opacity: 0 }, { opacity: 1, duration: 0.3 })
    .fromTo("#frame", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 })
    .fromTo("#stmoved", { opacity: 0, scale: 2.4, rotate: -9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.in" })
    .fromTo("#resp", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, "+=0.15");

  DECK.register(tl, {
    reset: function () {
      compOld.classList.remove("struck");
      document.getElementById("bk-compute").classList.remove("dimmed");
      document.getElementById("bk-cap").classList.remove("lit-amber");
      document.getElementById("bk-comm").classList.remove("lit-purple");
    }
  });
</script>
</body>
</html>
