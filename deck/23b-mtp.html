<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Token Prediction</title>
<link rel="stylesheet" href="shared/deck.css?v=4">
<link rel="stylesheet" href="shared/bottlenecks.css?v=4">
<style>
  /* ---- the two lanes ---- */
  .lane {
    position: absolute; left: 44px; width: 1192px; height: 128px;
    border: 1.5px solid var(--line); border-radius: 14px;
    background: rgba(27,30,39,0.45); opacity: 0;
  }
  #laneS { top: 102px; }
  #laneD { top: 256px; border-color: rgba(47,214,176,0.4); }
  .llab { position: absolute; left: 14px; top: 8px; font: 700 10px ui-monospace, monospace; letter-spacing: 0.07em; color: #9aa1b5; }
  #laneD .llab { color: var(--accent); }

  .hbm {
    position: absolute; left: 14px; top: 26px; width: 84px; height: 92px;
    border: 2px solid rgba(201,133,0,0.65); border-radius: 8px;
  }
  .hbm .wr { margin: 5px 5px 0; height: 11px; border-radius: 2px; background: linear-gradient(rgba(201,133,0,0.4), rgba(201,133,0,0.8)); }
  .hbm .hlab { position: absolute; bottom: 2px; width: 100%; text-align: center; font: 700 8px ui-monospace, monospace; color: #e0a935; }

  .pulse {
    position: absolute; left: 34px; top: 42px; width: 44px; height: 60px; border-radius: 6px;
    background: linear-gradient(rgba(224,169,53,0.75), rgba(201,133,0,0.95));
    box-shadow: 0 0 16px rgba(224,169,53,0.55); opacity: 0; z-index: 5;
  }

  .die {
    position: absolute; left: 168px; top: 26px; width: 76px; height: 92px;
    border: 2px solid rgba(57,135,229,0.4); border-radius: 9px; background: #0d1420;
  }
  .die .tiles { position: absolute; inset: 8px 8px 20px; display: grid; gap: 3px; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); }
  .die .tiles i { background: rgba(57,135,229,0.09); border-radius: 2px; }
  .die .dlab { position: absolute; bottom: 3px; width: 100%; text-align: center; font: 600 8.5px ui-monospace, monospace; color: rgba(158,199,245,0.65); }
  .die.hot { border-color: #6fb1ff; box-shadow: 0 0 20px rgba(111,177,255,0.6); }
  .die.hot .tiles i { background: rgba(111,177,255,0.55); }

  .wtok {
    position: absolute; top: 52px; width: 18px; height: 18px; border-radius: 4px;
    background: var(--accent); box-shadow: 0 0 8px rgba(47,214,176,0.35); opacity: 0; z-index: 4;
  }

  /* draft tokens + verify scan (lane D only) */
  .dt {
    position: absolute; top: 52px; width: 18px; height: 18px; border-radius: 4px;
    border: 1.5px dashed rgba(47,214,176,0.6); opacity: 0; z-index: 6;
  }
  .dt.ok { background: var(--accent); border: 1.5px solid var(--accent); box-shadow: 0 0 8px rgba(47,214,176,0.5); }
  .dt.bad { background: #e04b38; border: 1.5px solid #e04b38; box-shadow: 0 0 10px rgba(224,75,56,0.7); }
  #scan {
    position: absolute; left: 256px; top: 40px; width: 3px; height: 44px;
    background: #6fb1ff; box-shadow: 0 0 10px rgba(111,177,255,0.8); opacity: 0; z-index: 7;
  }
  #drafter {
    position: absolute; left: 262px; top: 4px; font: 700 9px ui-monospace, monospace; letter-spacing: 0.06em;
    color: #6fb1ff; border: 1.5px dashed rgba(111,177,255,0.6); border-radius: 999px;
    padding: 2px 9px; background: rgba(11,13,18,0.92); z-index: 8; animation: drpulse 1.6s ease-in-out infinite;
  }
  @keyframes drpulse { 50% { opacity: 0.65; } }
  #drafter.mtp {
    border-style: solid; border-color: var(--accent); color: var(--accent);
    box-shadow: 0 0 12px rgba(47,214,176,0.4); animation: none;
  }

  .rbar { position: absolute; left: 262px; top: 112px; width: 618px; height: 5px; border-radius: 3px; background: rgba(42,46,59,0.8); overflow: hidden; }
  .rfill { height: 100%; transform-origin: left; transform: scaleX(0); }
  #laneS .rfill { background: #8a91a5; }
  #laneD .rfill { background: var(--accent); }

  .score { position: absolute; left: 906px; top: 20px; width: 272px; height: 88px; border-left: 1px solid var(--line); padding-left: 18px; }
  .srow { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .srow .sk { font: 600 10px ui-monospace, monospace; letter-spacing: 0.05em; color: #6b7284; }
  .srow .sv { font: 800 24px ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .srow .sv.rd { color: #e0a935; }
  .srow .sv.tk { color: var(--accent); }

  /* ---- captions ---- */
  #capS { position: absolute; left: 44px; top: 234px; font-size: 11px; color: var(--ink-2); opacity: 0; }
  #aichip {
    position: absolute; right: 44px; top: 229px; font: 600 10px ui-monospace, monospace; color: var(--accent);
    border: 1.5px solid rgba(47,214,176,0.5); border-radius: 999px; padding: 3px 10px;
    background: rgba(11,13,18,0.9); opacity: 0; white-space: nowrap;
  }
  #capD { position: absolute; left: 44px; top: 388px; font-size: 11px; color: var(--ink-2); opacity: 0; }
  #lossless { position: absolute; left: 44px; top: 407px; font-size: 11px; font-weight: 600; color: var(--accent); opacity: 0; }

  /* ---- the frozen-race economics panel ---- */
  #reframe { position: absolute; left: 44px; top: 430px; width: 1192px; font-size: 13px; font-weight: 600; color: #c7cce0; opacity: 0; }

  #bpt { position: absolute; left: 44px; top: 462px; font: 700 10px ui-monospace, monospace; letter-spacing: 0.08em; color: #6b7284; opacity: 0; }
  .brow { position: absolute; left: 44px; display: flex; align-items: center; gap: 10px; opacity: 0; }
  #rowS { top: 480px; } #rowD { top: 508px; }
  .brow .bn { width: 92px; font: 600 10.5px ui-monospace, monospace; color: #9aa1b5; }
  #rowD .bn { color: var(--accent); }
  .brow .btrack { width: 420px; height: 14px; border: 1px solid var(--line); border-radius: 4px; background: rgba(11,13,18,0.6); overflow: hidden; }
  .brow .bfill { height: 100%; transform-origin: left; background: linear-gradient(90deg, rgba(201,133,0,0.45), #e0a935); }
  #ktag {
    position: absolute; left: 292px; top: 505px; font: 700 12px ui-monospace, monospace; color: var(--accent);
    border: 1.5px solid rgba(47,214,176,0.55); border-radius: 999px; padding: 2px 8px;
    background: rgba(11,13,18,0.92); opacity: 0; z-index: 5;
  }
  #econ { position: absolute; left: 44px; top: 548px; width: 600px; font-size: 11px; color: var(--ink-2); line-height: 1.45; opacity: 0; }

  #payflow { position: absolute; left: 700px; top: 450px; display: flex; align-items: center; gap: 14px; opacity: 0; }
  #payflow .pfcol { display: flex; flex-direction: column; align-items: center; }
  #payflow .pfl { margin-top: 2px; font: 700 9px ui-monospace, monospace; letter-spacing: 0.05em; }
  #payflow .pfl.c { color: #6fb1ff; } #payflow .pfl.b { color: var(--accent); }
  #payflow .pfarr { font: 800 12px ui-monospace, monospace; color: #6b7284; padding-bottom: 14px; }
  #util { position: absolute; left: 956px; top: 466px; width: 280px; opacity: 0; }
  #util .ul { font: 700 10px ui-monospace, monospace; letter-spacing: 0.07em; color: #6b7284; }
  #util .ut { margin-top: 7px; width: 280px; height: 14px; border: 1px solid var(--line); border-radius: 4px; background: rgba(11,13,18,0.6); overflow: hidden; }
  #util .uf { height: 100%; transform-origin: left; transform: scaleX(0.05); background: linear-gradient(90deg, rgba(57,135,229,0.45), #3987e5); }
  #uniq { position: absolute; left: 700px; top: 548px; width: 536px; font-size: 11.5px; font-weight: 600; color: #6fb1ff; line-height: 1.45; opacity: 0; }

  /* ---- beat 5: MTP head + trackside fine print ---- */
  #dsv3 { position: absolute; left: 44px; top: 596px; width: 600px; font-size: 11px; color: #c7cce0; line-height: 1.45; opacity: 0; }
  #acc {
    position: absolute; left: 44px; top: 638px; font: 600 10px ui-monospace, monospace; color: var(--accent);
    border: 1.5px solid rgba(47,214,176,0.55); border-radius: 999px; padding: 3px 10px;
    background: rgba(11,13,18,0.9); opacity: 0; white-space: nowrap;
  }
  #motto { position: absolute; left: 44px; top: 672px; width: 620px; font-size: 13px; font-weight: 700; color: var(--accent); opacity: 0; }

  .sign {
    position: absolute; top: 596px; width: 262px; background: var(--panel);
    border: 1.5px solid rgba(224,75,56,0.45); border-radius: 10px;
    padding: 8px 11px; font-size: 9.5px; color: #b9bfd2; line-height: 1.4; opacity: 0;
  }
  .sign::after {
    content: ""; position: absolute; left: 50%; bottom: -12px; width: 3px; height: 12px;
    background: rgba(224,75,56,0.35);
  }
  #sign0 { left: 700px; } #sign1 { left: 976px; }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">Multi-Token Prediction</div>
  <div class="slide-sub">two lanes, one race &mdash; spend the idle die, buy back the bandwidth bill</div>

  <div class="lane" id="laneS"></div>
  <div class="lane" id="laneD"></div>

  <div id="capS"></div>
  <div id="aichip"></div>
  <div id="capD"></div>
  <div id="lossless"></div>

  <div id="reframe"></div>
  <div id="bpt">BYTES / TOKEN</div>
  <div class="brow" id="rowS"><span class="bn">serial</span><div class="btrack"><div class="bfill" id="bfS"></div></div></div>
  <div class="brow" id="rowD"><span class="bn">speculative</span><div class="btrack"><div class="bfill" id="bfD"></div></div></div>
  <div id="ktag">&divide; ~k</div>
  <div id="econ"></div>

  <div id="payflow">
    <div class="pfcol" id="pfc"><div class="pfl c">idle compute</div></div>
    <div class="pfarr">&mdash;pays&rarr;</div>
    <div class="pfcol" id="pfb"><div class="pfl b">bandwidth</div></div>
  </div>
  <div id="util"><div class="ul">DIE UTILIZATION &mdash; LANE 2</div><div class="ut"><div class="uf"></div></div></div>
  <div id="uniq"></div>

  <div id="dsv3"></div>
  <div id="acc"></div>
  <div id="motto"></div>
  <div class="sign" id="sign0"></div>
  <div class="sign" id="sign1"></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/gpus.js?v=4"></script>
<script src="shared/bottlenecks.js?v=4"></script>
<script src="shared/mtp.js?v=4"></script>
<script src="shared/manifest.js?v=4"></script>
<script src="shared/deck.js?v=4"></script>
<script>
  // ---- build the two lanes ----
  function laneHTML(label) {
    var wr = "";
    for (var i = 0; i < 4; i++) wr += '<div class="wr"></div>';
    var ti = "";
    for (i = 0; i < 20; i++) ti += "<i></i>";
    return '<span class="llab">' + label + "</span>" +
      '<div class="hbm">' + wr + '<span class="hlab">weights + KV</span></div>' +
      '<div class="pulse"></div>' +
      '<div class="die"><div class="tiles">' + ti + '</div><span class="dlab">die</span></div>' +
      '<div class="rbar"><div class="rfill"></div></div>' +
      '<div class="score">' +
      '<div class="srow"><span class="sk">weight reads</span><b class="sv rd">0</b></div>' +
      '<div class="srow"><span class="sk">tokens out</span><b class="sv tk">0</b></div></div>';
  }
  var laneS = document.getElementById("laneS"), laneD = document.getElementById("laneD");
  laneS.innerHTML = laneHTML("LANE 1 &mdash; SERIAL");
  laneD.innerHTML = laneHTML("LANE 2 &mdash; SPECULATIVE");
  // lane D extras: drafter chip, draft slots, verify scanline
  laneD.insertAdjacentHTML("beforeend",
    '<div id="drafter">DRAFTER</div>' +
    '<div class="dt" style="left:262px"></div><div class="dt" style="left:286px"></div>' +
    '<div class="dt" style="left:310px"></div><div class="dt" style="left:334px"></div>' +
    '<div id="scan"></div>');

  // recycled token pools (window tokens drifting down the track)
  var poolS = [], poolD = [];
  function makeToks(lane, pool) {
    for (var i = 0; i < 14; i++) {
      var el = document.createElement("i");
      el.className = "wtok";
      lane.appendChild(el);
      pool.push(el);
    }
  }
  makeToks(laneS, poolS); makeToks(laneD, poolD);

  // ---- static content from MTP.* ----
  document.getElementById("capS").textContent = MTP.serial;
  document.getElementById("aichip").textContent = MTP.ai;
  document.getElementById("capD").textContent = MTP.spec.draft + "  →  " + MTP.spec.verify;
  document.getElementById("lossless").textContent = MTP.spec.lossless;
  document.getElementById("reframe").textContent = MTP.reframe;
  document.getElementById("econ").textContent = MTP.econ;
  document.getElementById("uniq").textContent = MTP.unique;
  document.getElementById("dsv3").textContent = MTP.dsv3.what;
  document.getElementById("acc").textContent = MTP.dsv3.accept;
  document.getElementById("motto").textContent = MTP.dsv3.point;
  document.getElementById("sign0").insertAdjacentText("beforeend", MTP.caveats[0]);
  document.getElementById("sign1").insertAdjacentText("beforeend", MTP.caveats[1]);
  document.getElementById("pfc").insertAdjacentHTML("afterbegin", BN.iconHTML("compute"));
  document.getElementById("pfb").insertAdjacentHTML("afterbegin", BN.iconHTML("bw"));

  // ---- lane element handles ----
  var sPulse = laneS.querySelector(".pulse"), dPulse = laneD.querySelector(".pulse");
  var dieS = laneS.querySelector(".die"), dieD = laneD.querySelector(".die");
  var sRd = laneS.querySelector(".sv.rd"), sTk = laneS.querySelector(".sv.tk");
  var dRd = laneD.querySelector(".sv.rd"), dTk = laneD.querySelector(".sv.tk");
  var sFill = laneS.querySelector(".rfill"), dFill = laneD.querySelector(".rfill");
  var dts = [].slice.call(laneD.querySelectorAll(".dt"));
  var scan = document.getElementById("scan");
  var drafter = document.getElementById("drafter");

  // ---- fire-and-forget tween registry (freezable / killable) ----
  var live = [];
  function ff(target, vars) {
    var t = gsap.to(target, vars);
    live.push(t);
    function prune() { var i = live.indexOf(t); if (i > -1) live.splice(i, 1); }
    var oc = vars.onComplete;
    t.eventCallback("onComplete", function () { if (oc) oc(); prune(); });
    t.eventCallback("onInterrupt", prune);
    return t;
  }
  function freezeAll() { sLoop.pause(); dLoop.pause(); live.forEach(function (t) { t.pause(); }); }
  function resumeAll() { sLoop.play(); dLoop.play(); live.forEach(function (t) { t.play(); }); }

  // ---- counters + emission ----
  var sReads = 0, sToks = 0, dReads = 0, dToks = 0, cycleN = 0, mtpMode = false;
  function bar(fill, n) { ff(fill, { scaleX: Math.min(1, n / 36), duration: 0.35, overwrite: "auto" }); }

  function spawn(pool, x0) {
    var el = pool.shift();
    if (!el) return;
    gsap.set(el, { left: x0, x: 0, opacity: 1 });
    var dist = 862 - x0, dur = dist / 85;
    ff(el, {
      keyframes: [
        { x: dist * 0.85, duration: dur * 0.85, ease: "none" },
        { x: dist, opacity: 0, duration: dur * 0.15, ease: "none" },
      ],
      onComplete: function () { gsap.set(el, { opacity: 0, x: 0 }); pool.push(el); },
    });
  }
  function emitS() {
    sToks++; sTk.textContent = sToks; bar(sFill, sToks); spawn(poolS, 262);
  }
  function emitD(n) {
    for (var i = 0; i < n; i++) spawn(poolD, 380 + i * 24);
    dToks += n; dTk.textContent = dToks; bar(dFill, dToks);
  }

  // ---- serial loop (lane 1): one heavy read -> one tiny token ----
  var sLoop = gsap.timeline({ paused: true, repeat: -1 });
  sLoop.set(sPulse, { x: 0, opacity: 0 }, 0)
    .call(function () { dieS.classList.remove("hot"); }, null, 0)
    .to(sPulse, { opacity: 1, duration: 0.12 }, 0.05)
    .to(sPulse, { x: 150, duration: 0.7, ease: "power1.inOut" }, 0.08)
    .call(function () { dieS.classList.add("hot"); sReads++; sRd.textContent = sReads; }, null, 0.78)
    .to(sPulse, { opacity: 0, duration: 0.15 }, 0.82)
    .call(emitS, null, 0.98)
    .call(function () { dieS.classList.remove("hot"); }, null, 1.3)
    .to({}, { duration: 0.01 }, 1.69);

  // ---- speculative loop (lane 2): draft k=4, verify in ONE read, reject the tail ----
  function resetDrafts() {
    dts.forEach(function (el) { el.classList.remove("ok", "bad"); });
    gsap.set(dts, { opacity: 0, y: 0, scale: 0.6 });
    dieD.classList.remove("hot");
  }
  function resolve() {
    cycleN++;
    var all4 = mtpMode && cycleN % 2 === 0;   // ~7 of 8 accepted once the MTP head drives
    dts.forEach(function (el, i) {
      if (i < 3 || all4) {
        ff(el, { scale: 1.18, yoyo: true, repeat: 1, duration: 0.12, delay: i * 0.09,
          onStart: (function (e) { return function () { e.classList.add("ok"); }; })(el) });
      }
    });
    if (!all4) {
      ff(dts[3], { scale: 1.18, yoyo: true, repeat: 1, duration: 0.12, delay: 0.28,
        onStart: function () { dts[3].classList.add("bad"); } });
      ff(dts[3], { y: -26, opacity: 0, duration: 0.28, delay: 0.45, ease: "power2.in" });
    }
    var n = all4 ? 4 : 3;
    ff({}, { duration: 0.62, onComplete: function () {
      emitD(n);
      ff(dts, { opacity: 0, duration: 0.15 });
    } });
  }
  var dLoop = gsap.timeline({ paused: true, repeat: -1 });
  dLoop.set(dPulse, { x: 0, opacity: 0 }, 0)
    .set(scan, { x: 0, opacity: 0 }, 0)
    .call(resetDrafts, null, 0)
    .to(dts, { opacity: 1, scale: 1, duration: 0.2, stagger: 0.09, ease: "back.out(2)" }, 0.15)
    .to(dPulse, { opacity: 1, duration: 0.12 }, 0.65)
    .to(dPulse, { x: 150, duration: 0.6, ease: "power1.inOut" }, 0.68)
    .call(function () { dieD.classList.add("hot"); dReads++; dRd.textContent = dReads; }, null, 1.28)
    .to(dPulse, { opacity: 0, duration: 0.15 }, 1.32)
    .to(scan, { opacity: 1, duration: 0.08 }, 1.38)
    .to(scan, { x: 104, duration: 0.32, ease: "none" }, 1.42)
    .to(scan, { opacity: 0, duration: 0.1 }, 1.74)
    .call(resolve, null, 1.78)
    .call(function () { dieD.classList.remove("hot"); }, null, 2.1)
    .to({}, { duration: 0.01 }, 2.59);

  // ---- main timeline: 5 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the serial treadmill — a huge read per tiny token
  tl.fromTo("#laneS", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" })
    .fromTo("#capS", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 })
    .fromTo("#aichip", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, "<0.15")
    .call(function () { sLoop.play(); });
  DECK.markStep(tl);

  // beat 2: the speculative lane joins the race — and one draft gets yanked
  tl.fromTo("#laneD", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" })
    .fromTo("#capD", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 })
    .call(function () { dLoop.play(); })
    .to({}, { duration: 3.4 })
    .fromTo("#lossless", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 });
  DECK.markStep(tl);

  // beat 3: freeze the race — the verify pass is a mini-prefill, bytes/token ÷ k
  tl.call(freezeAll)
    .fromTo("#reframe", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 })
    .fromTo("#bpt", { opacity: 0 }, { opacity: 1, duration: 0.3 })
    .fromTo("#rowS", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35 })
    .fromTo("#rowD", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35 }, "<0.1")
    .fromTo("#bfS", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" })
    .fromTo("#bfD", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, "<")
    .to("#bfD", { scaleX: 0.33, duration: 0.7, ease: "power2.inOut", delay: 0.25 })
    .fromTo("#ktag", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, "-=0.2")
    .fromTo("#econ", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 });
  DECK.markStep(tl);

  // beat 4: the unique trade — idle compute pays the bandwidth bill
  tl.fromTo("#payflow", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" })
    .fromTo("#util", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 }, "<0.15")
    .fromTo("#util .uf", { scaleX: 0.05 }, { scaleX: 0.52, duration: 0.9, ease: "power2.inOut" })
    .fromTo("#uniq", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.45 }, "-=0.3");
  DECK.markStep(tl);

  // beat 5: swap the drafter for a built-in MTP head — race resumes, fine print roadside
  tl.to("#drafter", { scale: 0.6, opacity: 0, duration: 0.25, ease: "power2.in" })
    .call(function () { drafter.textContent = "MTP HEAD"; drafter.classList.add("mtp"); })
    .to("#drafter", { x: -72, y: 6, duration: 0.01 })
    .to("#drafter", { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" })
    .call(function () { mtpMode = true; resumeAll(); })
    .fromTo("#dsv3", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 })
    .fromTo("#acc", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" })
    .fromTo("#motto", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 }, "<0.15")
    .fromTo(".sign", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.18, ease: "power2.out" });

  DECK.register(tl, {
    reset: function () {
      sLoop.pause(0); dLoop.pause(0);
      live.slice().forEach(function (t) { t.kill(); });
      live.length = 0;
      sReads = sToks = dReads = dToks = cycleN = 0; mtpMode = false;
      sRd.textContent = sTk.textContent = dRd.textContent = dTk.textContent = "0";
      gsap.set(".wtok", { opacity: 0, x: 0 });
      poolS.length = 0; poolD.length = 0;
      [].slice.call(laneS.querySelectorAll(".wtok")).forEach(function (el) { poolS.push(el); });
      [].slice.call(laneD.querySelectorAll(".wtok")).forEach(function (el) { poolD.push(el); });
      dts.forEach(function (el) { el.classList.remove("ok", "bad"); });
      gsap.set(dts, { opacity: 0, y: 0, scale: 0.6 });
      dieS.classList.remove("hot"); dieD.classList.remove("hot");
      gsap.set(".rfill", { scaleX: 0 });
      gsap.set([sPulse, dPulse, scan], { opacity: 0, x: 0 });
      drafter.textContent = "DRAFTER"; drafter.classList.remove("mtp");
      gsap.set(drafter, { x: 0, y: 0, scale: 1, opacity: 1 });
    }
  });
</script>
</body>
