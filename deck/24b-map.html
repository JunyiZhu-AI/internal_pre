<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Map, Completed</title>
<link rel="stylesheet" href="shared/deck.css?v=6">
<link rel="stylesheet" href="shared/bottlenecks.css?v=6">
<style>
  /* ---- scoreboard rail ---- */
  #rail {
    position: absolute; left: 610px; top: 150px; width: 626px; height: 74px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 16px 8px; opacity: 0;
  }
  #rail .rl { display: flex; align-items: baseline; gap: 10px; font-family: ui-monospace, monospace; }
  #rail .rlab { font-size: 10px; color: var(--ink-2); letter-spacing: 0.14em; }
  #rail b { font-size: 17px; font-weight: 700; color: #e8eaf0; display: inline-block; }
  #r-speed { color: var(--accent); }
  #r-cap { font-size: 10.5px; color: #e0a935; margin-left: 2px; }
  #rail .rfine { margin-top: 7px; font-size: 9.5px; color: #6b7284; font-family: ui-monospace, monospace; }

  /* ---- the four buckets (2 × 2 board) ---- */
  .bucket {
    position: absolute; width: 250px; height: 195px;
    background: rgba(27,30,39,0.55); border: 1.5px solid var(--line); border-radius: 14px;
    opacity: 0;
  }
  .bucket .bflash {
    position: absolute; inset: -2px; border: 3px solid; border-radius: 14px;
    opacity: 0; pointer-events: none; z-index: 6;
  }
  .bucket .bn-icon { margin-top: 8px; transform: scale(0.82); }
  .bucket .bname { text-align: center; font-size: 14px; font-weight: 700; margin-top: -2px; }
  .bucket .bunit { text-align: center; font-family: ui-monospace, monospace; font-size: 10px; color: var(--ink-2); }
  .bucket .dockrow {
    position: absolute; left: 8px; right: 8px; bottom: 8px; height: 64px;
    display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start;
  }
  .dchip {
    font: 700 9.5px ui-monospace, monospace; border: 1px solid; border-radius: 5px;
    padding: 2px 6px; height: 18px; background: rgba(11,13,18,0.9);
  }

  /* MoE chain-reaction alerts */
  #bk-cap.flood { border-color: #e0a935; background: rgba(201,133,0,0.16); animation: floodPulse 0.9s ease-in-out infinite; }
  @keyframes floodPulse { 50% { background: rgba(201,133,0,0.30); box-shadow: 0 0 22px rgba(224,169,53,0.4); } }
  #bk-comm.alert { border-color: #e04b38; animation: commPulse 0.7s ease-in-out infinite; }
  #bk-comm.alert .bni-nodes line { stroke: #e04b38; animation-duration: 0.45s; }
  @keyframes commPulse { 50% { box-shadow: 0 0 24px rgba(224,75,56,0.55); } }

  /* MTP: the compute chip heats — the only card that SPENDS compute */
  .bni-chip.hot { animation-duration: 0.55s; border-color: #8fc2ff; box-shadow: 0 0 28px rgba(111,177,255,0.8); }

  /* ---- sims ---- */
  #simghost { left: 610px; top: 240px; width: 626px; height: 88px; opacity: 0; filter: grayscale(0.6); }
  #simghost .sim-main { opacity: 0.62; }
  #simhost { left: 610px; top: 342px; width: 626px; height: 212px; opacity: 0; }

  /* PD split: prefill panel takes the ghost's slot; TPOT pill tags the decode stream */
  #prefill {
    position: absolute; left: 610px; top: 240px; width: 626px; height: 88px;
    background: #0d1017; border: 1px solid #24406b; border-radius: 10px;
    padding: 10px 12px; opacity: 0; visibility: hidden;
  }
  #prefill .ph { font-family: ui-monospace, monospace; font-size: 11px; color: #7fb0ee; display: flex; }
  #prefill .ph .pill { margin-left: auto; font-size: 9.5px; border: 1px solid #3987e5; border-radius: 999px; padding: 1px 8px; color: #9ec7f5; }
  #prefill .bar { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 12px; border: 1px solid #24406b; border-radius: 6px; overflow: hidden; }
  #prefill .bar i {
    position: absolute; top: 1px; bottom: 1px; width: 42%; border-radius: 5px;
    background: linear-gradient(90deg, transparent, #3987e5);
    animation: pfSweep 1.35s linear infinite;
  }
  @keyframes pfSweep { from { left: -46%; } to { left: 104%; } }
  #tpot {
    position: absolute; left: 1168px; top: 334px; z-index: 7;
    font: 700 9.5px ui-monospace, monospace; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 2px 9px;
    background: rgba(11,13,18,0.95); opacity: 0; visibility: hidden;
  }

  /* MTP rejected drafts near the decode stream */
  .draft {
    position: absolute; z-index: 9; font: 600 11px ui-monospace, monospace;
    color: #8ef0a3; background: rgba(10,15,12,0.9); border: 1px solid #1d2a22;
    border-radius: 5px; padding: 2px 7px; pointer-events: none;
  }
  .draft.dead { color: #e04b38; text-decoration: line-through; border-color: rgba(224,75,56,0.5); }

  /* ---- card tray ---- */
  #tray { position: absolute; left: 44px; top: 608px; width: 1000px; display: flex; gap: 8px; pointer-events: none; }
  #tray .tcard { flex: 1; padding: 7px 8px; cursor: grab; touch-action: none; }
  #tray .tcard.dragging { cursor: grabbing; z-index: 40; box-shadow: 0 14px 30px rgba(0,0,0,0.55); border-color: #4a5066; }
  #tray .tcard.spent { opacity: 0.3 !important; filter: grayscale(0.8); cursor: default; }
  #tray .abbr { font-size: 10.5px; padding-right: 2px; white-space: nowrap; }
  #tray .full { font-size: 8.5px; }
  .tcard .prog { position: absolute; bottom: 5px; right: 7px; display: flex; gap: 3px; }
  .tcard .prog i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid #5b647c; }
  .tcard .prog i.done { background: var(--accent); border-color: var(--accent); }
  #trayhint { position: absolute; left: 44px; top: 585px; font-size: 11.5px; color: #4d5468; font-style: italic; opacity: 0; }

  .tcard.fly {
    position: absolute; z-index: 40; width: 104px; margin: 0; opacity: 1;
    box-shadow: 0 14px 30px rgba(0,0,0,0.55); pointer-events: none;
  }

  .ztoast { position: absolute; z-index: 25; pointer-events: none; white-space: nowrap; font: 700 12.5px ui-monospace, monospace; text-shadow: 0 2px 8px #000; }

  /* ---- the end state: results table ---- */
  #results {
    position: absolute; left: 152px; top: 122px; width: 976px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px 12px; opacity: 0; visibility: hidden; z-index: 30;
  }
  #results .rhead { display: flex; align-items: baseline; margin-bottom: 9px; }
  #results .rhead .rt { font: 800 15px ui-monospace, monospace; letter-spacing: 0.18em; color: var(--accent); }
  #results .rhead .rs { margin-left: auto; font: 700 12px ui-monospace, monospace; color: #e0a935; }
  .rrow { display: flex; gap: 8px; align-items: center; height: 40px; border-top: 1px solid #232836; opacity: 0; }
  .rrow.hd { height: 26px; border-top: none; }
  .rrow.hd .rc { font-size: 9.5px; letter-spacing: 0.12em; color: var(--ink-2); font-family: ui-monospace, monospace; }
  .rc { line-height: 1.25; }
  .rc.c1 { width: 226px; } .rc.c2 { width: 348px; font-size: 11.5px; color: #c7cce0; }
  .rc.c3 { width: 158px; font-size: 11px; color: var(--ink-2); }
  .rc.c4 { width: 188px; font-family: ui-monospace, monospace; font-size: 11px; color: var(--accent); }
  .rc.c1 .ab { font: 700 12.5px ui-monospace, monospace; color: #e8eaf0; }
  .rc.c1 .fn { font-size: 9px; color: #6b7284; }
  #tnote {
    position: absolute; left: 152px; top: 622px; width: 976px; text-align: center;
    font-size: 13.5px; font-style: italic; color: var(--accent); opacity: 0; visibility: hidden; z-index: 30;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">The Map, Completed</div>
  <div class="slide-sub">nine techniques, four buckets — the whole talk, played back</div>

  <div id="rail">
    <div class="rl">
      <span class="rlab">CARDS</span><b id="r-cards">0 / 9</b>
      <span class="rlab" style="margin-left:22px">SPEED</span><b id="r-speed">×1.00</b><span id="r-cap"></span>
    </div>
    <div class="rfine" id="r-fine"></div>
  </div>

  <div id="buckets" data-no-advance></div>

  <div id="simcol">
    <div id="simghost" class="sim"></div>
    <div id="simhost" class="sim"></div>
    <div id="prefill">
      <div class="ph">prefill<span class="pill">TTFT</span></div>
      <div class="bar"><i></i></div>
    </div>
    <div id="tpot">TPOT</div>
  </div>

  <div id="trayhint"></div>
  <div id="tray" data-no-advance></div>

  <div id="results">
    <div class="rhead"><span class="rt">RESULTS</span><span class="rs" id="res-score"></span></div>
    <div id="resrows"></div>
  </div>
  <div id="tnote"></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/bottlenecks.js?v=6"></script>
<script src="shared/closing.js?v=6"></script>
<script src="shared/manifest.js?v=6"></script>
<script src="shared/deck.js?v=6"></script>
<script>
  var stageEl = document.querySelector(".stage");

  // ---- board: four bucket panels, 2 × 2 -------------------------------
  var POS = { compute: [44, 150], bw: [314, 150], cap: [44, 359], comm: [314, 359] };
  var panels = {}, ZONES = {};
  BN.list.forEach(function (b) {
    var p = POS[b.key];
    var el = document.createElement("div");
    el.className = "bucket"; el.id = "bk-" + b.key;
    el.style.left = p[0] + "px"; el.style.top = p[1] + "px";
    var nameCol = b.key === "cap" ? "#e0a935" : b.color;
    el.innerHTML = '<div class="bflash" style="border-color:' + b.color + '; box-shadow:0 0 26px ' + b.color + 'cc"></div>' +
      BN.iconHTML(b.key) +
      '<div class="bname" style="color:' + nameCol + '">' + b.name + "</div>" +
      '<div class="bunit">' + b.unit + "</div>" +
      '<div class="dockrow"></div>';
    document.getElementById("buckets").appendChild(el);
    panels[b.key] = el;
    ZONES[b.key] = { rect: [p[0], p[1], 250, 195], color: b.color, el: el };
  });

  document.getElementById("r-fine").textContent = CL.trueFactors;
  document.getElementById("trayhint").textContent = "drag a card to its bucket — or tap it and watch it fly";

  // ---- card tray ------------------------------------------------------
  var tray = document.getElementById("tray");
  var cardByAbbr = {};
  BN.techniques.forEach(function (t) {
    var c = document.createElement("div");
    c.className = "tcard";
    c.dataset.abbr = t[1];
    c.dataset.domains = JSON.stringify(t[2]);
    c.innerHTML = '<div class="abbr">' + t[1] + '</div><div class="full">' + t[0] + "</div>" +
      '<span class="prog">' + t[2].map(function () { return "<i></i>"; }).join("") + "</span>";
    tray.appendChild(c);
    cardByAbbr[t[1]] = c;
  });

  // ---- scoreboard state ----------------------------------------------
  var FACTORS = { "FA": 1.30, "GQA": 1.25, "MLA": 1.30, "KDA": 1.35, "FP8 / INT4": 1.50,
                  "MoE": 1.80, "EP": 1.15, "PD": 1.20, "MTP": 1.40 };
  var placed = {}, placedCount = 0;
  function trueSpeed() {
    var s = 1;
    Object.keys(placed).forEach(function (a) { s *= FACTORS[a]; });
    return s;
  }
  function railText() {
    var t = trueSpeed();
    document.getElementById("r-cards").textContent = placedCount + " / 9";
    var sp = document.getElementById("r-speed"), cap = document.getElementById("r-cap");
    if (t <= CL.speedCap + 1e-9) {
      sp.textContent = "×" + t.toFixed(2);
      cap.textContent = "";
    } else {
      sp.textContent = "×" + CL.speedCap.toFixed(1);
      cap.textContent = "display cap · true ×" + t.toFixed(1);
    }
  }
  function tickRail(big) {
    railText();
    fxAdd(gsap.fromTo("#r-cards", { scale: 1.3 }, { scale: 1, duration: 0.3, ease: "power2.out" }));
    fxAdd(gsap.fromTo("#r-speed", { scale: big ? 1.7 : 1.35, color: "#ffffff" },
      { scale: 1, color: "#2fd6b0", duration: big ? 0.5 : 0.35, ease: "power2.out" }));
    mainSim.setSpeed(Math.min(CL.speedCap, trueSpeed()));
  }

  // ---- geometry helpers ----------------------------------------------
  function stageScale() { return stageEl.getBoundingClientRect().width / 1280; }
  function cardCenter(card) {
    var r = card.getBoundingClientRect(), sr = stageEl.getBoundingClientRect(), s = stageScale();
    return { x: (r.left + r.width / 2 - sr.left) / s, y: (r.top + r.height / 2 - sr.top) / s };
  }
  function hitZone(pt) {
    var ks = Object.keys(ZONES);
    for (var i = 0; i < ks.length; i++) {
      var r = ZONES[ks[i]].rect;
      if (pt.x >= r[0] && pt.x <= r[0] + r[2] && pt.y >= r[1] && pt.y <= r[1] + r[3]) return ks[i];
    }
    return null;
  }

  // ---- independent-FX registry (killed on reset; never touches timeline tweens)
  var fx = [];
  function fxAdd(t) { fx.push(t); return t; }
  function fxKill() {
    fx.forEach(function (t) { t.kill(); });
    fx.length = 0;
  }

  // ---- game feel: toasts, flashes, shake ------------------------------
  function toast(zoneKey, text, color) {
    var r = ZONES[zoneKey].rect;
    var t = document.createElement("div");
    t.className = "ztoast";
    t.style.cssText = "left:" + (r[0] + r[2] / 2) + "px; top:" + (r[1] - 14) + "px; transform:translateX(-50%); color:" + color + ";";
    t.textContent = text;
    stageEl.appendChild(t);
    fxAdd(gsap.fromTo(t, { opacity: 0, y: 8 }, {
      opacity: 1, y: -24, duration: 1.5, ease: "power1.out",
      onComplete: function () { fxAdd(gsap.to(t, { opacity: 0, duration: 0.4, onComplete: function () { t.remove(); } })); }
    }));
  }
  function flash(zoneKey) {
    var f = ZONES[zoneKey].el.querySelector(".bflash");
    fxAdd(gsap.fromTo(f, { opacity: 0 }, { opacity: 1, duration: 0.09, yoyo: true, repeat: 3 }));
  }
  function shake() {
    fxAdd(gsap.timeline()
      .to("#buckets", { x: -5, duration: 0.05 }).to("#buckets", { x: 4, duration: 0.05 })
      .to("#buckets", { x: -3, duration: 0.05 }).to("#buckets", { x: 2, duration: 0.05 })
      .to("#buckets", { x: 0, duration: 0.05 }));
  }
  function dockChip(zoneKey, abbr) {
    var chip = document.createElement("span");
    chip.className = "dchip";
    chip.style.color = ZONES[zoneKey].color;
    chip.style.borderColor = ZONES[zoneKey].color + "88";
    chip.textContent = abbr.replace(" / ", "/");
    ZONES[zoneKey].el.querySelector(".dockrow").appendChild(chip);
    fxAdd(gsap.fromTo(chip, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.5)" }));
  }

  // ---- per-card landing toasts + special effects ----------------------
  var TOAST = { compute: "FLOPs / token ↓", bw: "bytes / token ↓", cap: "footprint ↓", comm: "traffic ↓" };
  var TOAST_CARD = {
    "MoE": { compute: "FLOPs / token ↓↓" },
    "MTP": { bw: "bytes / token ÷ k" },
    "PD":  { compute: "prefill pool", bw: "decode pool" },
    "EP":  { cap: "", comm: "" },          // EP's chain-clear speaks for itself
  };

  function spawnDrafts() {
    for (var i = 0; i < 4; i++) {
      (function (i) {
        var d = document.createElement("div");
        d.className = "draft";
        d.textContent = BN.simWords[(7 * i + 3) % BN.simWords.length];
        d.style.left = (640 + i * 138) + "px";
        d.style.top = "318px";
        stageEl.appendChild(d);
        fxAdd(gsap.fromTo(d, { opacity: 0 }, {
          opacity: 1, duration: 0.12, yoyo: true, repeat: 5, delay: 0.15 * i,
          onComplete: function () {
            if (i % 2 === 0) {           // rejected drafts flicker and vanish
              d.classList.add("dead");
              fxAdd(gsap.to(d, { opacity: 0, y: 16, duration: 0.6, delay: 0.25, onComplete: function () { d.remove(); } }));
            } else {
              fxAdd(gsap.to(d, { opacity: 0, y: -10, duration: 0.5, delay: 0.55, onComplete: function () { d.remove(); } }));
            }
          }
        }));
      })(i);
    }
  }

  var FX = {
    "MoE": function () {
      fxAdd(gsap.delayedCall(0.35, function () {
        if (placed["EP"]) { flash("cap"); flash("comm"); return; }   // already solved: a flicker, no siege
        panels.cap.classList.add("flood");
        panels.comm.classList.add("alert");
        toast("cap", "experts don't fit", "#e0a935");
        toast("comm", "all-to-all ↑", "#e04b38");
        shake();
      }));
    },
    "EP": function () {
      panels.cap.classList.remove("flood");
      toast("cap", "✓ experts sharded", "#e0a935");
      fxAdd(gsap.delayedCall(0.55, function () {
        panels.comm.classList.remove("alert");
        toast("comm", "✓ all-to-all routed", "#9085e9");
      }));
    },
    "MTP": function () {
      panels.bw.querySelectorAll(".bni-pipe i").forEach(function (p, i) {
        if (i % 2) p.style.opacity = "0.12";
        p.style.animationDuration = "2.4s";
      });
      panels.compute.querySelector(".bni-chip").classList.add("hot");
      spawnDrafts();
    },
    "PD": function () {
      fxAdd(gsap.to("#simghost", { autoAlpha: 0, duration: 0.35 }));
      fxAdd(gsap.fromTo("#prefill", { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.45 }));
      fxAdd(gsap.fromTo("#tpot", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.35, delay: 0.15 }));
    },
  };

  // ---- docking (shared by drag, tap-to-fly, and auto-play) ------------
  function land(abbr, domains) {
    domains.forEach(function (z) {
      flash(z);
      dockChip(z, abbr);
      var msg = (TOAST_CARD[abbr] && TOAST_CARD[abbr][z] !== undefined) ? TOAST_CARD[abbr][z] : TOAST[z];
      if (msg) toast(z, msg, ZONES[z].color);
    });
    tickRail(abbr === "MoE");
    if (FX[abbr]) FX[abbr]();
  }
  function dockCard(card) {
    if (!card || card._spent) return false;
    card._spent = true;
    var abbr = card.dataset.abbr;
    var domains = JSON.parse(card.dataset.domains);
    placed[abbr] = true; placedCount++;
    var c = cardCenter(card);
    card._pos = null;
    gsap.set(card, { clearProps: "transform" });
    card.classList.add("spent");
    card.querySelectorAll(".prog i").forEach(function (d) { d.classList.add("done"); });
    // a clone flies from wherever the card visually was into its bucket
    var clone = document.createElement("div");
    clone.className = "tcard fly";
    clone.innerHTML = '<div class="abbr">' + abbr + "</div>";
    clone.style.left = (c.x - 52) + "px"; clone.style.top = (c.y - 16) + "px";
    stageEl.appendChild(clone);
    var tz = ZONES[domains[0]].rect;
    fxAdd(gsap.to(clone, {
      left: (tz[0] + tz[2] / 2 - 52) + "px", top: (tz[1] + tz[3] / 2 - 16) + "px",
      scale: 0.22, opacity: 0.85, duration: 0.55, ease: "power2.in",
      onComplete: function () { clone.remove(); land(abbr, domains); }
    }));
    return true;
  }
  function auto(abbr) { dockCard(cardByAbbr[abbr]); }

  // wrong drop: red shake, spring back, nothing improves
  function rejectCard(card) {
    var c = cardCenter(card);
    var t = document.createElement("div");
    t.className = "ztoast";
    t.style.cssText = "left:" + c.x + "px; top:" + (c.y - 26) + "px; transform:translateX(-50%); color:#e04b38;";
    t.textContent = "✗ not this bucket";
    stageEl.appendChild(t);
    fxAdd(gsap.fromTo(t, { opacity: 0, y: 6 }, {
      opacity: 1, y: -20, duration: 1.3,
      onComplete: function () { fxAdd(gsap.to(t, { opacity: 0, duration: 0.4, onComplete: function () { t.remove(); } })); }
    }));
    fxAdd(gsap.timeline()
      .to(card, { x: "+=9", duration: 0.05, yoyo: true, repeat: 5 })
      .to(card, { x: 0, y: 0, scale: 1, duration: 0.5, ease: "power3.inOut", onStart: function () { card._pos = null; } }));
  }

  // ---- drag + tap-to-fly ---------------------------------------------
  function enableDrag(card) {
    card.addEventListener("pointerdown", function (e) {
      if (card._spent) return;
      e.preventDefault();
      var s = stageScale();
      var startX = e.clientX, startY = e.clientY, moved = 0;
      var base = card._pos || { x: 0, y: 0 };
      card.setPointerCapture(e.pointerId);
      function mv(ev) {
        moved = Math.max(moved, Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY));
        if (moved > 6) card.classList.add("dragging");
        card._pos = { x: base.x + (ev.clientX - startX) / s, y: base.y + (ev.clientY - startY) / s };
        card.style.transform = "translate(" + card._pos.x + "px," + card._pos.y + "px) scale(1.07)";
      }
      function up() {
        card.classList.remove("dragging");
        card.removeEventListener("pointermove", mv);
        card.removeEventListener("pointerup", up);
        if (moved <= 6) { dockCard(card); return; }        // a tap: auto-fly to the right bucket
        var zk = hitZone(cardCenter(card));
        if (!zk) {
          card._pos = null;
          fxAdd(gsap.to(card, { x: 0, y: 0, scale: 1, duration: 0.55, ease: "elastic.out(1, 0.6)" }));
        } else if (JSON.parse(card.dataset.domains).indexOf(zk) >= 0) {
          dockCard(card);
        } else {
          rejectCard(card);
        }
      }
      card.addEventListener("pointermove", mv);
      card.addEventListener("pointerup", up);
    });
  }
  document.querySelectorAll("#tray .tcard").forEach(enableDrag);

  // ---- results table (the end state) ---------------------------------
  var rr = document.getElementById("resrows");
  function rrow(cells, hd) {
    var d = document.createElement("div");
    d.className = "rrow" + (hd ? " hd" : "");
    d.innerHTML = '<div class="rc c1">' + cells[0] + '</div><div class="rc c2">' + cells[1] +
      '</div><div class="rc c3">' + cells[2] + '</div><div class="rc c4">' + cells[3] + "</div>";
    rr.appendChild(d);
  }
  rrow(["TECHNIQUE", "BOTTLENECK ATTACKED", "STAGE", "IN K3?"], true);
  BN.techniques.forEach(function (t) {
    var m = CL.map[t[1]];
    rrow(['<span class="ab">' + t[1] + '</span><br><span class="fn">' + t[0] + "</span>", m[0], m[1], m[2]]);
  });
  document.getElementById("tnote").textContent = CL.tableNote;
  function setFinalScore() {
    var t = trueSpeed();
    document.getElementById("res-score").textContent =
      placedCount + " / 9 · sim ×" + Math.min(CL.speedCap, t).toFixed(1) +
      (t > CL.speedCap ? " display cap · true ×" + t.toFixed(1) : "");
  }

  // ---- sims -----------------------------------------------------------
  var ghostSim = BN.buildSim(document.getElementById("simghost"), {});
  document.querySelector("#simghost .sim-head").innerHTML =
    '<span class="sim-dot" style="background:#5b647c"></span> launch speed — reference ×1.0';
  var mainSim = BN.buildSim(document.getElementById("simhost"), {});

  // ---- reset ----------------------------------------------------------
  function resetAll() {
    fxKill();
    tray.style.pointerEvents = "none";
    gsap.set("#buckets", { clearProps: "x" });
    document.querySelectorAll(".fly, .ztoast, .draft").forEach(function (e) { e.remove(); });
    document.querySelectorAll(".dockrow").forEach(function (d) { d.innerHTML = ""; });
    document.querySelectorAll(".bflash").forEach(function (f) { f.style.opacity = 0; });
    gsap.set(["#r-cards", "#r-speed"], { clearProps: "transform,color" });
    Object.keys(cardByAbbr).forEach(function (a) {
      var c = cardByAbbr[a];
      c._spent = false; c._pos = null;
      c.classList.remove("spent", "dragging");
      c.querySelectorAll(".prog i").forEach(function (d) { d.classList.remove("done"); });
      gsap.set(c, { clearProps: "transform" });
    });
    panels.cap.classList.remove("flood");
    panels.comm.classList.remove("alert");
    panels.compute.querySelector(".bni-chip").classList.remove("hot");
    panels.bw.querySelectorAll(".bni-pipe i").forEach(function (p) { p.style.opacity = ""; p.style.animationDuration = ""; });
    placed = {}; placedCount = 0;
    railText();
    mainSim.stop(); mainSim.setSpeed(1); ghostSim.stop();
    gsap.set("#simghost", { clearProps: "opacity,visibility" });
    gsap.set("#prefill", { autoAlpha: 0 });
    gsap.set("#tpot", { autoAlpha: 0 });
  }
  railText();

  // test hook (read-only)
  window._state = { placed: function () { return placedCount; }, speed: function () { return trueSpeed(); } };

  // ---- timeline -------------------------------------------------------
  var tl = gsap.timeline({ paused: true });

  // beat 1: the board returns — buckets, scoreboard, sims, nine cards unlocked
  tl.fromTo(".bucket", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.09, ease: "power2.out" })
    .fromTo("#rail", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4 }, "-=0.25")
    .fromTo("#simghost", { opacity: 0 }, { opacity: 1, duration: 0.35 }, "-=0.1")
    .fromTo("#simhost", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.4 }, "-=0.2")
    .call(function () { ghostSim.start(); mainSim.start(); })
    .fromTo("#tray .tcard", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.05 })
    .fromTo("#trayhint", { opacity: 0 }, { opacity: 1, duration: 0.3 }, "-=0.2")
    .call(function () { tray.style.pointerEvents = "auto"; });
  DECK.markStep(tl);

  // beat 2: phase 1 — the positive fits, one dock per notch
  ["FA", "GQA", "MLA", "KDA", "FP8 / INT4"].forEach(function (a) {
    tl.call(function () { auto(a); });
    tl.to({}, { duration: 0.85 });
  });
  tl.to({}, { duration: 0.5 });
  DECK.markStep(tl);

  // beat 3: the chain reaction — MoE floods capacity + interconnect, EP clears it
  tl.call(function () { auto("MoE"); });
  tl.to({}, { duration: 2.1 });
  tl.call(function () { auto("EP"); });
  tl.to({}, { duration: 1.9 });
  DECK.markStep(tl);

  // beat 4: MTP — the only card that spends compute to buy bandwidth
  tl.call(function () { auto("MTP"); });
  tl.to({}, { duration: 1.9 });
  DECK.markStep(tl);

  // beat 5: PD — the decode sim splits into prefill (TTFT) + decode (TPOT)
  tl.call(function () { auto("PD"); });
  tl.to({}, { duration: 2.0 });
  DECK.markStep(tl);

  // beat 6: the end state — the results screen slams down, row by row
  tl.to(["#buckets", "#rail", "#tray", "#trayhint", "#simcol"], { autoAlpha: 0.06, duration: 0.5 })
    .call(function () { tray.style.pointerEvents = "none"; setFinalScore(); })
    .fromTo("#results", { autoAlpha: 0, scale: 0.97 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "power2.out" })
    .fromTo("#results .rrow", { y: -24, autoAlpha: 0 },
      { y: 0, autoAlpha: 1, duration: 0.3, stagger: 0.11, ease: "back.out(2)" })
    .fromTo("#tnote", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.45 });

  DECK.register(tl, { reset: resetAll });
</script>
</body>
</html>
