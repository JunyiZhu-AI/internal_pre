<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Drafter and the Judge</title>
<link rel="stylesheet" href="shared/deck.css?v=5">
<link rel="stylesheet" href="shared/bottlenecks.css?v=5">
<style>
  #cap1 { position: absolute; left: 44px; top: 100px; width: 1160px; font-size: 11.5px; font-style: italic; color: var(--ink-2); opacity: 0; }

  /* ---- weights + KV block (the thing every step re-reads) ---- */
  #weights {
    position: absolute; left: 56px; top: 150px; width: 140px; height: 260px;
    border: 2px solid rgba(201,133,0,0.7); border-radius: 8px; background: #0d1118; opacity: 0;
  }
  #weights .wlab { position: absolute; bottom: 5px; width: 100%; text-align: center; font: 700 9.5px ui-monospace, monospace; color: #e0a935; letter-spacing: 0.05em; }
  #wcells { position: absolute; left: 8px; top: 8px; right: 8px; bottom: 24px; display: flex; flex-wrap: wrap; gap: 2px; align-content: flex-start; overflow: hidden; }
  #wcells i {
    flex: none; width: 28px; height: 12px; border-radius: 2px;
    background: linear-gradient(rgba(201,133,0,0.45), rgba(201,133,0,0.85));
    animation: wGlow 2.6s ease-in-out infinite;
  }
  #wcells i:nth-child(3n) { animation-delay: 0.6s; }
  #wcells i:nth-child(4n) { animation-delay: 1.3s; }
  @keyframes wGlow { 50% { opacity: 0.55; } }

  /* the weight-read pulse: one massive amber beam per read */
  #beam {
    position: absolute; left: 192px; top: 242px; width: 92px; height: 56px; border-radius: 8px;
    background: linear-gradient(90deg, rgba(201,133,0,0.25), #e0a935);
    box-shadow: 0 0 26px rgba(224,169,53,0.8); opacity: 0;
  }
  #jflash {
    position: absolute; left: 278px; top: 160px; width: 214px; height: 220px; border-radius: 13px;
    border: 3px solid rgba(224,169,53,0.9); box-shadow: 0 0 22px rgba(224,169,53,0.6);
    opacity: 0; pointer-events: none; z-index: 7;
  }

  /* ---- the judge: the full model ---- */
  #judge {
    position: absolute; left: 280px; top: 162px; width: 210px; height: 216px;
    border: 2.5px solid rgba(57,135,229,0.55); border-radius: 12px; background: #0d1420; opacity: 0;
  }
  #judge .jlab { position: absolute; top: 7px; left: 12px; font: 700 9.5px ui-monospace, monospace; color: #9ec7f5; letter-spacing: 0.06em; }
  #jtiles { position: absolute; left: 10px; right: 10px; top: 26px; bottom: 12px; display: grid; gap: 3px; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(5, 1fr); }
  #jtiles i { background: rgba(57,135,229,0.08); border-radius: 2px; }
  #judge.blaze { border-color: #6fb1ff; animation: jPulse 1.1s ease-in-out infinite; }
  #judge.blaze #jtiles i { animation: jTw 1s ease-in-out infinite; background: rgba(111,177,255,0.45); }
  #judge.blaze #jtiles i:nth-child(3n) { animation-delay: 0.3s; }
  #judge.blaze #jtiles i:nth-child(4n) { animation-delay: 0.6s; }
  #judge.blaze #jtiles i:nth-child(5n) { animation-delay: 0.85s; }
  @keyframes jPulse { 50% { box-shadow: 0 0 24px rgba(111,177,255,0.7); } }
  @keyframes jTw { 50% { background: #9ec7f5; } }

  #aichip {
    position: absolute; left: 280px; top: 130px; font: 700 10px ui-monospace, monospace;
    color: #6fb1ff; border: 1.5px solid rgba(111,177,255,0.55); border-radius: 999px;
    padding: 3px 11px; background: rgba(11,13,18,0.92); white-space: nowrap; opacity: 0; z-index: 8;
  }

  /* the technique gets its name before the MTP reveal */
  #specname { position: absolute; left: 556px; top: 164px; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; color: #e8eaf0; opacity: 0; }
  #specrule { position: absolute; left: 557px; top: 187px; width: 54px; height: 3px; border-radius: 2px; background: var(--accent); transform-origin: left; }
  #specclassic { position: absolute; left: 556px; top: 197px; width: 322px; font-size: 10.5px; font-style: italic; color: var(--ink-2); line-height: 1.45; opacity: 0; }

  /* ---- the drafter: small, fast, sketchy ---- */
  #drafter {
    position: absolute; left: 610px; top: 240px; width: 92px; height: 92px;
    border: 2px dashed rgba(199,204,224,0.65); border-radius: 10px;
    background: repeating-linear-gradient(45deg, rgba(154,161,181,0.06) 0 6px, transparent 6px 12px);
    opacity: 0; z-index: 6;
  }
  #drafter .dlab { position: absolute; bottom: 5px; width: 100%; text-align: center; font: italic 600 8px ui-monospace, monospace; color: #9aa1b5; transition: opacity 0.3s; }
  #dtiles { position: absolute; left: 8px; right: 8px; top: 8px; bottom: 22px; display: grid; gap: 3px; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  #dtiles i { border: 1px dashed rgba(154,161,181,0.4); border-radius: 2px; }
  #drafter.docked { border-style: solid; border-color: var(--accent); background: rgba(47,214,176,0.08); box-shadow: 0 0 14px rgba(47,214,176,0.55); }
  #drafter.docked .dlab { opacity: 0; }
  #drafter.docked #dtiles i { border-style: solid; border-color: rgba(47,214,176,0.6); background: rgba(47,214,176,0.15); }

  /* the MTP-head slot inside the judge */
  #slot {
    position: absolute; left: 422px; top: 312px; width: 56px; height: 56px;
    border: 2px dashed rgba(224,169,53,0.75); border-radius: 8px; opacity: 0; z-index: 5;
    background: rgba(11,13,18,0.55);
  }
  #slot.lit { border-style: solid; border-color: var(--accent); box-shadow: 0 0 12px rgba(47,214,176,0.5); }
  #mtplab { position: absolute; left: 500px; top: 326px; font: 700 10px ui-monospace, monospace; color: #e0a935; opacity: 0; }
  #acc {
    position: absolute; left: 500px; top: 348px; font: 800 10.5px ui-monospace, monospace;
    color: var(--accent); border: 2px solid rgba(47,214,176,0.8); border-radius: 6px;
    padding: 3px 9px; background: rgba(11,13,18,0.92); white-space: nowrap; opacity: 0; z-index: 8;
  }

  /* ---- the token row ---- */
  .tk {
    position: absolute; top: 415px; font: 600 12px ui-monospace, monospace;
    padding: 4px 9px; border-radius: 6px; opacity: 0; white-space: nowrap; z-index: 4;
  }
  .tk.c { color: #dfe3ee; background: rgba(47,214,176,0.10); border: 1.5px solid rgba(47,214,176,0.5); }
  .tk.g {
    color: #9aa1b5; font-style: italic; background: rgba(27,30,39,0.4);
    border: 1.5px dashed rgba(154,161,181,0.75);
    transition: border-color 0.3s, color 0.3s, background 0.3s;
  }
  .tk.g.ink { border-style: solid; border-color: rgba(47,214,176,0.6); color: #dfe3ee; font-style: normal; background: rgba(47,214,176,0.10); }
  #t1 { left: 300px; } #t2 { left: 351px; } #t3 { left: 402px; }
  #g1 { left: 453px; } #g2 { left: 511px; } #g3 { left: 569px; } #g4 { left: 613px; }
  #fix { left: 613px; box-shadow: 0 0 10px rgba(47,214,176,0.45); }

  .stmp {
    position: absolute; top: 389px; font: 800 8.5px ui-monospace, monospace; letter-spacing: 0.06em;
    padding: 1px 5px; border: 1.5px solid; border-radius: 4px; background: rgba(11,13,18,0.92);
    opacity: 0; z-index: 9; transform: rotate(-8deg);
  }
  .stmp.ok { color: var(--accent); border-color: rgba(47,214,176,0.8); }
  .stmp.no { color: #e04b38; border-color: rgba(224,75,56,0.8); }
  #st1 { left: 452px; } #st2 { left: 510px; } #st3 { left: 561px; } #st4 { left: 612px; }

  #scan {
    position: absolute; left: 440px; top: 402px; width: 3px; height: 46px; border-radius: 2px;
    background: linear-gradient(rgba(47,214,176,0.1), #2fd6b0, rgba(47,214,176,0.1));
    box-shadow: 0 0 12px rgba(47,214,176,0.9); opacity: 0; z-index: 10;
  }

  #cap2 { position: absolute; left: 56px; top: 470px; width: 810px; font-size: 11.5px; color: #c7cce0; opacity: 0; }

  #loss {
    position: absolute; left: 56px; top: 500px; display: inline-flex; align-items: baseline; gap: 9px;
    border: 1.5px solid rgba(47,214,176,0.6); border-radius: 8px; padding: 5px 11px;
    background: var(--panel); opacity: 0; transform: rotate(-1deg);
  }
  #loss .lt { font: 800 10.5px ui-monospace, monospace; color: var(--accent); letter-spacing: 0.08em; }
  #loss .lx { font-size: 10.5px; color: #c7cce0; }

  /* ---- the judge's ledger ---- */
  #ledger {
    position: absolute; left: 890px; top: 136px; width: 346px;
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px;
    padding: 12px 14px 14px; opacity: 0;
  }
  #ledger .lhead { font: 700 10.5px ui-monospace, monospace; color: #e0a935; letter-spacing: 0.09em; }
  #lreframe { margin-top: 8px; font-size: 10.5px; font-style: italic; color: #9aa1b5; line-height: 1.45; opacity: 0; }
  #lbarrow { margin-top: 10px; opacity: 0; }
  #lbarrow .blab { font: 700 10.5px ui-monospace, monospace; color: #e0a935; }
  #lbar { margin-top: 5px; height: 12px; border: 1px solid var(--line); border-radius: 6px; background: rgba(11,13,18,0.6); overflow: hidden; }
  #lfill { height: 100%; transform-origin: left; background: linear-gradient(90deg, rgba(201,133,0,0.45), #e0a935); }
  #lecon { margin-top: 5px; font-size: 10px; font-style: italic; color: #9aa1b5; line-height: 1.4; opacity: 0; }
  #lpay { margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; opacity: 0; }
  #lpay .lic { width: 64px; height: 50px; display: flex; align-items: center; justify-content: center; }
  #lpay .lic .bn-icon { transform: scale(0.72); }
  #lpay .larr { display: flex; flex-direction: column; align-items: center; font: 700 8.5px ui-monospace, monospace; color: #9aa1b5; }
  #lpay .larr b { font-size: 15px; color: #6b7284; line-height: 1; }
  #lunique { margin-top: 6px; font-size: 11px; font-weight: 700; color: var(--accent); line-height: 1.4; opacity: 0; }

  /* ---- beat 4 / 5 text ---- */
  #cap4 { position: absolute; left: 56px; top: 540px; width: 810px; font-size: 11.5px; color: #c7cce0; opacity: 0; }
  #motto { position: absolute; left: 56px; top: 568px; width: 810px; font-size: 13.5px; font-weight: 700; color: var(--accent); opacity: 0; }

  .foot { position: absolute; left: 56px; width: 960px; display: flex; align-items: flex-start; gap: 9px; opacity: 0; }
  #foot1 { top: 610px; } #foot2 { top: 640px; }
  .foot .fi {
    flex: none; width: 17px; height: 17px; border: 1.5px solid rgba(224,75,56,0.65); border-radius: 4px;
    font: 700 9.5px ui-monospace, monospace; color: #e04b38;
    display: flex; align-items: center; justify-content: center;
  }
  .foot .fx { font-size: 11px; color: #9aa1b5; line-height: 1.45; padding-top: 1px; }
  .pdg { display: inline-flex; gap: 2px; margin-left: 8px; vertical-align: -2px; }
  .pdg i {
    display: inline-block; height: 15px; line-height: 13px; text-align: center; overflow: hidden;
    font: 700 8.5px ui-monospace, monospace; border-radius: 3px; font-style: normal;
  }
  #pdP { width: 20px; color: #6fb1ff; border: 1.5px solid rgba(111,177,255,0.6); }
  #pdD { width: 22px; color: var(--accent); border: 1.5px solid rgba(47,214,176,0.6); }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">The Drafter and the Judge</div>
  <div class="slide-sub">speculative decoding &amp; multi-token prediction — the last lever on the per-token bill</div>

  <div id="cap1"></div>

  <div id="weights"><div id="wcells"></div><span class="wlab">WEIGHTS + KV</span></div>
  <div id="beam"></div>
  <div id="judge"><span class="jlab">JUDGE — FULL MODEL</span><div id="jtiles"></div></div>
  <div id="jflash"></div>
  <div id="aichip"></div>

  <div id="specname"></div>
  <div id="specrule"></div>
  <div id="specclassic"></div>

  <div id="slot"></div>
  <div id="mtplab">MTP head</div>
  <div id="acc"></div>
  <div id="drafter"><div id="dtiles"></div><span class="dlab">drafter — small model</span></div>

  <span class="tk c" id="t1">and</span>
  <span class="tk c" id="t2">the</span>
  <span class="tk c" id="t3">die</span>
  <span class="tk g" id="g1">sits</span>
  <span class="tk g" id="g2">idle</span>
  <span class="tk g" id="g3">no</span>
  <span class="tk g" id="g4">more</span>
  <span class="tk c" id="fix">longer</span>
  <span class="stmp ok" id="st1">ACCEPT</span>
  <span class="stmp ok" id="st2">ACCEPT</span>
  <span class="stmp ok" id="st3">ACCEPT</span>
  <span class="stmp no" id="st4">REJECT</span>
  <div id="scan"></div>

  <div id="cap2"></div>
  <div id="loss"><span class="lt"></span><span class="lx"></span></div>

  <div id="ledger">
    <div class="lhead">THE JUDGE'S LEDGER</div>
    <div id="lreframe"></div>
    <div id="lbarrow">
      <div class="blab"></div>
      <div id="lbar"><div id="lfill"></div></div>
    </div>
    <div id="lecon"></div>
    <div id="lpay">
      <div class="lic" id="ic-compute"></div>
      <div class="larr"><span>pays</span><b>&rarr;</b></div>
      <div class="lic" id="ic-bw"></div>
    </div>
    <div id="lunique"></div>
  </div>

  <div id="cap4"></div>
  <div id="motto"></div>

  <div class="foot" id="foot1"><span class="fi">1</span><span class="fx"></span></div>
  <div class="foot" id="foot2"><span class="fi">2</span><span class="fx"></span><span class="pdg"><i id="pdP">P</i><i id="pdD">D</i></span></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/mtp.js?v=5"></script>
<script src="shared/gpus.js?v=5"></script>
<script src="shared/bottlenecks.js?v=5"></script>
<script src="shared/manifest.js?v=5"></script>
<script src="shared/deck.js?v=5"></script>
<script>
  // ---- static content from shared data (single source of truth) ----
  var h100 = GPUS.list.filter(function (g) { return g.key === "h100"; })[0];
  document.getElementById("cap1").textContent = MTP.serial;
  document.getElementById("aichip").textContent = MTP.ai + " · machine balance ≈ " + GPUS.balance(h100);
  document.getElementById("specname").textContent = MTP.spec.name;
  document.getElementById("specclassic").textContent = MTP.spec.classic;
  document.getElementById("cap2").textContent = MTP.spec.draft + "  →  " + MTP.spec.verify;

  var lossParts = MTP.spec.lossless.split(" — ");
  document.querySelector("#loss .lt").textContent = lossParts[0].toUpperCase();
  document.querySelector("#loss .lx").textContent = lossParts[1];

  document.getElementById("lreframe").textContent = MTP.reframe;
  var econParts = MTP.econ.split(" — ");
  document.querySelector("#lbarrow .blab").textContent = econParts[0];
  document.getElementById("lecon").textContent = econParts[1];
  document.getElementById("lunique").textContent = MTP.unique;
  document.getElementById("ic-compute").innerHTML = BN.iconHTML("compute");
  document.getElementById("ic-bw").innerHTML = BN.iconHTML("bw");

  document.getElementById("acc").textContent = MTP.dsv3.accept;
  document.getElementById("cap4").textContent = MTP.dsv3.what;
  document.getElementById("motto").textContent = MTP.dsv3.frame;
  document.querySelector("#foot1 .fx").textContent = MTP.caveats[0];
  document.querySelector("#foot2 .fx").textContent = MTP.caveats[1];

  // weights cells + judge / drafter tiles
  var wc = document.getElementById("wcells");
  for (var i = 0; i < 66; i++) wc.appendChild(document.createElement("i"));
  var jt = document.getElementById("jtiles");
  for (i = 0; i < 30; i++) jt.appendChild(document.createElement("i"));
  var dt = document.getElementById("dtiles");
  for (i = 0; i < 9; i++) dt.appendChild(document.createElement("i"));

  // ---- DOM mutators (via .call, restored in reset) ----
  var judge = document.getElementById("judge");
  var drafter = document.getElementById("drafter");
  var slot = document.getElementById("slot");
  function blaze(on) { judge.classList.toggle("blaze", on); }
  function ink(id) { document.getElementById(id).classList.add("ink"); }
  function dock() { drafter.classList.add("docked"); slot.classList.add("lit"); }

  // ---- timeline: 5 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the serial treadmill — one massive weight read per tiny token
  tl.fromTo("#cap1", { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.4 })
    .fromTo("#weights", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" })
    .fromTo("#judge", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, "<0.12");
  [["#t1", 0], ["#t2", 1], ["#t3", 2]].forEach(function (p) {
    tl.to("#beam", { opacity: 1, duration: 0.16, ease: "power1.in" }, "+=0.15")
      .to("#jflash", { opacity: 0.9, duration: 0.12 }, "<0.05")
      .to("#beam", { opacity: 0, duration: 0.32 }, "+=0.14")
      .to("#jflash", { opacity: 0, duration: 0.28 }, "<")
      .fromTo(p[0], { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, "<");
  });
  tl.fromTo("#aichip", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" });
  DECK.markStep(tl);

  // beat 2: the technique gets a name — the drafter sketches k ahead, the judge rules in ONE pass
  tl.fromTo("#specname", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" })
    .fromTo("#specrule", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, "<0.12")
    .fromTo("#specclassic", { opacity: 0 }, { opacity: 1, duration: 0.4 }, "<0.15")
    .fromTo("#drafter", { opacity: 0, scale: 0.5, rotation: -16 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.5, ease: "back.out(1.9)" })
    .fromTo("#g1", { opacity: 0, y: -12, rotation: -10 }, { opacity: 1, y: 0, rotation: -2, duration: 0.3, ease: "back.out(2)" })
    .fromTo("#g2", { opacity: 0, y: -12, rotation: 9 }, { opacity: 1, y: 0, rotation: 1.5, duration: 0.3, ease: "back.out(2)" }, "<0.14")
    .fromTo("#g3", { opacity: 0, y: -12, rotation: -10 }, { opacity: 1, y: 0, rotation: -2.5, duration: 0.3, ease: "back.out(2)" }, "<0.14")
    .fromTo("#g4", { opacity: 0, y: -12, rotation: 9 }, { opacity: 1, y: 0, rotation: 2, duration: 0.3, ease: "back.out(2)" }, "<0.14")
    .to("#drafter", { rotation: 1, duration: 0.12 }, "<")
    .to("#drafter", { rotation: -3, duration: 0.12 })
    .fromTo("#cap2", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35 })
    // the judge's single sweep: one weight read, k tokens checked
    .to("#beam", { opacity: 1, scaleY: 1.35, duration: 0.2, ease: "power1.in" }, "+=0.1")
    .to("#jflash", { opacity: 1, duration: 0.15 }, "<0.05")
    .call(function () { blaze(true); })
    .to("#scan", { opacity: 1, duration: 0.12 })
    .addLabel("scan")
    .to("#scan", { left: 690, duration: 1.1, ease: "none" }, "scan")
    .fromTo("#st1", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, "scan+=0.17")
    .to("#g1", { rotation: 0, duration: 0.25 }, "scan+=0.17")
    .call(function () { ink("g1"); }, null, "scan+=0.17")
    .fromTo("#st2", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, "scan+=0.42")
    .to("#g2", { rotation: 0, duration: 0.25 }, "scan+=0.42")
    .call(function () { ink("g2"); }, null, "scan+=0.42")
    .fromTo("#st3", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, "scan+=0.65")
    .to("#g3", { rotation: 0, duration: 0.25 }, "scan+=0.65")
    .call(function () { ink("g3"); }, null, "scan+=0.65")
    .fromTo("#st4", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, "scan+=0.87")
    .to("#scan", { opacity: 0, duration: 0.2 }, "scan+=1.12")
    // the rejected draft crumples; the verify pass itself supplies the correction
    .to("#g4", { rotation: 28, y: 52, scale: 0.5, opacity: 0, duration: 0.5, ease: "power2.in" })
    .to("#st4", { rotation: 14, y: 34, opacity: 0, duration: 0.45, ease: "power2.in" }, "<0.05")
    .fromTo("#fix", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" })
    .to("#beam", { opacity: 0, scaleY: 1, duration: 0.35 }, "<")
    .to("#jflash", { opacity: 0, duration: 0.3 }, "<")
    .call(function () { blaze(false); })
    .fromTo("#loss", { opacity: 0, scale: 1.25, rotation: -5 }, { opacity: 1, scale: 1, rotation: -1, duration: 0.45, ease: "back.out(1.7)" });
  DECK.markStep(tl);

  // beat 3: the ledger — bytes/token ÷ ~k, paid with the judge's idle compute
  tl.fromTo("#ledger", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" })
    .fromTo("#lreframe", { opacity: 0 }, { opacity: 1, duration: 0.4 })
    .fromTo("#lbarrow", { opacity: 0 }, { opacity: 1, duration: 0.3 })
    .to("#lfill", { scaleX: 0.26, duration: 0.9, ease: "power2.inOut" }, "+=0.25")
    .call(function () { blaze(true); }, null, "<")
    .fromTo("#lecon", { opacity: 0 }, { opacity: 1, duration: 0.35 }, "-=0.3")
    .fromTo("#lpay", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 })
    .fromTo("#lunique", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 });
  DECK.markStep(tl);

  // beat 4: DeepSeek-V3 — the drafter was inside the judge all along
  tl.fromTo("#slot", { opacity: 0 }, { opacity: 1, duration: 0.35 })
    .to("#drafter", { left: 404, top: 294, scale: 0.6, rotation: 0, duration: 0.9, ease: "power2.inOut" }, "+=0.1")
    .call(function () { dock(); })
    .to({}, { duration: 0.15 })
    .fromTo("#mtplab", { opacity: 0 }, { opacity: 1, duration: 0.3 })
    .fromTo("#acc", { opacity: 0, scale: 1.5, rotation: -9 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.45, ease: "back.out(1.8)" })
    .fromTo("#cap4", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35 })
    .fromTo("#motto", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" });
  DECK.markStep(tl);

  // beat 5: the fine print — two stamped footnotes
  tl.fromTo("#foot1", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 })
    .fromTo("#foot2", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, "<0.2")
    .to("#pdP", { width: 27, duration: 0.5, ease: "power2.inOut" }, "<0.25")
    .to("#pdD", { width: 15, duration: 0.5, ease: "power2.inOut" }, "<");

  DECK.register(tl, {
    reset: function () {
      blaze(false);
      ["g1", "g2", "g3"].forEach(function (id) { document.getElementById(id).classList.remove("ink"); });
      drafter.classList.remove("docked");
      slot.classList.remove("lit");
    }
  });
</script>
</body>
</html>
