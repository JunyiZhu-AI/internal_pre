<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoE: Conditional Computation</title>
<link rel="stylesheet" href="shared/deck.css?v=3">
<style>
  /* ---- the city plot ---- */
  #city { position: absolute; left: 44px; top: 110px; width: 640px; height: 470px; }
  #ground { position: absolute; left: 0; right: 0; top: 395px; height: 1.5px; background: var(--line); }

  /* dense tower: two halves that unzip */
  #tower { position: absolute; left: 232px; top: 15px; width: 176px; height: 380px; }
  .half {
    position: absolute; top: 0; bottom: 0; width: 87px;
    background: #141926; padding: 8px 7px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; align-content: stretch;
  }
  .halfL { left: 0; border: 1.5px solid rgba(57,135,229,0.55); border-right: 1px dashed rgba(57,135,229,0.3); border-radius: 6px 0 0 0; border-bottom: none; }
  .halfR { right: 0; border: 1.5px solid rgba(57,135,229,0.55); border-left: none; border-radius: 0 6px 0 0; border-bottom: none; }
  .twin { border-radius: 2px; background: rgba(111,177,255,0.72); animation: winTwinkle 2.4s ease-in-out infinite; }
  .twin:nth-child(3n) { animation-delay: 0.55s; }
  .twin:nth-child(4n) { animation-delay: 1.15s; }
  .twin:nth-child(5n) { animation-delay: 1.7s; }
  @keyframes winTwinkle { 50% { opacity: 0.45; } }
  #towerlab { position: absolute; left: 172px; top: 404px; width: 296px; text-align: center; font: 600 12px ui-monospace, monospace; color: #9ec7f5; }

  /* expert district (buildings built in JS) */
  .bld {
    position: absolute; background: #12161f; border: 1.5px solid rgba(57,135,229,0.32);
    border-radius: 4px 4px 0 0; border-bottom: none; padding: 5px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; align-content: stretch;
    transform-origin: bottom;
  }
  .win { border-radius: 1.5px; background: rgba(57,135,229,0.1); }
  .bld.chosen.on { border-color: #6fb1ff; box-shadow: 0 0 18px rgba(111,177,255,0.35); }
  .bld .bnum {
    position: absolute; top: -16px; left: 0; right: 0; text-align: center;
    font: 600 9px ui-monospace, monospace; color: #6b7284;
  }

  /* router + token */
  #router {
    position: absolute; left: 213px; top: 406px; width: 44px; height: 28px;
    border: 2px solid var(--accent); border-radius: 8px; background: #0e1a17;
    display: flex; align-items: center; justify-content: center;
    font: 700 9.5px ui-monospace, monospace; color: var(--accent); opacity: 0;
  }
  #token {
    position: absolute; left: 2px; top: 412px; width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 12px rgba(47,214,176,0.8); opacity: 0; z-index: 5;
  }
  #topktag {
    position: absolute; left: 268px; top: 409px; font: 600 11px ui-monospace, monospace;
    color: var(--ink-2); opacity: 0; white-space: nowrap;
  }
  #topktag b { color: var(--accent); font-weight: 700; }
  #beams { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  #beams line { stroke: #2fd6b0; stroke-width: 2; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(47,214,176,0.7)); }
  #distlab {
    position: absolute; left: 0px; top: 444px; width: 470px; text-align: center;
    font: 600 12px ui-monospace, monospace; color: #9ec7f5; opacity: 0;
  }

  /* ghost dense tower (beat 3) */
  #ghost {
    position: absolute; left: 502px; top: 95px; width: 96px; height: 300px;
    background: rgba(20,22,30,0.7); border: 1.5px dashed #4a5062; border-bottom: none;
    border-radius: 6px 6px 0 0; padding: 7px 6px; opacity: 0;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; align-content: stretch;
    transform-origin: bottom;
  }
  #ghost i { border-radius: 1.5px; background: rgba(154,161,181,0.28); }
  #ghostlab { position: absolute; left: 468px; top: 444px; width: 164px; text-align: center; font: 600 11px ui-monospace, monospace; color: #8a91a5; opacity: 0; }
  #ghostmeter {
    position: absolute; left: 470px; top: 62px; width: 160px; text-align: center;
    font: 700 12px ui-monospace, monospace; color: #e04b38; opacity: 0;
    border: 1.5px solid rgba(224,75,56,0.6); border-radius: 999px; padding: 3px 8px;
    background: rgba(11,13,18,0.9);
  }

  /* ---- right column: the decoupling ---- */
  #dec { position: absolute; left: 700px; top: 118px; width: 536px; height: 210px; opacity: 0; }
  .mgroup { position: absolute; top: 0; height: 210px; width: 70px; text-align: center; }
  .mbar { position: absolute; bottom: 34px; left: 7px; width: 56px; border-radius: 4px 4px 0 0; transform-origin: bottom; }
  #mtotal { left: 8px; } #mflops { left: 104px; }
  #mtotal .mbar { height: 132px; background: linear-gradient(rgba(224,169,53,0.25), rgba(201,133,0,0.85)); }
  #mflops .mbar { height: 37px; background: linear-gradient(rgba(111,177,255,0.35), rgba(57,135,229,0.9)); }
  .mval { position: absolute; bottom: 172px; width: 100%; font: 700 14px ui-monospace, monospace; }
  #mtotal .mval { color: #e0a935; } #mflops .mval { color: #6fb1ff; bottom: 77px; }
  .mname { position: absolute; bottom: 6px; width: 100%; font: 600 10.5px ui-monospace, monospace; color: var(--ink-2); line-height: 1.3; }
  #flatline { position: absolute; left: 100px; bottom: 71px; width: 84px; border-top: 1.5px dashed rgba(111,177,255,0.55); }
  #flattag { position: absolute; left: 188px; bottom: 66px; font: 600 10.5px ui-monospace, monospace; color: #6fb1ff; opacity: 0; }
  #mbase { position: absolute; left: 4px; bottom: 33px; width: 196px; height: 1.5px; background: var(--line); }
  .dline { position: absolute; left: 236px; width: 300px; font-size: 12.5px; line-height: 1.45; color: #c7cce0; opacity: 0; }
  .dline b { font-family: ui-monospace, monospace; font-size: 12px; }
  #dl1 { top: 28px; } #dl1 b { color: #6fb1ff; }
  #dl2 { top: 78px; } #dl2 b { color: #e0a935; }
  #dl3 { top: 128px; color: var(--accent); font-weight: 650; }

  /* ---- dual framing cards ---- */
  .dualcard {
    position: absolute; top: 348px; width: 258px; height: 128px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line); padding: 11px 13px; opacity: 0;
  }
  #cardflop { left: 700px; }
  #cardqual { left: 978px; border-color: rgba(47,214,176,0.65); box-shadow: 0 0 16px rgba(47,214,176,0.12); }
  .dualcard .ct { font: 700 12.5px ui-monospace, monospace; }
  #cardflop .ct { color: #8a91a5; } #cardqual .ct { color: var(--accent); }
  .dualcard .cs { margin-top: 6px; font-size: 12px; color: #c7cce0; line-height: 1.4; }
  .dualcard .ce { margin-top: 6px; font: 500 10.5px ui-monospace, monospace; color: #6b7284; line-height: 1.4; }
  #cardflop { filter: grayscale(0.35); }
  #neverline { position: absolute; left: 700px; top: 490px; width: 536px; font: 600 11.5px ui-monospace, monospace; color: #e07b6d; opacity: 0; }

  /* ---- bottom takeaway ---- */
  .btm { position: absolute; left: 44px; width: 960px; font-size: 13.5px; line-height: 1.45; opacity: 0; display: flex; gap: 10px; align-items: baseline; }
  #btm1 { top: 626px; color: #e8eaf0; }
  #btm2 { top: 662px; color: #e0a935; font-weight: 600; }
  .btm .mark { flex: none; width: 8px; height: 8px; border-radius: 2px; position: relative; top: -1px; }
  #btm1 .mark { background: var(--accent); border-radius: 50%; }
  #btm2 .mark { background: #c98500; }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">MoE: Conditional Computation</div>
  <div class="slide-sub" id="sub"></div>

  <div id="city">
    <div id="ground"></div>
    <div id="tower">
      <div class="half halfL"></div>
      <div class="half halfR"></div>
    </div>
    <div id="towerlab">dense FFN — one tower, every window lit for every token</div>
    <div id="district"></div>
    <svg id="beams" width="640" height="470"></svg>
    <div id="router">route</div>
    <div id="token"></div>
    <div id="topktag">top-<b>k</b> of N light up · <b>Switch: k = 1</b></div>
    <div id="distlab"></div>
    <div id="ghost"></div>
    <div id="ghostmeter"></div>
    <div id="ghostlab"></div>
  </div>

  <div id="dec">
    <div class="mgroup" id="mtotal"><div class="mval">47B</div><div class="mbar"></div><div class="mname">TOTAL<br>params</div></div>
    <div class="mgroup" id="mflops"><div class="mval">13B</div><div class="mbar"></div><div class="mname">active →<br>FLOPs/token</div></div>
    <div id="flatline"></div><div id="flattag">flat</div>
    <div id="mbase"></div>
    <div class="dline" id="dl1"></div>
    <div class="dline" id="dl2"></div>
    <div class="dline" id="dl3"></div>
  </div>

  <div class="dualcard" id="cardflop"><div class="ct"></div><div class="cs"></div><div class="ce"></div></div>
  <div class="dualcard" id="cardqual"><div class="ct"></div><div class="cs"></div><div class="ce"></div></div>
  <div id="neverline"></div>

  <div class="btm" id="btm1"><span class="mark"></span><span></span></div>
  <div class="btm" id="btm2"><span class="mark"></span><span></span></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/moe.js?v=3"></script>
<script src="shared/manifest.js?v=3"></script>
<script src="shared/deck.js?v=3"></script>
<script>
  // ---- static content from shared data ----
  document.getElementById("sub").textContent = MOE.mech;
  document.querySelector("#dl1").innerHTML = MOE.decouple.flops.replace("ACTIVE", "<b>ACTIVE</b>");
  document.querySelector("#dl2").innerHTML = MOE.decouple.quality.replace("TOTAL", "<b>TOTAL</b>");
  document.querySelector("#dl3").textContent = MOE.decouple.arb;
  function fillCard(id, arr) {
    var c = document.getElementById(id);
    c.querySelector(".ct").textContent = arr[0];
    c.querySelector(".cs").textContent = arr[1];
    c.querySelector(".ce").textContent = arr[2];
  }
  fillCard("cardflop", MOE.dual.isoFlop);
  fillCard("cardqual", MOE.dual.isoQuality);
  document.getElementById("neverline").textContent = MOE.dual.never;
  document.querySelector("#btm1 span:last-child").textContent = MOE.whyEveryone;
  document.querySelector("#btm2 span:last-child").textContent = MOE.keepBoth;
  document.getElementById("distlab").textContent =
    "Mixtral 8×7B — " + MOE.mixtral.total + "B total / " + MOE.mixtral.active + "B active";
  document.getElementById("ghostlab").textContent = "Llama-2-" + MOE.mixtral.dense + "B — dense · ≈ same quality";
  document.getElementById("ghostmeter").textContent = MOE.mixtral.ratio + " FLOPs / token";
  document.getElementById("mtotal").querySelector(".mval").textContent = MOE.mixtral.total + "B";
  document.getElementById("mflops").querySelector(".mval").textContent = MOE.mixtral.active + "B";

  // ---- build the dense tower windows ----
  document.querySelectorAll(".half").forEach(function (h) {
    for (var i = 0; i < 56; i++) { var w = document.createElement("i"); w.className = "twin"; h.appendChild(w); }
  });

  // ---- build the expert district ----
  var H = [150, 192, 166, 212, 178, 152, 196, 170];
  var GROUND = 395, X0 = 16, BW = 46, PITCH = 56;
  var district = document.getElementById("district");
  var blds = [], CHOSEN = [2, 5];
  H.forEach(function (h, i) {
    var b = document.createElement("div");
    b.className = "bld" + (CHOSEN.indexOf(i) >= 0 ? " chosen" : "");
    b.style.left = (X0 + i * PITCH) + "px";
    b.style.top = (GROUND - h) + "px";
    b.style.width = BW + "px"; b.style.height = h + "px";
    var rows = Math.floor((h - 12) / 14);
    for (var r = 0; r < rows * 3; r++) { var w = document.createElement("i"); w.className = "win"; b.appendChild(w); }
    b.insertAdjacentHTML("beforeend", '<span class="bnum">E' + (i + 1) + "</span>");
    district.appendChild(b);
    blds.push(b);
  });
  // ghost windows
  var ghost = document.getElementById("ghost");
  for (var g = 0; g < 48; g++) ghost.appendChild(document.createElement("i"));
  // beams router -> chosen buildings
  var beams = document.getElementById("beams");
  var RX = 235, RY = 408;
  CHOSEN.forEach(function (i) {
    var x2 = X0 + i * PITCH + BW / 2, y2 = GROUND - H[i] * 0.45;
    var len = Math.hypot(x2 - RX, y2 - RY);
    var ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
    ln.setAttribute("x1", RX); ln.setAttribute("y1", RY);
    ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
    ln.setAttribute("stroke-dasharray", len);
    ln.setAttribute("stroke-dashoffset", len);
    beams.appendChild(ln);
  });

  gsap.set(".bld", { scaleY: 0 });
  gsap.set("#ghost", { scaleY: 0, opacity: 0 });

  // ---- timeline: 4 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the tower unzips into the expert district; a token routes top-k
  tl.to(".halfL", { x: -70, opacity: 0, duration: 0.6, ease: "power2.in" })
    .to(".halfR", { x: 70, opacity: 0, duration: 0.6, ease: "power2.in" }, "<")
    .to("#towerlab", { opacity: 0, duration: 0.3 }, "<")
    .to(".bld", { scaleY: 1, duration: 0.55, stagger: 0.055, ease: "back.out(1.4)" }, "-=0.15")
    .fromTo("#router", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, "-=0.2")
    .fromTo("#token", { opacity: 0, x: 0 }, { opacity: 1, duration: 0.2 })
    .to("#token", { x: 212, duration: 0.7, ease: "power1.inOut" })
    .to("#router", { boxShadow: "0 0 22px rgba(47,214,176,0.9)", duration: 0.18, yoyo: true, repeat: 1 })
    .to("#token", { opacity: 0, duration: 0.15 }, "<")
    .to("#beams line", { attr: { "stroke-dashoffset": 0 }, duration: 0.35, stagger: 0.1, ease: "power1.out" })
    .to(".bld.chosen .win", { backgroundColor: "rgba(111,177,255,0.95)", duration: 0.4, stagger: { each: 0.006, from: "random" } }, "-=0.1")
    .add(function () { blds.forEach(function (b) { if (b.classList.contains("chosen")) b.classList.add("on"); }); })
    .to(".bld:not(.chosen)", { opacity: 0.55, duration: 0.4 }, "<")
    .fromTo("#topktag", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35 });
  DECK.markStep(tl);

  // beat 2: the decoupling — TOTAL spikes, FLOPs/token flat
  tl.to("#dec", { opacity: 1, duration: 0.35 })
    .fromTo("#mflops .mbar", { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "power2.out" })
    .fromTo("#mflops .mval", { opacity: 0 }, { opacity: 1, duration: 0.3 }, "-=0.2")
    .fromTo("#mtotal .mbar", { scaleY: 0.28 }, { scaleY: 1, duration: 0.7, ease: "power3.out" })
    .fromTo("#mtotal .mval", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35 }, "-=0.3")
    .fromTo("#flattag", { opacity: 0 }, { opacity: 1, duration: 0.3 })
    .fromTo("#dl1", { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.4 })
    .fromTo("#dl2", { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.4 }, "-=0.15")
    .fromTo("#dl3", { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.4 }, "-=0.15");
  DECK.markStep(tl);

  // beat 3: two framings — iso-quality is the hero; ghost dense tower runs 5× hotter
  tl.fromTo("#cardflop", { opacity: 0, y: 16 }, { opacity: 0.85, y: 0, duration: 0.4, ease: "power2.out" })
    .fromTo("#cardqual", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, "-=0.2")
    .to("#ghost", { scaleY: 1, opacity: 1, duration: 0.55, ease: "power2.out" })
    .fromTo("#ghostlab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, "-=0.2")
    .fromTo("#distlab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, "<")
    .fromTo("#ghostmeter", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)" })
    .to("#ghostmeter", { boxShadow: "0 0 18px rgba(224,75,56,0.55)", duration: 0.4, yoyo: true, repeat: 3 })
    .fromTo("#neverline", { opacity: 0 }, { opacity: 1, duration: 0.35 }, "-=0.5");
  DECK.markStep(tl);

  // beat 4: why everyone does it — and the bill that never went away
  tl.fromTo("#btm1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" })
    .to(".bld.chosen .win", { backgroundColor: "rgba(47,214,176,0.95)", duration: 0.35 }, "<")
    .fromTo("#btm2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, "+=0.3")
    .to(".bld:not(.chosen) .win", { backgroundColor: "rgba(201,133,0,0.4)", duration: 0.5, stagger: { each: 0.003, from: "random" } }, "<")
    .to(".bld:not(.chosen)", { opacity: 0.8, borderColor: "rgba(201,133,0,0.5)", duration: 0.5 }, "<");

  DECK.register(tl, {
    reset: function () {
      blds.forEach(function (b) { b.classList.remove("on"); });
    }
  });
</script>
</body>
</html>
