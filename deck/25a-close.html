<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read the Price Tag Again</title>
<link rel="stylesheet" href="shared/deck.css?v=6">
<style>
  /* ---- the slide-01 ledger, returned verbatim ---- */
  .ledger {
    position: absolute; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px;
  }
  .ledger h3 { margin: 0 0 10px; font-size: 15px; }
  .ledger h3 .note { font-size: 11px; color: var(--ink-2); font-weight: 400; margin-left: 8px; }
  .lrow { display: flex; gap: 3px; margin-bottom: 3px; opacity: 0; position: relative; }
  .lcell {
    height: 34px; display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, monospace; font-size: 12.5px;
    background: #232836; border-radius: 6px; color: #c7cce0; position: relative;
  }
  .lcell.lab { justify-content: flex-start; padding-left: 10px; font-family: inherit; font-size: 12px; color: var(--ink-2); background: transparent; }
  .lcell.hd { font-weight: 700; font-family: inherit; font-size: 12.5px; color: #fff; }
  .lcell.win { color: #fff; font-weight: 700; }
  #rate .lcell.lab { width: 158px; } #rate .lcell:not(.lab) { width: 118px; }
  #perf .lcell.lab { width: 208px; } #perf .lcell:not(.lab) { width: 86px; }
  .lrow .tag { position: absolute; right: 0; top: 9px; font-size: 9px; padding: 1px 6px; border-radius: 999px; }
  .tag.independent { background: rgba(47,214,176,0.12); color: var(--accent); }
  .tag.vendor-run { background: rgba(201,133,0,0.14); color: #e0a935; }
  .tag.arena { background: rgba(144,133,233,0.14); color: var(--c-o); }
  #k3glow {
    position: absolute; left: 218px; top: 146px; width: 126px; height: 225px;
    border: 2px solid var(--accent); border-radius: 9px;
    pointer-events: none; opacity: 0; box-shadow: 0 0 18px rgba(47,214,176,0.25);
  }
  .stamp {
    position: absolute; font-weight: 800; font-size: 15px; letter-spacing: 0.04em;
    border: 3px solid #e04b38; color: #e04b38; padding: 4px 10px; border-radius: 5px;
    transform: rotate(-9deg); opacity: 0; z-index: 6;
    background: rgba(11,13,18,0.55); font-family: ui-monospace, monospace;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  /* ---- price rows that flip over to their mechanism ---- */
  .fliprow { height: 34px; perspective: 700px; }
  .finner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .fface {
    position: absolute; inset: 0; display: flex; gap: 3px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .fface.back { transform: rotateX(180deg); }
  .rback {
    flex: 1; display: flex; align-items: center; gap: 12px; padding: 0 12px;
    background: #20242f; border: 1px solid var(--line); border-left: 3px solid; border-radius: 6px;
  }
  .rback .rp { font: 700 13px ui-monospace, monospace; color: #fff; flex: none; }
  .rback .rm { font-size: 10.5px; color: var(--ink-2); line-height: 1.3; }

  /* ---- question chips that flip over to their answers ---- */
  #qs3 {
    position: absolute; left: 44px; top: 502px; width: 1192px;
    display: flex; flex-direction: row; gap: 16px;
  }
  .qchip { flex: 1; position: relative; height: 118px; perspective: 800px; opacity: 0; }
  .qcinner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .qcface {
    position: absolute; inset: 0;
    background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--accent);
    border-radius: 10px; padding: 12px 16px; font-size: 13px; line-height: 1.45;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .qcface .qn { color: var(--accent); font-weight: 700; margin-right: 7px; font-family: ui-monospace, monospace; display: block; margin-bottom: 5px; }
  .qcface.back { transform: rotateY(180deg); background: #1c2733; font-size: 12.5px; color: #dbe4f2; }
  .qbadge {
    position: absolute; width: 17px; height: 17px; border-radius: 50%;
    background: var(--accent); color: #0c1116; font-weight: 800; font-size: 11px;
    display: flex; align-items: center; justify-content: center; opacity: 0; z-index: 6;
  }
  .qbadge .chk { opacity: 0; }

  #pattern {
    position: absolute; left: 0; top: 652px; width: 100%; text-align: center;
    font-size: 15px; color: var(--accent); font-weight: 600; opacity: 0;
  }

  /* ---- the finale panel (replaces the performance ledger) ---- */
  #finale {
    position: absolute; right: 44px; top: 112px; width: 560px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px 16px; opacity: 0;
  }
  #finale h3 { margin: 0 0 10px; font-size: 15px; }
  #finale h3 .note { font-size: 11px; color: var(--ink-2); font-weight: 400; margin-left: 8px; }
  .orow {
    display: flex; align-items: center; gap: 12px; padding: 9px 10px;
    background: #232836; border-radius: 6px; margin-bottom: 6px;
    font-size: 12.5px; color: #c7cce0; opacity: 0;
  }
  .orow .on { font: 700 12px ui-monospace, monospace; color: var(--c-o); flex: none; }
  #fbottom { display: flex; align-items: flex-end; gap: 16px; margin-top: 16px; }
  #fleft { flex: 1; }
  #thanks { font-size: 21px; font-weight: 700; color: var(--accent); opacity: 0; }
  #replay {
    display: inline-flex; align-items: center; margin-top: 12px;
    font: 600 12px ui-monospace, monospace; color: var(--accent);
    border: 1px solid rgba(47,214,176,0.5); border-radius: 999px; padding: 6px 13px;
    background: rgba(47,214,176,0.08); text-decoration: none; opacity: 0; cursor: pointer;
  }
  #replay:hover { background: rgba(47,214,176,0.18); box-shadow: 0 0 12px rgba(47,214,176,0.3); }
  #qr {
    display: grid; grid-template-columns: repeat(17, 5px); grid-auto-rows: 5px; gap: 1px;
    padding: 7px; background: #10131a; border: 1px solid var(--line); border-radius: 8px;
    flex: none;
  }
  #qr i { border-radius: 1px; background: #1d2230; }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">Read the Price Tag Again</div>
  <div class="slide-sub">the table from the opening — read one more time</div>

  <div class="ledger" id="rate" style="left:44px; top:112px; width:560px">
    <h3>Rate card <span class="note">official, per 1M tokens</span></h3>
    <div id="raterows"></div>
  </div>
  <div id="k3glow"></div>
  <div class="stamp" id="st1" style="left:196px; top:220px">−40% vs Sol</div>
  <div class="stamp" id="st2" style="left:182px; top:303px">−70% vs Fable</div>

  <div class="ledger" id="perf" style="right:44px; top:112px; width:560px; opacity:0">
    <h3>Performance <span class="note">July 2026</span></h3>
    <div id="perfrows"></div>
  </div>

  <div id="finale">
    <h3>Open questions <span class="note">for the discussion</span></h3>
    <div id="openrows"></div>
    <div id="fbottom">
      <div id="fleft">
        <div id="thanks"></div>
        <a id="replay" data-no-advance></a>
      </div>
      <div id="qr" title=""></div>
    </div>
  </div>

  <div id="qs3"></div>
  <div id="pattern"></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/pricing.js?v=6"></script>
<script src="shared/bottlenecks.js?v=6"></script>
<script src="shared/closing.js?v=6"></script>
<script src="shared/manifest.js?v=6"></script>
<script src="shared/deck.js?v=6"></script>
<script>
  var M = PRICING.models, $ = PRICING.fmt$;

  function cells(list, opts) {
    opts = opts || {};
    return list.map(function (c, i) {
      var cls = "lcell" + (i === 0 ? " lab" : "") + (opts.hd ? " hd" : "") + (opts.win === i - 1 ? " win" : "");
      var st = (opts.hd && i > 0) ? ' style="color:' + M[i - 1].color + '"' : "";
      return '<div class="' + cls + '"' + st + ">" + c + "</div>";
    }).join("");
  }
  function staticRow(list, opts) {
    var d = document.createElement("div");
    d.className = "lrow";
    d.innerHTML = cells(list, opts);
    if (opts && opts.tag) d.innerHTML += '<span class="tag ' + opts.tag + '">' + opts.tag.slice(0, 6) + "</span>";
    return d;
  }
  // a rate-card row with a hidden back face: [price | mechanism]
  function flipRow(id, label, vals, receipt, color) {
    var d = document.createElement("div");
    d.className = "lrow fliprow";
    d.innerHTML = '<div class="finner" id="' + id + '">' +
      '<div class="fface front">' + cells([label].concat(vals), { win: 0 }) + "</div>" +
      '<div class="fface back"><div class="rback" style="border-left-color:' + color + '">' +
      '<span class="rp" style="color:' + color + '">' + receipt[1] + '</span>' +
      '<span class="rm">' + receipt[2] + "</span></div></div></div>";
    return d;
  }

  var rr = document.getElementById("raterows");
  rr.appendChild(staticRow(["", M[0].name, M[1].name, M[2].name], { hd: true }));
  rr.appendChild(flipRow("fi-input", "input", M.map(function (m) { return $(m.input); }), CL.receipt[0], "#3987e5"));
  rr.appendChild(flipRow("fi-cached", "cached input", M.map(function (m) { return $(m.cached); }), CL.receipt[1], "#9085e9"));
  rr.appendChild(flipRow("fi-output", "output (incl. reasoning)", M.map(function (m) { return $(m.output); }), CL.receipt[2], "#2fd6b0"));
  rr.appendChild(staticRow(["context window"].concat(M.map(function (m) { return m.ctx; }))));
  rr.appendChild(staticRow(["open weights"].concat(M.map(function (m) { return m.open; })), { win: 0 }));

  var pr = document.getElementById("perfrows");
  pr.appendChild(staticRow(["", "K3", "Sol", "Fable 5"], { hd: true }));
  PRICING.bench.forEach(function (b) {
    var vals = b.max ? b.vals.map(function (v) { return v.toFixed(1); }) : b.vals;
    pr.appendChild(staticRow([b.label].concat(vals), { win: b.best, tag: b.src }));
  });

  // question chips: front = the opening question, back = its answer
  var qs3 = document.getElementById("qs3");
  PRICING.questions.forEach(function (q, i) {
    var a = CL.answers[i];
    qs3.innerHTML += '<div class="qchip"><div class="qcinner" id="qf-' + i + '">' +
      '<div class="qcface front"><span class="qn">Q' + (i + 1) + "</span>" + q + "</div>" +
      '<div class="qcface back"><span class="qn">' + a[0] + " ✓</span>" + a[2] + "</div>" +
      "</div></div>";
  });

  function badge(id, x, y) {
    var b = document.createElement("div");
    b.className = "qbadge"; b.id = id;
    b.style.left = x + "px"; b.style.top = y + "px";
    b.innerHTML = '<span class="chk">✓</span>';
    document.querySelector(".stage").appendChild(b);
  }
  badge("qb1", 585, 275);
  badge("qb2", 585, 238);
  badge("qb3", 330, 148);

  document.getElementById("pattern").textContent = CL.pattern;

  // finale panel content
  var orows = document.getElementById("openrows");
  CL.open.forEach(function (q, i) {
    var d = document.createElement("div");
    d.className = "orow";
    d.innerHTML = '<span class="on">' + (i + 1) + "</span><span>" + q + "</span>";
    orows.appendChild(d);
  });
  document.getElementById("thanks").textContent = CL.thanks;
  var rp = document.getElementById("replay");
  rp.href = CL.replay.href;
  rp.textContent = CL.replay.label;

  // the completed map, miniaturised as a QR-like mosaic (decorative)
  (function () {
    var qr = document.getElementById("qr");
    var src = JSON.stringify(CL.map) + CL.pattern;
    var cols = [];
    BN.list.forEach(function (b) { cols.push(b.color); });
    for (var r = 0; r < 17; r++) {
      for (var c = 0; c < 17; c++) {
        var cell = document.createElement("i");
        var corner = (r < 3 && c < 3) || (r < 3 && c > 13) || (r > 13 && c < 3);
        var v = src.charCodeAt((r * 17 + c) * 7 % src.length) + r * 31 + c * 17;
        if (corner) cell.style.background = "#c7cce0";
        else if (v % 5 < 3) cell.style.background = cols[v % 4];
        qr.appendChild(cell);
      }
    }
  })();

  var tl = gsap.timeline({ paused: true });

  // beat 1: deja vu — the whole opening slide reassembles in one breath
  tl.fromTo("#rate", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" })
    .fromTo("#rate .lrow", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.28, stagger: 0.06 }, "-=0.2")
    .fromTo("#k3glow", { opacity: 0 }, { opacity: 1, duration: 0.35 })
    .fromTo("#perf", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, "-=0.3")
    .fromTo("#perf .lrow", { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.25, stagger: 0.05 }, "-=0.2")
    .fromTo("#st1", { opacity: 0, scale: 2.2, rotate: -9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.in" })
    .fromTo("#st2", { opacity: 0, scale: 2.2, rotate: -9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.in" }, "+=0.1")
    .fromTo(".qchip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.09, ease: "power2.out" })
    .fromTo(".qbadge", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.07, ease: "back.out(2.5)" }, "-=0.3");
  DECK.markStep(tl);

  // beat 2: Q1 — output and input flip to their mechanisms; Q1 flips to A1
  tl.to(".stamp", { opacity: 0.15, duration: 0.35 })
    .to("#fi-output", { rotationX: 180, duration: 0.6, ease: "power2.inOut" }, "-=0.2")
    .to("#fi-input", { rotationX: 180, duration: 0.6, ease: "power2.inOut" }, "-=0.4")
    .to("#qf-0", { rotationY: 180, duration: 0.65, ease: "power2.inOut" }, "-=0.35")
    .fromTo("#qb1 .chk", { opacity: 0 }, { opacity: 1, duration: 0.2 })
    .to("#qb1", { scale: 1.4, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, "<");
  DECK.markStep(tl);

  // beat 3: Q2 — the cached row flips; Q2 flips to A2
  tl.to("#fi-cached", { rotationX: 180, duration: 0.6, ease: "power2.inOut" })
    .to("#qf-1", { rotationY: 180, duration: 0.65, ease: "power2.inOut" }, "-=0.4")
    .fromTo("#qb2 .chk", { opacity: 0 }, { opacity: 1, duration: 0.2 })
    .to("#qb2", { scale: 1.4, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, "<");
  DECK.markStep(tl);

  // beat 4: Q3 — the whole K3 column answers; the pattern lands
  tl.to("#k3glow", { scale: 1.05, duration: 0.22, yoyo: true, repeat: 3, ease: "power1.inOut" })
    .to("#qf-2", { rotationY: 180, duration: 0.65, ease: "power2.inOut" }, "-=0.5")
    .fromTo("#qb3 .chk", { opacity: 0 }, { opacity: 1, duration: 0.2 })
    .to("#qb3", { scale: 1.4, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, "<")
    .fromTo("#pattern", { opacity: 0 }, { opacity: 1, duration: 0.6 });
  DECK.markStep(tl);

  // beat 5: the finale — open questions, thanks, and the replay chip
  tl.to("#perf", { rotationY: -88, opacity: 0, transformOrigin: "left center", duration: 0.55, ease: "power2.in" })
    .fromTo("#finale", { opacity: 0, rotationY: 50, transformOrigin: "left center" }, { opacity: 1, rotationY: 0, duration: 0.55, ease: "power3.out" }, "-=0.1")
    .fromTo("#finale .orow", { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.11, ease: "power2.out" })
    .fromTo("#thanks", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" })
    .fromTo("#replay", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35 }, "-=0.15")
    .fromTo("#qr i", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: { each: 0.0035, from: "random" } }, "-=0.3");

  DECK.register(tl, {});
</script>
</body>
</html>
