<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoE's Hidden Bill: Capacity + Communication</title>
<link rel="stylesheet" href="shared/deck.css?v=3">
<link rel="stylesheet" href="shared/bottlenecks.css?v=3">
<style>
  .kicker { position: absolute; top: 12px; left: 45px; font: 700 11px ui-monospace, monospace; letter-spacing: 0.22em; color: #6b7284; }

  .htok {
    position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #c8fff2, #2fd6b0 60%, #14b894);
    box-shadow: 0 0 12px rgba(47,214,176,0.95), 0 0 30px rgba(47,214,176,0.5);
    z-index: 30; pointer-events: none; opacity: 0;
  }
  .htok::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid rgba(47,214,176,0.35); }

  /* ---- the four buckets return (slide-02 visual language) ---- */
  .bcard {
    position: absolute; top: 112px; width: 288px; height: 92px;
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; opacity: 0;
  }
  .bcard .bicon { position: absolute; left: 8px; top: 14px; transform: scale(0.92); transform-origin: top left; }
  .bcard .bname { position: absolute; left: 102px; top: 22px; font: 700 13.5px; }
  .bcard .bunit { position: absolute; left: 102px; top: 44px; font: 600 10.5px ui-monospace, monospace; color: #6b7284; }
  .bcard.paid { filter: grayscale(0.85); opacity: 0.45 !important; }
  .bcard .relax {
    position: absolute; left: 102px; top: 64px; font: 700 9.5px ui-monospace, monospace; color: #9aa1b5; opacity: 0;
  }
  #moechip {
    position: absolute; left: 44px; top: 218px; font: 700 11px ui-monospace, monospace; color: var(--accent);
    border: 1.5px solid rgba(47,214,176,0.6); border-radius: 999px; padding: 3px 10px; background: rgba(11,13,18,0.92); opacity: 0;
  }

  /* ---- the warehouse ---- */
  #wh {
    position: absolute; left: 44px; top: 252px; width: 840px; height: 316px;
    border: 1.5px solid #2a2e3b; border-radius: 12px; overflow: hidden; opacity: 0;
    background:
      repeating-linear-gradient(90deg, rgba(201,133,0,0.07) 0 8px, transparent 8px 14px),
      repeating-linear-gradient(0deg, rgba(201,133,0,0.055) 0 5px, transparent 5px 10px),
      #0d0f15;
  }
  #wh .whlab { position: absolute; left: 12px; top: 8px; font: 700 11px ui-monospace, monospace; color: #e0a935; }
  #wh .whidle { position: absolute; right: 12px; top: 8px; font: 600 10.5px ui-monospace, monospace; color: #6b7284; }
  #halo {
    position: absolute; left: 464px; top: 414px; width: 84px; height: 84px; margin: -42px 0 0 -42px;
    border-radius: 50%; background: radial-gradient(circle, rgba(47,214,176,0.30), rgba(47,214,176,0.10) 55%, transparent 72%);
    z-index: 6; opacity: 0; pointer-events: none;
  }
  #halolab { position: absolute; left: 430px; top: 470px; font: 600 10px ui-monospace, monospace; color: var(--accent); opacity: 0; z-index: 7; }

  .gap { position: absolute; top: 254px; width: 0; height: 312px; border-left: 2px dashed rgba(144,133,233,0.4); opacity: 0; z-index: 5; }
  .gpulab { position: absolute; top: 546px; width: 103px; text-align: center; font: 600 9px ui-monospace, monospace; color: #6b7284; opacity: 0; z-index: 7; }
  #arcs { position: absolute; left: 44px; top: 252px; width: 840px; height: 316px; z-index: 8; pointer-events: none; }
  #arcs path { fill: none; stroke: rgba(144,133,233,0.28); stroke-width: 1.5; opacity: 0; }
  .pdot {
    position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
    background: #9085e9; box-shadow: 0 0 10px rgba(144,133,233,0.95); z-index: 9; opacity: 0; pointer-events: none;
  }
  #shout {
    position: absolute; left: 464px; top: 414px; width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border: 2px solid rgba(144,133,233,0.8); border-radius: 50%; z-index: 8; opacity: 0; pointer-events: none;
  }

  /* ---- right column ---- */
  .rblock { position: absolute; left: 908px; width: 328px; opacity: 0; }
  .rblock .rh { font: 700 12.5px ui-monospace, monospace; }
  .rblock .rw { margin-top: 5px; font-size: 11px; color: #c7cce0; line-height: 1.5; }
  #rb-cap { top: 262px; } #rb-cap .rh { color: #e0a935; }
  #rb-cap .rmath {
    margin-top: 8px; font: 700 11.5px ui-monospace, monospace; color: #e0a935; line-height: 1.65;
    border: 1.5px solid rgba(201,133,0,0.5); border-radius: 8px; padding: 7px 10px; background: rgba(27,30,39,0.7);
  }
  #rb-comm { top: 432px; } #rb-comm .rh { color: #9085e9; }

  /* ---- bottom strip ---- */
  #frame { position: absolute; left: 44px; top: 606px; width: 1192px; font: 700 15px ui-monospace, monospace; color: #e8eaf0; opacity: 0; }
  #frame .fcompute { color: #3987e5; } #frame .fcap { color: #e0a935; } #frame .fcomm { color: #9085e9; }
  #resp { position: absolute; left: 44px; top: 642px; width: 1192px; font: 600 12px ui-monospace, monospace; color: #9aa1b5; opacity: 0; }
  #resp .rchip {
    display: inline-block; margin-left: 8px; padding: 2px 9px; border-radius: 999px;
    border: 1.5px solid rgba(47,214,176,0.6); color: var(--accent); font-weight: 700;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="kicker">MIXTURE OF EXPERTS · THE BILL</div>
  <div class="slide-title">The hidden bill</div>
  <div class="slide-sub">the token stands in a warehouse of parameters it will never touch</div>

  <div id="buckets"></div>
  <div id="moechip">the model turns MoE — compute relaxes</div>

  <div id="wh">
    <span class="whlab"></span>
    <span class="whidle"></span>
  </div>
  <div id="halo"></div>
  <div id="halolab">what this token reads: ~2%</div>
  <svg id="arcs"></svg>
  <div id="shout"></div>

  <div class="rblock" id="rb-cap">
    <div class="rh">capacity</div>
    <div class="rw"></div>
    <div class="rmath"></div>
  </div>
  <div class="rblock" id="rb-comm">
    <div class="rh">interconnect</div>
    <div class="rw"></div>
  </div>

  <div id="frame"></div>
  <div id="resp"></div>
  <div class="htok" id="tok"></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/moe.js?v=3"></script>
<script src="shared/bottlenecks.js?v=3"></script>
<script src="shared/manifest.js?v=3"></script>
<script src="shared/deck.js?v=3"></script>
<script>
  // ---- four bucket cards from BN.list (visual continuity with slide 02) ----
  var bwrap = document.getElementById("buckets");
  var cards = {};
  BN.list.forEach(function (b, i) {
    var c = document.createElement("div");
    c.className = "bcard";
    c.id = "bc-" + b.key;
    c.style.left = (44 + i * 300) + "px";
    c.innerHTML = '<div class="bicon">' + BN.iconHTML(b.key) + '</div>' +
      '<div class="bname" style="color:' + b.color + '">' + b.name + "</div>" +
      '<div class="bunit">' + b.unit + "</div>" +
      '<div class="relax">relaxed: bill follows ACTIVE</div>';
    bwrap.appendChild(c);
    cards[b.key] = c;
  });

  document.querySelector("#wh .whlab").textContent = "all 2.8 T resident in HBM";
  document.querySelector("#wh .whidle").textContent = "~98% idle for any given token";
  document.querySelector("#rb-cap .rw").textContent = MOE.bill.cap;
  var mparts = MOE.bill.capMath.split(" → ");
  document.querySelector("#rb-cap .rmath").innerHTML = mparts[0] + "<br>→ " + mparts[1];
  document.querySelector("#rb-comm .rw").textContent = MOE.bill.comm;
  var fparts = MOE.bill.frame.split(": ");
  document.getElementById("frame").innerHTML = fparts[0] + ": " +
    '<span class="fcompute">compute</span> → <span class="fcap">capacity</span> + <span class="fcomm">interconnect</span>';
  document.getElementById("resp").innerHTML = MOE.bill.response
    .replace("Expert Parallelism", 'Expert Parallelism<span class="rchip">EP · next</span>')
    .replace("Prefill–Decode disaggregation", 'Prefill–Decode disaggregation<span class="rchip">PD</span>');

  var tok = document.getElementById("tok");
  var TOKX = 508, TOKY = 414;   // hero token, mid-warehouse (segment 4)
  gsap.set(tok, { left: TOKX, top: TOKY });
  gsap.set(["#halo", "#shout"], { left: TOKX, top: TOKY });
  gsap.set("#halolab", { left: TOKX - 34, top: TOKY + 56 });

  // GPU segment gaps + labels (warehouse x 44..884, 8 segments of 105)
  var stage = document.querySelector(".stage");
  for (var s = 0; s < 8; s++) {
    if (s > 0) {
      var g = document.createElement("div");
      g.className = "gap";
      g.style.left = (44 + s * 105) + "px";
      stage.appendChild(g);
    }
    var l = document.createElement("div");
    l.className = "gpulab";
    l.style.left = (44 + s * 105) + "px";
    l.textContent = "GPU " + s;
    stage.appendChild(l);
  }

  // all-to-all arcs from the token's segment to every other segment (svg local coords)
  var NS = "http://www.w3.org/2000/svg";
  var arcs = document.getElementById("arcs");
  var lx = TOKX - 44, ly = TOKY - 252;   // token in svg space
  var arcPaths = [], arcPts = [];
  for (var t = 0; t < 8; t++) {
    if (t === 4) continue;
    var txc = t * 105 + 52, tyc = 120;
    var mx = (lx + txc) / 2, my = Math.min(ly, tyc) - 70 - Math.abs(t - 4) * 9;
    var p = document.createElementNS(NS, "path");
    p.setAttribute("d", "M " + lx + " " + ly + " Q " + mx + " " + my + " " + txc + " " + tyc);
    arcs.appendChild(p);
    arcPaths.push(p);
    arcPts.push([[TOKX, TOKY], [mx + 44, my + 252], [txc + 44, tyc + 252]]);
  }

  // purple pulses that travel the arcs (quadratic bezier sampling), ambient loop
  var pdots = arcPts.map(function () {
    var d = document.createElement("div");
    d.className = "pdot";
    stage.appendChild(d);
    return d;
  });
  function qbez(a, c, b, t) {
    var u = 1 - t;
    return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]];
  }
  var commLoop = gsap.timeline({ paused: true, repeat: -1 });
  commLoop.fromTo("#shout", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 3.2, duration: 1.1, ease: "power1.out", immediateRender: false }, 0);
  arcPts.forEach(function (pts, i) {
    var pr = { t: 0 };
    commLoop.fromTo(pdots[i], { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.12 * i)
      .to(pr, { t: 1, duration: 0.9, ease: "power1.inOut", onUpdate: function () {
        var q = qbez(pts[0], pts[1], pts[2], pr.t);
        gsap.set(pdots[i], { left: q[0], top: q[1] });
      } }, 0.12 * i)
      .to(pdots[i], { opacity: 0, duration: 0.15 }, 0.12 * i + 0.85);
  });
  commLoop.to({}, { duration: 0.4 });

  function flare(sel, color) {
    return gsap.fromTo(sel, { boxShadow: "0 0 0 rgba(0,0,0,0)" },
      { boxShadow: "0 0 24px " + color, borderColor: color, duration: 0.22, yoyo: true, repeat: 3 });
  }

  // ---- timeline: 4 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the four buckets return — the model turns MoE, compute relaxes
  tl.fromTo(".bcard", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.12, ease: "power2.out" })
    .fromTo("#moechip", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4 }, "+=0.25")
    .call(function () { cards.compute.classList.add("paid"); })
    .to("#bc-compute .relax", { opacity: 1, duration: 0.35 });
  DECK.markStep(tl);

  // beat 2: capacity flares — the warehouse: 2.8T resident, ~98% dark
  tl.fromTo("#wh", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" })
    .fromTo(tok, { opacity: 0 }, { opacity: 1, duration: 0.35 }, "-=0.3")
    .fromTo("#halo", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" })
    .fromTo("#halolab", { opacity: 0 }, { opacity: 1, duration: 0.35 })
    .add(flare("#bc-cap", "rgba(201,133,0,0.75)"))
    .fromTo("#rb-cap", { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, "-=0.4");
  DECK.markStep(tl);

  // beat 3: interconnect flares — the warehouse shards, the token shouts across the gaps
  tl.fromTo(".gap", { opacity: 0 }, { opacity: 1, duration: 0.45, stagger: 0.05 })
    .fromTo(".gpulab", { opacity: 0 }, { opacity: 1, duration: 0.35 }, "-=0.2")
    .fromTo("#arcs path", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.04 })
    .call(function () { commLoop.play(0); })
    .add(flare("#bc-comm", "rgba(144,133,233,0.75)"), "-=0.1")
    .fromTo("#rb-comm", { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, "-=0.4");
  DECK.markStep(tl);

  // beat 4: the reframe + what the systems layer answers
  tl.fromTo("#frame", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" })
    .add(flare("#bc-cap", "rgba(201,133,0,0.75)"), "-=0.2")
    .add(flare("#bc-comm", "rgba(144,133,233,0.75)"), "<")
    .fromTo("#resp", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, "+=0.15");

  DECK.register(tl, {
    reset: function () {
      commLoop.pause(0);
      pdots.forEach(function (d) { gsap.set(d, { opacity: 0 }); });
      gsap.set("#shout", { opacity: 0 });
      cards.compute.classList.remove("paid");
      gsap.set(tok, { left: TOKX, top: TOKY });
      gsap.set([cards.cap, cards.comm], { clearProps: "boxShadow,borderColor" });
    }
  });
</script>
</body>
</html>
