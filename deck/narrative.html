<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Narrative — Speaker Script</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #1b1e27; --line: #2a2e3b;
    --ink: #e8eaf0; --ink-2: #9aa1b5; --dim: #6b7284;
    --accent: #2fd6b0; --blue: #3987e5; --amber: #e0a935;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.65 -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  #wrap { display: flex; max-width: 1240px; margin: 0 auto; gap: 36px; padding: 36px 24px 90px; }

  /* ---- sticky TOC ---- */
  #toc {
    flex: none; width: 250px; position: sticky; top: 24px;
    align-self: flex-start; max-height: calc(100vh - 48px); overflow-y: auto;
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    padding: 14px 8px 14px 16px; font-size: 12px;
  }
  #toc .tt { font-size: 10.5px; letter-spacing: 0.1em; color: var(--dim); margin-bottom: 8px; }
  #toc a { display: block; color: var(--ink-2); text-decoration: none; padding: 3px 6px; border-radius: 6px; line-height: 1.35; }
  #toc a:hover { color: var(--ink); background: rgba(255,255,255,0.05); }
  #toc a.sub { padding-left: 18px; font-size: 11.5px; }

  /* ---- document ---- */
  #doc { flex: 1; min-width: 0; max-width: 820px; }
  #doc h1 { font-size: 26px; letter-spacing: -0.01em; margin: 0 0 6px; }
  #doc .intro { color: var(--ink-2); font-size: 13px; margin-bottom: 26px; }
  #doc h2 {
    font-size: 19px; margin: 44px 0 12px; padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  #doc h3 { font-size: 16px; margin: 30px 0 10px; color: var(--accent); }
  #doc h2 .pglink, #doc h3 .pglink {
    font: 600 11px ui-monospace, monospace; color: var(--accent); text-decoration: none;
    border: 1px solid rgba(47,214,176,0.5); border-radius: 999px; padding: 2px 10px;
    margin-left: 12px; white-space: nowrap; vertical-align: 3px;
  }
  #doc .pglink:hover { background: rgba(47,214,176,0.12); }
  #doc p { margin: 10px 0; color: #c7cce0; }
  #doc p em:only-child, #doc p.note { color: var(--ink-2); }
  #doc em { color: var(--ink-2); font-style: italic; }
  #doc strong { color: var(--ink); }
  #doc code { font: 600 0.92em ui-monospace, monospace; color: var(--amber); }
  #doc ol { margin: 12px 0 12px 0; padding-left: 34px; }
  #doc ol li { margin: 9px 0; color: #dfe3ee; }
  #doc ol li::marker { font: 700 12px ui-monospace, monospace; color: var(--accent); }
  #doc .pagenote {
    border-left: 3px solid var(--line); padding: 2px 0 2px 14px; margin: 12px 0;
    color: var(--ink-2); font-size: 13.5px; font-style: italic;
  }
  #doc .fin { font: 600 11.5px ui-monospace, monospace; color: var(--dim); margin: 14px 0 4px; }
  #err { color: #e04b38; font: 600 13px ui-monospace, monospace; padding: 40px; }
</style>
</head>
<body>
<div id="wrap">
  <nav id="toc"><div class="tt">SPEAKER SCRIPT</div></nav>
  <main id="doc"><h1>Deck narrative</h1>
    <div class="intro">rendered live from <code>deck/narrative.md</code> — open a slide next to it and click along, one numbered beat per click</div>
  </main>
</div>

<script src="shared/manifest.js?v=25"></script>
<script>
(function () {
  var doc = document.getElementById("doc");
  var toc = document.getElementById("toc");
  var pages = window.DECK_PAGES || [];

  function pageFor(numStr) {
    var n = numStr.length === 1 ? "0" + numStr : numStr;
    for (var i = 0; i < pages.length; i++) if (pages[i].indexOf(n) === 0) return pages[i];
    return null;
  }

  function inline(s) {
    s = s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/(^|[\s(—>])\*([^*\n][^*]*?)\*(?=[\s).,;:—<]|$)/g, "$1<em>$2</em>");
    return s;
  }

  function render(md) {
    var lines = md.split("\n");
    var i = 0, html = [], tocHtml = [], sec = 0;

    function heading(level, text) {
      sec++;
      var id = "s" + sec;
      var m = text.match(/(\d{2})/);
      var link = "";
      if (m) {
        var pg = pageFor(m[1]);
        if (pg) link = ' <a class="pglink" href="' + pg + '" target="_blank">open slide ↗</a>';
      }
      html.push("<h" + level + ' id="' + id + '">' + inline(text) + link + "</h" + level + ">");
      tocHtml.push('<a href="#' + id + '"' + (level === 3 ? ' class="sub"' : "") + ">" + text.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</a>");
    }

    while (i < lines.length) {
      var ln = lines[i];

      if (/^# /.test(ln)) { i++; continue; }                       // page already has its own h1
      if (/^---\s*$/.test(ln)) { i++; continue; }
      if (/^## /.test(ln)) { heading(2, ln.slice(3).trim()); i++; continue; }
      if (/^### /.test(ln)) { heading(3, ln.slice(4).trim()); i++; continue; }

      if (/^\d+\.\s/.test(ln)) {                                   // ordered list w/ wrapped lines
        var start = parseInt(ln, 10), items = [];
        while (i < lines.length && /^\d+\.\s/.test(lines[i])) {
          var item = lines[i].replace(/^\d+\.\s+/, ""); i++;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i])) { item += " " + lines[i].trim(); i++; }
          items.push("<li>" + inline(item) + "</li>");
        }
        html.push('<ol start="' + start + '">' + items.join("") + "</ol>");
        continue;
      }

      if (/^\s*$/.test(ln)) { i++; continue; }

      var para = ln.trim();                                        // paragraph w/ wrapped lines
      i++;
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|\d+\.\s|---)/.test(lines[i])) {
        para += " " + lines[i].trim(); i++;
      }
      if (/^\*\(.*\)\*$/.test(para)) {
        html.push('<div class="fin">' + inline(para.slice(1, -1)) + "</div>");
      } else if (/^\*[^*].*\*$/.test(para)) {
        html.push('<div class="pagenote">' + inline(para.slice(1, -1)) + "</div>");
      } else {
        html.push("<p>" + inline(para) + "</p>");
      }
    }

    doc.insertAdjacentHTML("beforeend", html.join("\n"));
    toc.insertAdjacentHTML("beforeend", tocHtml.join(""));
  }

  fetch("narrative.md", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(render)
    .catch(function (e) {
      doc.insertAdjacentHTML("beforeend", '<div id="err">could not load narrative.md (' + e.message + ") — serve over HTTP, not file://</div>");
    });
})();
</script>
</body>
</html>
