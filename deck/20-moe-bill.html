<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoE's Hidden Bill</title>
<link rel="stylesheet" href="shared/deck.css?v=8">
<link rel="stylesheet" href="shared/bottlenecks.css?v=8">
<style>
  /* ---- the machine, zoomed out — the package meets its walls ---- */
  #machine { position: absolute; inset: 0; opacity: 0.13; filter: grayscale(0.9); }
  #pkg {
    position: absolute; left: 44px; top: 122px; width: 600px; height: 330px;
    border: 1.5px solid var(--line); border-radius: 18px; background: rgba(27,30,39,0.45);
  }
  #pkg .pkglab { position: absolute; left: 16px; top: 10px; font-size: 10.5px; color: var(--ink-2); letter-spacing: 0.08em; }

  #hbm {
    position: absolute; left: 74px; top: 158px; width: 200px; height: 264px;
    border: 2px solid rgba(201,133,0,0.7); border-radius: 8px;
  }
  #hbm .hlab { position: absolute; bottom: 4px; width: 100%; text-align: center; font-size: 10px; color: #e0a935; font-weight: 700; }
  #wblock { position: absolute; left: 8px; top: 10px; right: 8px; display: flex; flex-wrap: wrap; gap: 2px; align-content: flex-start; }
  .wcell {
    flex: none; width: 42px; height: 8px; border-radius: 2px;
    background: linear-gradient(rgba(201,133,0,0.45), rgba(201,133,0,0.85));
    animation: wGlow 2.6s ease-in-out infinite;
  }
  .wcell:nth-child(3n) { animation-delay: 0.6s; }
  .wcell:nth-child(4n) { animation-delay: 1.3s; }
  @keyframes wGlow { 50% { opacity: 0.55; } }
  #wblock.idle .wcell { animation: none; opacity: 0.18; }
  #wblock.idle .wcell.keep { opacity: 1; box-shadow: 0 0 7px rgba(224,169,53,0.55); }

  .pipe {
    position: absolute; left: 284px; top: 278px; width: 110px; height: 16px;
    border: 2px solid rgba(47,214,176,0.55); border-radius: 8px; overflow: hidden;
  }
  .pipe i {
    position: absolute; top: 3px; width: 6px; height: 6px; border-radius: 50%;
    background: #2fd6b0; animation: qFlow 1.1s linear infinite;
  }
  .pipe i:nth-child(2) { animation-delay: 0.28s; }
  .pipe i:nth-child(3) { animation-delay: 0.56s; }
  .pipe i:nth-child(4) { animation-delay: 0.84s; }
  @keyframes qFlow { from { left: -8px; } to { left: 118px; } }

  #die {
    position: absolute; left: 404px; top: 210px; width: 190px; height: 158px;
    border: 2.5px solid #3987e5; border-radius: 10px; background: #0d1420;
    animation: bnChipPulse 1.8s ease-in-out infinite;
  }
  #die .dlab { position: absolute; bottom: 5px; width: 100%; text-align: center; font-size: 11px; color: #9ec7f5; font-weight: 600; }
  .tiles {
    position: absolute; inset: 9px 9px 24px; display: grid; gap: 3px;
    grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(5, 1fr);
  }
  .tiles i { background: rgba(57,135,229,0.22); border-radius: 2px; animation: smTwinkle 2.6s ease-in-out infinite; }
  .tiles i:nth-child(3n) { animation-delay: 0.5s; }
  .tiles i:nth-child(4n) { animation-delay: 1.1s; }
  @keyframes smTwinkle { 50% { background: rgba(111,177,255,0.6); } }
  #die.moe { animation: none; border-color: rgba(57,135,229,0.5); }
  #die.moe .tiles i { animation: none; background: rgba(57,135,229,0.05); }
  #die.moe .tiles i.keepon { animation: smTwinkle 1.4s ease-in-out infinite; background: rgba(111,177,255,0.5); }

  #turnchip {
    position: absolute; left: 390px; top: 178px; width: 220px; text-align: center;
    font: 700 10.5px ui-monospace, monospace; color: #6fb1ff;
    border: 1.5px solid rgba(111,177,255,0.6); border-radius: 999px; padding: 3px 6px;
    background: rgba(11,13,18,0.9); opacity: 0; z-index: 8;
  }

  /* the overflow: weights that do not fit */
  #spill {
    position: absolute; left: 74px; top: 462px; width: 200px; height: 118px;
    border: 1.5px dashed rgba(224,169,53,0.55); border-radius: 8px; opacity: 0;
  }
  #spill .scells { position: absolute; left: 8px; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 2px; }
  #spill .scells i {
    flex: none; width: 42px; height: 8px; border-radius: 2px;
    background: rgba(224,169,53,0.28); border: 1px dashed rgba(224,169,53,0.4);
  }
  #spill .slab { position: absolute; bottom: 6px; width: 100%; text-align: center; font: 700 10px ui-monospace, monospace; color: #e0a935; }

  #capmath { position: absolute; left: 292px; top: 468px; width: 340px; font: 700 12px ui-monospace, monospace; color: #e0a935; line-height: 1.55; opacity: 0; }
  #idlelab { position: absolute; left: 292px; top: 532px; width: 340px; font-size: 10.5px; color: #9aa1b5; line-height: 1.45; opacity: 0; }

  /* ghost packages — the model spreads to more GPUs */
  .gpkg {
    position: absolute; border: 1.5px solid var(--line); border-radius: 12px;
    background: rgba(27,30,39,0.45); opacity: 0;
  }
  #g0 { left: 672px; top: 150px; width: 130px; height: 96px; }
  #g1 { left: 826px; top: 208px; width: 130px; height: 96px; }
  #g2 { left: 700px; top: 300px; width: 130px; height: 96px; }
  .gpkg .gl { position: absolute; left: 8px; top: 5px; font-size: 8.5px; color: var(--ink-2); letter-spacing: 0.06em; }
  .gpkg .gh { position: absolute; left: 10px; top: 22px; width: 34px; bottom: 10px; border: 1.5px solid rgba(201,133,0,0.6); border-radius: 4px; background: rgba(201,133,0,0.15); }
  .gpkg .gd { position: absolute; right: 12px; top: 30px; width: 44px; height: 44px; border: 2px solid #3987e5; border-radius: 6px; background: #0d1420; }

  #comm { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  #comm line { stroke: rgba(144,133,233,0.55); stroke-width: 1.8; stroke-dasharray: 6 5; }
  #comm.live line { animation: commPulse 1.4s ease-in-out infinite; }
  #comm.live line:nth-of-type(2) { animation-delay: 0.45s; }
  #comm.live line:nth-of-type(3) { animation-delay: 0.9s; }
  @keyframes commPulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  #commlab { position: absolute; left: 664px; top: 420px; width: 280px; font-size: 11.5px; font-weight: 600; color: #9085e9; line-height: 1.5; opacity: 0; }

  .zflash { position: absolute; opacity: 0; pointer-events: none; z-index: 20; border-radius: 12px; }
  #fl-cap { left: 66px; top: 150px; width: 216px; height: 438px; border: 3px solid #c98500; box-shadow: 0 0 26px rgba(201,133,0,0.8); }
  #fl-comm { left: 660px; top: 140px; width: 310px; height: 268px; border: 3px solid #9085e9; box-shadow: 0 0 26px rgba(144,133,233,0.8); }

  /* ---- the four buckets return (slide-02 language) ---- */
  .bcard {
    position: absolute; left: 1000px; width: 236px; height: 122px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 8px 4px; text-align: center; opacity: 0;
  }
  #bc-compute { top: 108px; } #bc-bw { top: 242px; } #bc-cap { top: 376px; } #bc-comm { top: 510px; }
  .bcard .bn { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .bcard .bd { font-size: 9px; color: #6b7284; margin-top: 1px; }
  .bcard .paidtag { display: none; font: 700 9px ui-monospace, monospace; color: var(--accent); margin-top: 1px; }
  .bcard.paid { filter: grayscale(0.85); opacity: 0.55 !important; }
  .bcard.paid .paidtag { display: block; }
  .bcard.paid .bd { display: none; }
  #bc-cap.flare { border-color: #c98500; box-shadow: 0 0 18px rgba(201,133,0,0.5); }
  #bc-comm.flare { border-color: #9085e9; box-shadow: 0 0 18px rgba(144,133,233,0.5); }

  #arr { position: absolute; inset: 0; pointer-events: none; }
  #arr path { fill: none; stroke-width: 2.2; stroke-dasharray: 1; stroke-dashoffset: 1; }
  #arr-cap { stroke: #c98500; }
  #arr-comm { stroke: #9085e9; }
  #arr polygon { opacity: 0; }

  /* ---- the reframe ---- */
  #framelab { position: absolute; left: 44px; top: 630px; width: 930px; font-size: 16px; font-weight: 800; color: #e8eaf0; opacity: 0; }
  #resplab { position: absolute; left: 44px; top: 668px; width: 930px; font-size: 12px; color: var(--ink-2); opacity: 0; }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">MoE's Hidden Bill</div>
  <div class="slide-sub">the compute bucket relaxes — capacity and interconnect pick up the tab</div>

  <div id="machine">
    <div id="pkg"><span class="pkglab">GPU PACKAGE</span></div>
    <div id="hbm">
      <div id="wblock"></div>
      <div class="hlab">HBM · all experts</div>
    </div>
    <div class="pipe"><i></i><i></i><i></i><i></i></div>
    <div id="die"><div class="dlab">Processor</div></div>
  </div>
  <div id="turnchip">the model turns MoE — active experts only</div>

  <div id="spill">
    <div class="scells"></div>
    <div class="slab">does not fit</div>
  </div>
  <div id="capmath"></div>
  <div id="idlelab"></div>

  <div class="gpkg" id="g0"><span class="gl">GPU 1</span><div class="gh"></div><div class="gd"></div></div>
  <div class="gpkg" id="g1"><span class="gl">GPU 2</span><div class="gh"></div><div class="gd"></div></div>
  <div class="gpkg" id="g2"><span class="gl">GPU 7</span><div class="gh"></div><div class="gd"></div></div>
  <svg id="comm" width="1280" height="720">
    <line x1="600" y1="270" x2="700" y2="198"/>
    <line x1="600" y1="285" x2="852" y2="256"/>
    <line x1="600" y1="300" x2="726" y2="348"/>
  </svg>
  <div id="commlab"></div>

  <div class="zflash" id="fl-cap"></div>
  <div class="zflash" id="fl-comm"></div>

  <svg id="arr" width="1280" height="720">
    <path id="arr-cap" pathLength="1" d="M 1000 172 C 952 250, 952 360, 998 434"/>
    <path id="arr-comm" pathLength="1" d="M 1000 180 C 936 280, 936 470, 998 568"/>
    <polygon id="ah-cap" points="998,434 986,428 990,441" fill="#c98500"/>
    <polygon id="ah-comm" points="998,568 986,562 990,575" fill="#9085e9"/>
  </svg>

  <div id="framelab"></div>
  <div id="resplab"></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/moe.js?v=8"></script>
<script src="shared/bottlenecks.js?v=8"></script>
<script src="shared/manifest.js?v=8"></script>
<script src="shared/deck.js?v=8"></script>
<script>
  // ---- static content ----
  document.getElementById("capmath").textContent = MOE.bill.capMath;
  document.getElementById("idlelab").textContent = MOE.bill.cap;
  document.getElementById("commlab").textContent = MOE.bill.comm;
  document.getElementById("framelab").textContent = MOE.bill.frame;
  document.getElementById("resplab").textContent = MOE.bill.response;

  // the four buckets return — BN.list + BN.iconHTML, slide-02 continuity
  var stage = document.querySelector(".stage");
  BN.list.forEach(function (b) {
    var d = document.createElement("div");
    d.className = "bcard"; d.id = "bc-" + b.key;
    d.innerHTML = BN.iconHTML(b.key) +
      '<div class="bn" style="color:' + b.color + '">' + b.name + "</div>" +
      '<div class="bd">' + b.dom + "</div>" +
      '<div class="paidtag">relaxed — FLOPs follow active</div>';
    stage.appendChild(d);
  });

  // machine furniture
  var wblock = document.getElementById("wblock");
  var KEEP = [7, 30, 51, 66];
  for (var i = 0; i < 76; i++) {
    var c = document.createElement("i");
    c.className = "wcell" + (KEEP.indexOf(i) >= 0 ? " keep" : "");
    wblock.appendChild(c);
  }
  var die = document.getElementById("die");
  var tiles = document.createElement("div"); tiles.className = "tiles";
  var KEEPON = [4, 13, 21, 27];
  for (i = 0; i < 30; i++) {
    var t = document.createElement("i");
    if (KEEPON.indexOf(i) >= 0) t.className = "keepon";
    tiles.appendChild(t);
  }
  die.appendChild(tiles);
  var scells = document.querySelector("#spill .scells");
  for (i = 0; i < 24; i++) scells.appendChild(document.createElement("i"));

  // ---- DOM mutators ----
  function dieMoe(on) { die.classList.toggle("moe", on); }
  function computePaid(on) { document.getElementById("bc-compute").classList.toggle("paid", on); }
  function hbmIdle(on) { wblock.classList.toggle("idle", on); }
  function flare(key, on) { document.getElementById("bc-" + key).classList.toggle("flare", on); }
  function commLive(on) { document.getElementById("comm").classList.toggle("live", on); }

  // ---- timeline: 4 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the buckets return; the model turns MoE — compute relaxes
  tl.fromTo(".bcard", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.09, ease: "power2.out" })
    .to("#machine", { opacity: 1, filter: "grayscale(0)", duration: 0.6, ease: "power2.out" }, "-=0.3")
    .to({}, { duration: 0.25 })
    .call(function () { dieMoe(true); computePaid(true); })
    .fromTo("#turnchip", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" });
  DECK.markStep(tl);

  // beat 2: capacity flares — all of it resident, most of it idle, and it doesn't fit
  tl.call(function () { hbmIdle(true); })
    .fromTo("#idlelab", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 })
    .fromTo("#spill", { opacity: 0, scaleY: 0.2, transformOrigin: "50% 0%" }, { opacity: 1, scaleY: 1, duration: 0.55, ease: "power2.out" })
    .fromTo("#capmath", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 })
    .call(function () { flare("cap", true); })
    .fromTo("#fl-cap", { opacity: 0 }, { opacity: 1, duration: 0.09, yoyo: true, repeat: 3 });
  DECK.markStep(tl);

  // beat 3: interconnect flares — sharded experts, all-to-all every MoE layer
  tl.fromTo(".gpkg", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, stagger: 0.12, ease: "back.out(1.6)" })
    .fromTo("#comm", { opacity: 0 }, { opacity: 1, duration: 0.4 })
    .call(function () { commLive(true); })
    .fromTo("#commlab", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 })
    .call(function () { flare("comm", true); })
    .fromTo("#fl-comm", { opacity: 0 }, { opacity: 1, duration: 0.09, yoyo: true, repeat: 3 });
  DECK.markStep(tl);

  // beat 4: the reframe — and what the systems layer answers
  tl.fromTo("#framelab", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" })
    .fromTo("#arr-cap", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" })
    .fromTo("#arr-comm", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, "<0.15")
    .fromTo("#ah-cap", { opacity: 0 }, { opacity: 1, duration: 0.2 }, "-=0.35")
    .fromTo("#ah-comm", { opacity: 0 }, { opacity: 1, duration: 0.2 }, "-=0.15")
    .fromTo("#resplab", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 });

  DECK.register(tl, {
    reset: function () {
      dieMoe(false); computePaid(false); hbmIdle(false);
      flare("cap", false); flare("comm", false); commLive(false);
    }
  });
</script>
</body>
</html>
