<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read the Price Tag Again</title>
<link rel="stylesheet" href="shared/deck.css?v=6">
<style>
  .doc {
    position: absolute; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 18px; opacity: 0;
  }
  .dochead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .dochead .dtitle {
    font-variant-caps: all-small-caps; letter-spacing: 0.1em;
    font-size: 16px; font-weight: 700; color: #e8eaf0;
  }
  .dochead .dnote { font: 400 10.5px ui-monospace, monospace; color: #5b647c; white-space: nowrap; }
  .docrule { border-top: 1px solid #2a2e3b; margin: 9px 0 10px; }
  .docrule.dbl { border-top: 3px double #2a2e3b; margin: 10px 0 0; }

  /* ---- the invoice line items ---- */
  #invoice { left: 44px; top: 118px; width: 560px; }
  .item { margin-bottom: 9px; opacity: 0; }
  .irow { display: flex; align-items: baseline; }
  .ilab { font-variant-caps: all-small-caps; letter-spacing: 0.07em; font-size: 14.5px; color: #c7cce0; white-space: nowrap; }
  .idots { flex: 1; border-bottom: 1px dotted #3a4052; margin: 0 10px 4px; }
  .iprice { font: 700 19px ui-monospace, monospace; color: #fff; white-space: nowrap; }
  .inote {
    margin: 6px 0 0 6px; padding: 5px 9px; opacity: 0;
    border-left: 2px solid var(--nc); background: rgba(11,13,18,0.35); border-radius: 0 6px 6px 0;
    font-size: 11.5px; color: #9aa1b5; line-height: 1.45;
  }

  /* ---- the three questions, closed out ---- */
  #qledger { left: 660px; top: 118px; width: 576px; }
  .qentry { padding: 9px 2px 8px; border-bottom: 1px dotted #262b38; opacity: 0; }
  .qentry:last-child { border-bottom: none; }
  .qtop { display: flex; align-items: baseline; gap: 9px; }
  .qn { font: 700 12px ui-monospace, monospace; color: var(--accent); flex: none; }
  .qtext { font-size: 13px; color: #e8eaf0; line-height: 1.4; }
  .qstat { margin-left: auto; flex: none; position: relative; width: 70px; height: 18px; }
  .qstat i {
    position: absolute; right: 0; top: 0; font-style: normal; white-space: nowrap;
    font: 700 9px ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase;
    border-radius: 999px; padding: 2px 8px;
  }
  .qstat .so { color: #8a90a3; border: 1px solid #3a4052; }
  .qstat .sc { color: var(--accent); border: 1px solid rgba(47,214,176,0.55); background: rgba(47,214,176,0.07); opacity: 0; }
  .qans {
    margin: 6px 0 0 27px; padding-left: 9px; border-left: 2px solid var(--line);
    font-size: 12px; color: #9aa1b5; line-height: 1.45; opacity: 0;
  }

  /* ---- the auditor's summary line ---- */
  #pattern {
    position: absolute; left: 0; top: 480px; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  #pattern .prule { width: 170px; border-top: 1px solid #3a4052; transform: scaleX(0); }
  #pattern .ptext {
    font-variant-caps: all-small-caps; letter-spacing: 0.09em;
    font-size: 17px; font-weight: 650; color: var(--accent); opacity: 0; white-space: nowrap;
  }

  /* ---- finale ---- */
  #open { position: absolute; left: 44px; top: 528px; width: 630px; opacity: 0; }
  #open .ohead {
    font-variant-caps: all-small-caps; letter-spacing: 0.12em;
    font-size: 12.5px; color: #7c8499; margin-bottom: 7px;
  }
  .oline { font-size: 13px; color: #c7cce0; line-height: 1.75; opacity: 0; }
  .oline .om { color: #5b647c; margin-right: 8px; font-family: ui-monospace, monospace; }

  #thanks {
    position: absolute; left: 700px; top: 552px; width: 390px;
    font-size: 21px; font-weight: 650; opacity: 0;
  }
  #replaychip {
    position: absolute; left: 700px; top: 604px; display: inline-block;
    font: 600 12px ui-monospace, monospace; color: var(--accent); text-decoration: none;
    border: 1px solid rgba(47,214,176,0.5); border-radius: 999px; padding: 7px 14px;
    background: var(--panel); opacity: 0; cursor: pointer;
  }
  #replaychip:hover { background: #22352f; box-shadow: 0 0 12px rgba(47,214,176,0.3); }

  /* the completed map, miniaturised — the document's stamp (decorative) */
  #qr {
    position: absolute; left: 1105px; top: 520px; opacity: 0;
    display: grid; grid-template-columns: repeat(17, 5px); grid-auto-rows: 5px; gap: 1px;
    padding: 9px; background: #0c0e14; border: 2px solid #2a2e3b; border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  #qr i { border-radius: 1px; }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">Read the Price Tag Again</div>
  <div class="slide-sub">the opening rate card, reconciled</div>

  <div class="doc" id="invoice">
    <div class="dochead"><span class="dtitle" id="invtitle"></span><span class="dnote">per 1M tokens</span></div>
    <div class="docrule"></div>
    <div id="items"></div>
    <div class="docrule dbl"></div>
  </div>

  <div class="doc" id="qledger">
    <div class="dochead"><span class="dtitle">the three questions</span><span class="dnote">from slide 01</span></div>
    <div class="docrule"></div>
    <div id="qrows"></div>
  </div>

  <div id="pattern"><span class="prule"></span><span class="ptext"></span><span class="prule"></span></div>

  <div id="open"><div class="ohead">still open — for discussion</div></div>
  <div id="thanks"></div>
  <a id="replaychip" data-no-advance></a>
  <div id="qr" data-no-advance></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/pricing.js?v=6"></script>
<script src="shared/closing.js?v=6"></script>
<script src="shared/manifest.js?v=6"></script>
<script src="shared/deck.js?v=6"></script>
<script>
  document.getElementById("invtitle").textContent = PRICING.models[0].name + " — rate card";

  // invoice line items with flip-over mechanism notes
  var NOTE_C = ["#3987e5", "#9085e9", "#2fd6b0"];   // compute / KV / bandwidth
  var items = document.getElementById("items");
  CL.receipt.forEach(function (r, i) {
    var d = document.createElement("div");
    d.className = "item";
    d.innerHTML = '<div class="irow"><span class="ilab">' + r[0] + '</span><span class="idots"></span>' +
      '<span class="iprice">' + r[1] + "</span></div>" +
      '<div class="inote" style="--nc:' + NOTE_C[i] + '">' + r[2] + "</div>";
    items.appendChild(d);
  });

  // the three questions, to be closed out
  var qrows = document.getElementById("qrows");
  CL.answers.forEach(function (a, i) {
    var d = document.createElement("div");
    d.className = "qentry";
    d.id = "q" + i;
    d.innerHTML = '<div class="qtop"><span class="qn">' + a[0] + '</span><span class="qtext">' + a[1] + "</span>" +
      '<span class="qstat"><i class="so">open</i><i class="sc">closed ✓</i></span></div>' +
      '<div class="qans">' + a[2] + "</div>";
    qrows.appendChild(d);
  });

  document.querySelector("#pattern .ptext").textContent = CL.pattern;

  var open = document.getElementById("open");
  CL.open.forEach(function (o) {
    var d = document.createElement("div");
    d.className = "oline";
    d.innerHTML = '<span class="om">◦</span>' + o;
    open.appendChild(d);
  });

  document.getElementById("thanks").textContent = CL.thanks;
  var chip = document.getElementById("replaychip");
  chip.textContent = CL.replay.label;
  chip.href = CL.replay.href;

  // ---- the stamp: the completed map as a QR-like mosaic (decorative) -----
  (function () {
    var host = document.getElementById("qr");
    var s = JSON.stringify(CL.map), seed = 0;
    for (var i = 0; i < s.length; i++) seed = (seed * 31 + s.charCodeAt(i)) >>> 0;
    function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
    var buckets = ["#3987e5", "#2fd6b0", "#e0a935", "#9085e9"];
    function finder(r, c) {   // 1 = filled, 0 = blank, -1 = not in a finder square
      var corners = [[0, 0], [0, 12], [12, 0]];
      for (var i = 0; i < 3; i++) {
        var dr = r - corners[i][0], dc = c - corners[i][1];
        if (dr >= 0 && dr < 5 && dc >= 0 && dc < 5) {
          if (dr === 0 || dr === 4 || dc === 0 || dc === 4) return 1;
          if (dr === 2 && dc === 2) return 1;
          return 0;
        }
      }
      return -1;
    }
    for (var r = 0; r < 17; r++) {
      for (var c = 0; c < 17; c++) {
        var cell = document.createElement("i");
        var f = finder(r, c);
        if (f === 1) cell.style.background = "#aab2c9";
        else if (f === -1 && rnd() < 0.46)
          cell.style.background = rnd() < 0.3 ? buckets[(seed >>> 4) % 4] : "#8a90a3";
        host.appendChild(cell);
      }
    }
  })();

  // ---- timeline ----------------------------------------------------------
  var tl = gsap.timeline({ paused: true });

  // beat 1 — the invoice returns, the three questions still open
  tl.fromTo("#invoice", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" })
    .fromTo(".item", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.32, stagger: 0.12 }, "-=0.2")
    .fromTo("#qledger", { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, "-=0.3")
    .fromTo(".qentry", { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.1 }, "-=0.25");
  DECK.markStep(tl);

  // beat 2 — each price flips over to its mechanism
  tl.fromTo(".inote", { opacity: 0, rotationX: -90, transformPerspective: 600, transformOrigin: "top center" },
    { opacity: 1, rotationX: 0, duration: 0.5, stagger: 0.25, ease: "power2.out" });
  DECK.markStep(tl);

  // beat 3 — the questions close out, one by one
  for (var i = 0; i < 3; i++) {
    tl.to("#q" + i + " .so", { opacity: 0, scale: 0.8, duration: 0.22 }, i === 0 ? "+=0" : "-=0.05")
      .fromTo("#q" + i + " .sc", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, "-=0.08")
      .fromTo("#q" + i + " .qans", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, "-=0.12")
      .to({}, { duration: 0.25 });
  }
  DECK.markStep(tl);

  // beat 4 — the auditor's summary line; Q3's answer carries the roll-call
  tl.fromTo("#pattern .prule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" })
    .fromTo("#pattern .ptext", { opacity: 0 }, { opacity: 1, duration: 0.5 }, "-=0.25")
    .to("#q2 .qans", { color: "#2fd6b0", borderLeftColor: "#2fd6b0", duration: 0.6 }, "-=0.3");
  DECK.markStep(tl);

  // beat 5 — open items, thanks, the replay chip, and the stamp
  tl.fromTo("#open", { opacity: 0 }, { opacity: 1, duration: 0.35 })
    .fromTo(".oline", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.12, ease: "power2.out" }, "-=0.15")
    .fromTo("#thanks", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, "-=0.2")
    .fromTo("#replaychip", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, "-=0.15")
    .fromTo("#qr", { opacity: 0, scale: 2.2, rotation: -7 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.4, ease: "power3.in" }, "-=0.1");

  DECK.register(tl, {
    reset: function () {
      gsap.set(".qstat .so", { clearProps: "opacity,transform" });
      gsap.set("#q2 .qans", { clearProps: "color,borderLeftColor" });
    }
  });
</script>
</body>
</html>
