<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Map, Completed</title>
<link rel="stylesheet" href="shared/deck.css?v=6">
<link rel="stylesheet" href="shared/bottlenecks.css?v=6">
<style>
  /* ---- the slide-02 board, returned verbatim ---- */
  #gamewrap { position: absolute; inset: 0; pointer-events: none; }
  #pkg {
    position: absolute; left: 60px; top: 150px; width: 600px; height: 410px;
    border: 1.5px solid var(--line); border-radius: 18px; background: rgba(27,30,39,0.45);
  }
  #pkg .pkglab { position: absolute; left: 16px; top: 10px; font-size: 11px; color: var(--ink-2); letter-spacing: 0.08em; }
  .grp { transition: none; pointer-events: auto; }
  .dim { opacity: 0.16; filter: grayscale(0.85); }

  #die {
    position: absolute; left: 300px; top: 250px; width: 170px; height: 200px;
    border: 2.5px solid #3987e5; border-radius: 10px;
    background: #0d1420;
    animation: bnChipPulse 1.8s ease-in-out infinite;
  }
  #die .dlab { position: absolute; bottom: 6px; width: 100%; text-align: center; font-size: 12px; color: #9ec7f5; font-weight: 600; }
  #die.heat { border-color: #e0a935; animation: dieHeat 1.1s ease-in-out infinite; }
  @keyframes dieHeat { 50% { box-shadow: 0 0 30px rgba(224,169,53,0.8); border-color: #ffce6b; } }
  #die.heat .tiles i.idle { background: rgba(224,169,53,0.45) !important; animation: smTwinkle 1.4s ease-in-out infinite !important; }
  .tiles { position: absolute; display: grid; gap: 3px; }
  #die .tiles { inset: 10px 10px 28px; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(7, 1fr); }
  .tiles i {
    background: rgba(57, 135, 229, 0.22); border-radius: 2px;
    animation: smTwinkle 2.6s ease-in-out infinite;
  }
  .tiles i:nth-child(3n) { animation-delay: 0.5s; }
  .tiles i:nth-child(4n) { animation-delay: 1.1s; }
  .tiles i:nth-child(5n) { animation-delay: 1.7s; background: rgba(57, 135, 229, 0.34); }
  @keyframes smTwinkle { 50% { background: rgba(111, 177, 255, 0.6); } }

  .hbm {
    position: absolute; left: 92px; width: 84px; height: 110px;
    border: 2px solid rgba(201,133,0,0.7); border-radius: 8px; overflow: hidden;
  }
  .hbm .layer {
    position: absolute; left: 6px; right: 6px; height: 16px; border-radius: 3px;
    background: linear-gradient(rgba(201,133,0,0.4), rgba(201,133,0,0.8));
    animation: hbmGlow 2.6s ease-in-out infinite;
  }
  @keyframes hbmGlow { 50% { opacity: 0.45; } }
  .hbm .hlab { position: absolute; bottom: 4px; width: 100%; text-align: center; font-size: 10.5px; color: #e0a935; font-weight: 700; }

  .pipe {
    position: absolute; left: 178px; width: 120px; height: 16px;
    border: 2px solid rgba(47,214,176,0.55); border-radius: 8px; overflow: hidden;
  }
  .pipe i {
    position: absolute; top: 3px; width: 6px; height: 6px; border-radius: 50%;
    background: #2fd6b0; animation: bnFlow 1.1s linear infinite;
  }
  .pipe i:nth-child(2) { animation-delay: 0.22s; }
  .pipe i:nth-child(3) { animation-delay: 0.44s; }
  .pipe i:nth-child(4) { animation-delay: 0.66s; }
  .pipe i:nth-child(5) { animation-delay: 0.88s; }
  .pipe.thin i:nth-child(2), .pipe.thin i:nth-child(4) { opacity: 0.08; }
  .pipe.thin i { animation-duration: 1.9s; }

  .peer {
    position: absolute; left: 790px; width: 150px; height: 96px;
    border: 1.5px solid var(--line); border-radius: 12px; background: rgba(27,30,39,0.45);
  }
  .peer .pdie {
    position: absolute; left: 50px; top: 18px; width: 50px; height: 50px;
    border: 2px solid #9085e9; border-radius: 7px;
    background: #12101f;
  }
  .peer .tiles { inset: 5px; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px; }
  .peer .tiles i { background: rgba(144, 133, 233, 0.3); animation: none; }
  .peer .plab { position: absolute; bottom: 5px; width: 100%; text-align: center; font-size: 10px; color: var(--ink-2); }
  #wires { position: absolute; inset: 0; pointer-events: none; }
  #wires line { stroke: #9085e9; stroke-width: 2.5; stroke-dasharray: 9 7; animation: commDash 0.9s linear infinite; }
  #wires.hot line { stroke: #e04b38; animation-duration: 0.32s; }
  @keyframes commDash { to { stroke-dashoffset: -32; } }

  .tag {
    position: absolute; font-size: 11.5px; line-height: 1.45;
    background: rgba(11,13,18,0.88); border: 1.5px solid; border-radius: 9px;
    padding: 7px 11px; opacity: 0; z-index: 8; width: 168px;
  }
  .tag b { font-size: 13px; display: block; }
  .tag .u { font-family: ui-monospace, monospace; font-size: 10.5px; }
  .tag .d { color: var(--ink-2); font-size: 10.5px; }

  /* capacity alert overlays (raised by MoE, cleared by EP) */
  .alrt {
    position: absolute; left: 92px; width: 84px; height: 110px;
    border: 2.5px solid #e0a935; border-radius: 8px;
    background: rgba(201,133,0,0.2); opacity: 0; pointer-events: none; z-index: 12;
  }
  .alrt.on { animation: alrtPulse 0.9s ease-in-out infinite; }
  @keyframes alrtPulse { 50% { box-shadow: 0 0 26px rgba(224,169,53,0.85); background: rgba(201,133,0,0.34); } }

  /* ---- tray: the same nine cards, unlocked ---- */
  #tray {
    position: absolute; left: 60px; top: 610px; width: 880px;
    display: flex; gap: 9px;
    pointer-events: none;   /* enabled once the board has returned */
  }
  #tray .tcard { flex: 1; padding: 7px 8px; cursor: grab; touch-action: none; }
  #tray .tcard.dragging {
    cursor: grabbing; z-index: 40;
    box-shadow: 0 14px 30px rgba(0,0,0,0.55);
    border-color: #4a5066;
  }
  .tcard .prog { position: absolute; bottom: 5px; right: 7px; display: flex; gap: 3px; }
  .tcard .prog i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid #5b647c; }
  .tcard .prog i.done { background: var(--accent); border-color: var(--accent); }
  #tray .abbr { font-size: 10.5px; white-space: nowrap; }
  #tray .full { font-size: 8.5px; padding-right: 13px; }

  /* ---- sim column: the speedometer + its launch-day ghost ---- */
  #simhost { left: 960px; top: 150px; width: 276px; height: 200px; opacity: 0; }
  #ghosthost { left: 960px; top: 368px; width: 276px; height: 96px; opacity: 0; filter: grayscale(0.5); }
  #glab { position: absolute; left: 960px; top: 470px; width: 276px; font-size: 10.5px; color: var(--ink-2); opacity: 0; }
  #score {
    position: absolute; left: 960px; top: 498px; width: 276px;
    font: 600 12px ui-monospace, monospace; color: var(--accent); opacity: 0;
  }
  #factors { position: absolute; left: 44px; top: 688px; width: 760px; font-size: 10px; color: #6b7284; opacity: 0; }

  /* prefill panel (appears when PD splits the screen) */
  #prefill {
    position: absolute; left: 960px; top: 368px; width: 276px; height: 96px;
    background: #0a0f14; border: 1px solid #1d2531; border-radius: 10px;
    padding: 10px 12px; opacity: 0; z-index: 6;
  }
  #prefill .phead {
    font-family: ui-monospace, monospace; font-size: 11px; color: #7fa4d6;
    display: flex; align-items: center; gap: 6px; margin-bottom: 10px;
  }
  #prefill .pbadge {
    margin-left: auto; font-size: 9.5px; color: #6fb1ff;
    border: 1px solid rgba(57,135,229,0.5); border-radius: 999px; padding: 1px 7px;
  }
  #prefill .pbar {
    position: relative; height: 14px; border-radius: 7px; overflow: hidden;
    border: 1px solid rgba(57,135,229,0.4); background: rgba(57,135,229,0.08);
  }
  #prefill .pbar i {
    position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px;
    background: linear-gradient(90deg, rgba(57,135,229,0.35), #3987e5);
    animation: ttft 1.7s ease-in-out infinite;
  }
  @keyframes ttft { 0% { width: 0; opacity: 1; } 72% { width: 100%; opacity: 1; } 100% { width: 100%; opacity: 0; } }
  #prefill .pnote { margin-top: 8px; font-size: 9.5px; color: #5b6b84; }
  #tpotchip {
    position: absolute; left: 1168px; top: 330px; z-index: 7;
    font: 700 9.5px ui-monospace, monospace; color: var(--accent);
    border: 1px solid rgba(47,214,176,0.5); border-radius: 999px; padding: 1px 7px;
    background: rgba(11,13,18,0.9); opacity: 0;
  }

  /* rejected-draft tokens (MTP) */
  .draft {
    position: absolute; width: 26px; height: 12px; border-radius: 4px; z-index: 18;
    border: 1.5px solid rgba(47,214,176,0.7); background: rgba(47,214,176,0.14);
    opacity: 0; pointer-events: none;
  }
  .draft.bad { border-color: #e04b38; background: rgba(224,75,56,0.16); }

  /* ---- the end state: the filled summary table ---- */
  #maptable {
    position: absolute; left: 44px; top: 116px; width: 1192px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 6px 18px 10px; opacity: 0; z-index: 30;
  }
  .mrow {
    display: grid; grid-template-columns: 255px 1fr 205px 245px;
    align-items: center; column-gap: 14px;
    padding: 7px 2px; border-bottom: 1px solid var(--line); opacity: 0;
  }
  .mrow:last-child { border-bottom: none; }
  .mrow.hd { padding: 9px 2px 7px; }
  .mrow.hd span { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: #6b7284; }
  .mrow .tech .a { font: 700 13px ui-monospace, monospace; color: #dbe0f0; }
  .mrow .tech .n { font-size: 9.5px; color: #6b7284; margin-top: 1px; }
  .mrow .bnk { font-size: 12px; color: #c7cce0; display: flex; align-items: center; gap: 7px; }
  .mrow .bnk .dots { display: flex; gap: 4px; flex: none; }
  .mrow .bnk .dots i { width: 8px; height: 8px; border-radius: 50%; }
  .mrow .stg { font-size: 11.5px; color: var(--ink-2); }
  .mrow .k3 { font: 600 12px ui-monospace, monospace; color: var(--accent); }
  .mrow .k3.lin { color: var(--ink-2); font-weight: 400; }
  #tabnote {
    position: absolute; left: 0; top: 592px; width: 100%; text-align: center;
    font-size: 14px; font-style: italic; color: var(--accent); opacity: 0; z-index: 30;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">The Map, Completed</div>
  <div class="slide-sub">the board from the opening — every card, one strike each</div>

  <div id="gamewrap">
    <div id="pkg"><span class="pkglab">GPU PACKAGE</span></div>

    <div class="grp dim" id="g-cap" data-no-advance>
      <div class="hbm" style="top:225px"><div class="layer" style="top:8px"></div><div class="layer" style="top:30px; animation-delay:0.4s"></div><div class="layer" style="top:52px; animation-delay:0.8s"></div><div class="hlab">HBM</div></div>
      <div class="hbm" style="top:365px"><div class="layer" style="top:8px; animation-delay:0.2s"></div><div class="layer" style="top:30px; animation-delay:0.6s"></div><div class="layer" style="top:52px; animation-delay:1s"></div><div class="hlab">HBM</div></div>
    </div>
    <div class="grp dim" id="g-bw" data-no-advance>
      <div class="pipe" style="top:268px"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="pipe" style="top:412px"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="grp dim" id="g-compute" data-no-advance>
      <div id="die"><div class="dlab">Processor</div></div>
    </div>
    <div class="grp dim" id="g-comm" data-no-advance>
      <svg id="wires" width="1280" height="720">
        <line x1="470" y1="320" x2="792" y2="240"/>
        <line x1="470" y1="390" x2="792" y2="480"/>
      </svg>
      <div class="peer" style="top:196px"><div class="pdie"></div><div class="plab">GPU 1</div></div>
      <div class="peer" style="top:436px"><div class="pdie"></div><div class="plab">GPU n</div></div>
    </div>

    <div class="tag" id="tag-compute" style="left:475px; top:198px; border-color:#3987e5">
      <b style="color:#3987e5">Compute</b><span class="u" style="color:#3987e5">FLOP/s</span>
    </div>
    <div class="tag" id="tag-bw" style="left:150px; top:328px; border-color:#2fd6b0">
      <b style="color:#2fd6b0">Memory bandwidth</b><span class="u" style="color:#2fd6b0">bytes/s</span>
    </div>
    <div class="tag" id="tag-cap" style="left:64px; top:496px; border-color:#c98500">
      <b style="color:#e0a935">Memory capacity</b><span class="u" style="color:#e0a935">GB</span>
    </div>
    <div class="tag" id="tag-comm" style="left:680px; top:330px; border-color:#9085e9">
      <b style="color:#9085e9">Interconnect</b><span class="u" style="color:#9085e9">link GB/s</span>
      <div class="d">multi-GPU serving</div>
    </div>

    <div class="alrt" style="top:225px"></div>
    <div class="alrt" style="top:365px"></div>

    <div id="tray" data-no-advance></div>
    <div id="simhost" class="sim"></div>
    <div id="ghosthost" class="sim"></div>
    <div id="glab">launch speed — pinned at ×1.0</div>
    <div id="score"></div>

    <div id="prefill">
      <div class="phead"><span>prefill</span><span class="pbadge">TTFT</span></div>
      <div class="pbar"><i></i></div>
      <div class="pnote">its own pool — tuned on its own</div>
    </div>
    <div id="tpotchip">TPOT</div>
  </div>

  <div id="factors"></div>
  <div id="maptable"></div>
  <div id="tabnote"></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/bottlenecks.js?v=6"></script>
<script src="shared/closing.js?v=6"></script>
<script src="shared/manifest.js?v=6"></script>
<script src="shared/deck.js?v=6"></script>
<script>
  document.getElementById("factors").textContent = CL.trueFactors;

  // die tiles, exactly as slide 02
  function addTiles(host, n) {
    var t = document.createElement("div");
    t.className = "tiles";
    for (var i = 0; i < n; i++) t.appendChild(document.createElement("i"));
    host.appendChild(t);
  }
  addTiles(document.getElementById("die"), 42);
  document.querySelectorAll(".peer .pdie").forEach(function (p) { addTiles(p, 9); });

  // the nine cards — unlocked this time
  var tray = document.getElementById("tray");
  BN.techniques.forEach(function (t) {
    var c = document.createElement("div");
    c.className = "tcard";
    c.dataset.abbr = t[1];
    c.dataset.domains = JSON.stringify(t[2]);
    c.innerHTML = '<div class="abbr">' + t[1] + '</div><div class="full">' + t[0] + "</div>" +
      '<span class="prog">' + t[2].map(function () { return "<i></i>"; }).join("") + "</span>";
    tray.appendChild(c);
  });
  var CARDS = [].slice.call(tray.querySelectorAll(".tcard"));
  function cardByAbbr(a) {
    for (var i = 0; i < CARDS.length; i++) if (CARDS[i].dataset.abbr === a) return CARDS[i];
    return null;
  }

  // ---- zones (geometry identical to slide 02) --------------------------
  var stageEl = document.querySelector(".stage");
  var wrap = document.getElementById("gamewrap");
  var ZONES = [
    { key: "compute", color: "#3987e5", rects: [[300, 250, 170, 200]], chip: [302, 455, 4] },
    { key: "bw", color: "#2fd6b0", rects: [[170, 255, 136, 180]], chip: [172, 440, 3] },
    { key: "cap", color: "#c98500", rects: [[92, 225, 84, 250]], chip: [66, 548, 4] },
    { key: "comm", color: "#9085e9", rects: [[790, 196, 150, 96], [790, 436, 150, 96]], chip: [792, 297, 3] },
  ];
  ZONES.forEach(function (z) {
    z.flashEls = z.rects.map(function (r) {
      var f = document.createElement("div");
      f.style.cssText = "position:absolute; left:" + r[0] + "px; top:" + r[1] + "px; width:" + r[2] +
        "px; height:" + r[3] + "px; border:3px solid " + z.color + "; border-radius:12px;" +
        "box-shadow:0 0 26px " + z.color + "cc; opacity:0; pointer-events:none; z-index:20;";
      wrap.appendChild(f);
      return f;
    });
    z.chips = 0;
  });
  function zoneByKey(k) {
    for (var i = 0; i < ZONES.length; i++) if (ZONES[i].key === k) return ZONES[i];
  }

  function stageScale() { return stageEl.getBoundingClientRect().width / 1280; }
  function cardCenter(card) {
    var r = card.getBoundingClientRect(), sr = stageEl.getBoundingClientRect(), s = stageScale();
    return { x: (r.left + r.width / 2 - sr.left) / s, y: (r.top + r.height / 2 - sr.top) / s };
  }
  function hitZone(pt) {
    for (var i = 0; i < ZONES.length; i++) {
      var rs = ZONES[i].rects;
      for (var j = 0; j < rs.length; j++) {
        var r = rs[j];
        if (pt.x >= r[0] && pt.x <= r[0] + r[2] && pt.y >= r[1] && pt.y <= r[1] + r[3]) {
          return { zone: ZONES[i], rect: r };
        }
      }
    }
    return null;
  }

  // ---- score + speedometer ---------------------------------------------
  var correctCount = 0;
  var TOTAL_APPS = BN.techniques.reduce(function (s, t) { return s + t[2].length; }, 0);
  function speedNow() { return 1 + (CL.speedCap - 1) * correctCount / TOTAL_APPS; }
  function updateScore() {
    document.getElementById("score").textContent =
      "correctly applied: " + correctCount + " / " + TOTAL_APPS + "  →  ×" + speedNow().toFixed(2);
    sim.setSpeed(speedNow());
  }

  function dockChip(card, zone) {
    var chip = document.createElement("div");
    chip.className = "zchip";
    var cols = zone.chip[2];
    chip.style.cssText = "position:absolute; left:" + (zone.chip[0] + (zone.chips % cols) * 40) +
      "px; top:" + (zone.chip[1] + Math.floor(zone.chips / cols) * 18) + "px;" +
      "font:700 9.5px ui-monospace,monospace; color:" + zone.color + "; border:1px solid " +
      zone.color + "88; border-radius:5px; padding:1px 5px; background:rgba(11,13,18,0.9); z-index:15;";
    var abbr = card.dataset.abbr;
    chip.textContent = abbr.length > 7 ? abbr.slice(0, 6) + "…" : abbr;
    wrap.appendChild(chip);
    gsap.fromTo(chip, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.5)" });
    zone.chips++;
  }

  var toastSlot = {};   // per-zone rotating slots so quick toasts stack, not overlap
  function toast(rect, text, color, delay, slotKey) {
    var dy = 0;
    if (slotKey) {
      toastSlot[slotKey] = (toastSlot[slotKey] || 0) + 1;
      dy = -19 * ((toastSlot[slotKey] - 1) % 3);
    }
    var t = document.createElement("div");
    t.className = "ztoast";
    t.style.cssText = "position:absolute; left:" + (rect[0] + rect[2] / 2) + "px; top:" + (rect[1] - 12 + dy) +
      "px; transform:translateX(-50%); font:700 13px ui-monospace,monospace; color:" + color +
      "; z-index:25; pointer-events:none; white-space:nowrap; text-shadow:0 2px 8px #000; opacity:0;";
    t.textContent = text;
    wrap.appendChild(t);
    gsap.fromTo(t, { opacity: 0, y: 8 }, {
      opacity: 1, y: -26, duration: 1.6, ease: "power1.out", delay: delay || 0,
      onComplete: function () { gsap.to(t, { opacity: 0, duration: 0.5, onComplete: function () { t.remove(); } }); }
    });
  }

  // ---- per-bucket reactions (slide-02 vocabulary + per-card lines) -----
  var DEFMSG = { compute: "FLOPs / token ↓", bw: "HBM reads / token ↓", cap: "KV bytes ↓ — fits smaller", comm: "all-to-all traffic ↓" };
  var MSG = {
    "FA": { bw: "attention IO ↓" },
    "FP8 / INT4": { cap: "bytes / weight ↓" },
    "MoE": { compute: "active params / token ↓" },
    "EP": { cap: "experts sharded — fits again", comm: "all-to-all — the new bill" },
    "MTP": { bw: "weight reads ÷ k" },
    "PD": { compute: "prefill pool — TTFT", bw: "decode pool — TPOT" },
  };
  var wireSlow = 0;
  function zoneFX(abbr, zone, rect, delay) {
    if (zone.key === "comm") rect = [700, 196, 150, 0];   // keep comm toasts clear of the sim
    toast(rect, (MSG[abbr] && MSG[abbr][zone.key]) || DEFMSG[zone.key], zone.color, delay, zone.key);
    if (zone.key === "compute" && abbr !== "PD") {
      var lit = document.querySelectorAll("#die .tiles i:not(.idle)");
      for (var i = 0; i < 6 && i < lit.length; i++) {
        lit[i].classList.add("idle");
        lit[i].style.background = "rgba(57,135,229,0.06)";
        lit[i].style.animation = "none";
      }
    } else if (zone.key === "cap") {
      var layers = document.querySelectorAll(".hbm .layer:not(.idle)");
      if (layers.length) {
        var ly = layers[layers.length - 1];
        ly.classList.add("idle");
        ly.style.opacity = "0.15";
        ly.style.animation = "none";
      }
    } else if (zone.key === "comm") {
      wireSlow++;
      document.querySelectorAll("#wires line").forEach(function (l) {
        l.style.animationDuration = (0.9 + 0.7 * wireSlow) + "s";
        l.style.opacity = Math.max(0.3, 1 - 0.22 * wireSlow);
      });
    }
  }

  // ---- special effects: the arcs re-enacted ----------------------------
  var pending = [];
  function later(t, fn) { pending.push(gsap.delayedCall(t, fn)); }
  var alertsOn = false, epDone = false;

  function raiseAlerts() {
    alertsOn = true;
    document.querySelectorAll(".alrt").forEach(function (a) {
      a.classList.add("on");
      gsap.fromTo(a, { opacity: 0 }, { opacity: 1, duration: 0.1, repeat: 5, yoyo: false });
    });
    document.getElementById("wires").classList.add("hot");
    toast(ZONES[2].rects[0], "experts flood capacity", "#e0a935", 0.15, "cap");
  }
  function clearAlerts() {
    if (alertsOn) {
      toast(ZONES[2].rects[0], "capacity cleared", "#2fd6b0", 0, "cap");
    }
    alertsOn = false;
    document.querySelectorAll(".alrt").forEach(function (a) {
      a.classList.remove("on");
      gsap.to(a, { opacity: 0, duration: 0.4 });
    });
    document.getElementById("wires").classList.remove("hot");
  }

  function mtpFX() {
    document.getElementById("die").classList.add("heat");
    document.querySelectorAll("#g-bw .pipe").forEach(function (p) { p.classList.add("thin"); });
    // draft tokens near the speedometer: three accepted, two rejected
    for (var i = 0; i < 5; i++) {
      (function (i) {
        var bad = (i === 1 || i === 3);
        var d = document.createElement("div");
        d.className = "draft" + (bad ? " bad" : "");
        d.style.left = (972 + i * 50) + "px";
        d.style.top = "322px";
        wrap.appendChild(d);
        var tl2 = gsap.timeline({ delay: 0.15 * i });
        tl2.to(d, { opacity: 1, duration: 0.12 });
        if (bad) {
          tl2.to(d, { opacity: 0.15, duration: 0.09, repeat: 5, yoyo: true }, "+=0.4")
            .to(d, { y: 26, opacity: 0, duration: 0.4, ease: "power2.in", onComplete: function () { d.remove(); } });
        } else {
          tl2.to(d, { y: -14, opacity: 0, duration: 0.5, ease: "power1.in", delay: 0.9, onComplete: function () { d.remove(); } });
        }
      })(i);
    }
  }

  var splitOn = false;
  function splitFX() {
    splitOn = true;
    gsap.to(["#ghosthost", "#glab"], { opacity: 0, duration: 0.35 });
    gsap.fromTo("#prefill", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, delay: 0.3, ease: "power2.out" });
    gsap.fromTo("#tpotchip", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, delay: 0.45, ease: "back.out(2)" });
  }

  function specialFX(abbr) {
    if (abbr === "MoE") { if (!epDone) later(0.55, raiseAlerts); }
    else if (abbr === "EP") { epDone = true; later(0.9, clearAlerts); }
    else if (abbr === "MTP") { later(0.35, mtpFX); }
    else if (abbr === "PD") { later(0.35, splitFX); }
  }

  // ---- apply / reject --------------------------------------------------
  // One correct placement pays ALL the card's bills at once: every domain
  // zone flashes, gets a docked chip, and notches the speedometer.
  function applyCard(card, hitZoneObj) {
    if (card.dataset.absorbed) return;
    card.dataset.absorbed = "1";
    var domains = JSON.parse(card.dataset.domains);
    domains.forEach(function (d, i) {
      var z = zoneByKey(d);
      z.flashEls.forEach(function (f) {
        gsap.fromTo(f, { opacity: 0 }, { opacity: 1, duration: 0.09, yoyo: true, repeat: 3, delay: i * 0.22 });
      });
      dockChip(card, z);
      zoneFX(card.dataset.abbr, z, z.rects[0], i * 0.45);
      correctCount++;
    });
    updateScore();
    card.querySelectorAll(".prog i").forEach(function (dot) { dot.classList.add("done"); });
    specialFX(card.dataset.abbr);
    // absorb: shrink into the zone it landed on
    gsap.to(card, { scale: 0.12, opacity: 0, duration: 0.4, ease: "power2.in", delay: 0.1 });
  }

  function rejectCard(card) {
    var c = cardCenter(card);
    toast([c.x - 60, c.y - 24, 120, 0], "✗ not this bottleneck", "#e04b38");
    gsap.timeline()
      .to(card, { x: "+=9", duration: 0.05, yoyo: true, repeat: 5 })
      .to(card, {
        x: 0, y: 0, scale: 1, duration: 0.5, ease: "power3.inOut",
        onStart: function () { card._pos = null; }
      });
  }

  // ---- click-to-auto-fly (and the beats use the same path) -------------
  function flyCard(card) {
    if (card.dataset.absorbed || card._flying) return;
    card._flying = true;
    var domains = JSON.parse(card.dataset.domains);
    var zone = zoneByKey(domains[0]);
    var r = zone.rects[0];
    var c = cardCenter(card);
    var p = card._pos || { x: 0, y: 0 };
    card.style.zIndex = 45;
    gsap.to(card, {
      x: p.x + (r[0] + r[2] / 2 - c.x), y: p.y + (r[1] + r[3] / 2 - c.y),
      scale: 0.6, duration: 0.5, ease: "power2.inOut",
      onComplete: function () { applyCard(card, zone); },
    });
  }
  function flyByAbbr(a) { var c = cardByAbbr(a); if (c) flyCard(c); }

  // ---- drag OR click on a card -----------------------------------------
  function enableCard(card) {
    card.addEventListener("pointerdown", function (e) {
      if (card.dataset.absorbed || card._flying) return;
      e.preventDefault();
      var s = stageScale();
      var startX = e.clientX, startY = e.clientY, moved = 0;
      var base = card._pos || { x: 0, y: 0 };
      card.setPointerCapture(e.pointerId);
      function mv(ev) {
        moved = Math.max(moved, Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY));
        if (moved > 5) card.classList.add("dragging");
        card._pos = { x: base.x + (ev.clientX - startX) / s, y: base.y + (ev.clientY - startY) / s };
        card.style.transform = "translate(" + card._pos.x + "px," + card._pos.y + "px) scale(1.07)";
      }
      function up() {
        card.classList.remove("dragging");
        card.removeEventListener("pointermove", mv);
        card.removeEventListener("pointerup", up);
        if (moved <= 5) { card._pos = base; flyCard(card); return; }   // a click: auto-fly home
        var hit = hitZone(cardCenter(card));
        if (!hit) {
          card._pos = null;
          gsap.to(card, { x: 0, y: 0, scale: 1, duration: 0.55, ease: "elastic.out(1, 0.6)" });
        } else {
          var domains = JSON.parse(card.dataset.domains);
          if (domains.indexOf(hit.zone.key) >= 0) applyCard(card, hit.zone);
          else rejectCard(card);
        }
      }
      card.addEventListener("pointermove", mv);
      card.addEventListener("pointerup", up);
    });
  }
  CARDS.forEach(enableCard);

  // ---- sims ------------------------------------------------------------
  var sim = BN.buildSim(document.getElementById("simhost"), {});
  var ghostSim = BN.buildSim(document.getElementById("ghosthost"), {});

  // ---- the summary table (built now, revealed at the end) --------------
  var BNCOLOR = {};
  BN.list.forEach(function (b) { BNCOLOR[b.key] = b.color; });
  var mt = document.getElementById("maptable");
  mt.innerHTML = '<div class="mrow hd"><span>technique</span><span>bottleneck attacked</span><span>stage</span><span>in K3?</span></div>';
  BN.techniques.forEach(function (t) {
    var row = CL.map[t[1]];
    var d = document.createElement("div");
    d.className = "mrow";
    var dots = t[2].map(function (k) { return '<i style="background:' + BNCOLOR[k] + '"></i>'; }).join("");
    var lin = row[2].indexOf("✓") < 0;
    d.innerHTML = '<div class="tech"><div class="a">' + t[1] + '</div><div class="n">' + t[0] + '</div></div>' +
      '<div class="bnk"><span class="dots">' + dots + '</span><span>' + row[0] + '</span></div>' +
      '<div class="stg">' + row[1] + '</div>' +
      '<div class="k3' + (lin ? " lin" : "") + '">' + row[2] + '</div>';
    mt.appendChild(d);
  });
  document.getElementById("tabnote").textContent = "— " + CL.tableNote + " —";

  function hideBoard() {
    document.getElementById("tray").style.pointerEvents = "none";
    gsap.to("#gamewrap", { opacity: 0, scale: 0.97, duration: 0.55, ease: "power2.in", transformOrigin: "50% 45%" });
  }

  // ---- reset: the whole game back to its box ---------------------------
  function resetGame() {
    sim.stop(); ghostSim.stop(); sim.setSpeed(1);
    pending.forEach(function (d) { d.kill(); });
    pending = [];
    correctCount = 0; wireSlow = 0; alertsOn = false; epDone = false; splitOn = false; toastSlot = {};
    document.getElementById("tray").style.pointerEvents = "none";
    document.getElementById("score").textContent = "";
    document.querySelectorAll(".zchip, .ztoast, .draft").forEach(function (c) { c.remove(); });
    ZONES.forEach(function (z) { z.chips = 0; z.flashEls.forEach(function (f) { gsap.killTweensOf(f); f.style.opacity = 0; }); });
    document.querySelectorAll("#die .tiles i.idle, .hbm .layer.idle").forEach(function (el) {
      el.classList.remove("idle");
      el.style.background = ""; el.style.animation = ""; el.style.opacity = "";
    });
    document.querySelectorAll("#wires line").forEach(function (l) {
      l.style.animationDuration = ""; l.style.opacity = "";
    });
    document.getElementById("wires").classList.remove("hot");
    document.getElementById("die").classList.remove("heat");
    document.querySelectorAll(".pipe").forEach(function (p) { p.classList.remove("thin"); });
    document.querySelectorAll(".alrt").forEach(function (a) {
      gsap.killTweensOf(a); a.classList.remove("on"); a.style.opacity = "";
    });
    CARDS.forEach(function (c) {
      gsap.killTweensOf(c);
      delete c.dataset.absorbed;
      c._flying = false; c._pos = null;
      c.style.zIndex = "";
      c.querySelectorAll(".prog i").forEach(function (d) { d.classList.remove("done"); });
      gsap.set(c, { clearProps: "transform,opacity,visibility,scale" });
    });
    gsap.killTweensOf(["#prefill", "#tpotchip", "#ghosthost", "#glab", "#gamewrap"]);
    gsap.set(["#prefill", "#tpotchip"], { clearProps: "opacity,transform" });
    gsap.set(["#ghosthost", "#glab"], { clearProps: "opacity" });
    gsap.set("#gamewrap", { clearProps: "opacity,transform" });
  }

  // ---- timeline: the auto-played run -----------------------------------
  var tl = gsap.timeline({ paused: true });

  // beat 1: the board returns — buckets, tags, nine unlocked cards, sim + ghost
  tl.to(".grp", { opacity: 1, filter: "grayscale(0)", duration: 0.55, stagger: 0.1, ease: "power2.out" })
    .fromTo(".tag", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.08, ease: "back.out(2)" }, "-=0.45")
    .fromTo("#tray .tcard", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.05, ease: "power2.out" }, "-=0.1")
    .fromTo("#simhost", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, "-=0.2")
    .fromTo("#ghosthost", { opacity: 0 }, { opacity: 0.55, duration: 0.35 }, "-=0.15")
    .fromTo(["#glab", "#score", "#factors"], { opacity: 0 }, { opacity: 1, duration: 0.3 }, "<")
    .call(function () {
      sim.start(); ghostSim.start();
      document.getElementById("tray").style.pointerEvents = "auto";
      document.getElementById("score").textContent =
        "correctly applied: " + correctCount + " / " + TOTAL_APPS + "  →  ×" + speedNow().toFixed(2);
    });
  DECK.markStep(tl);

  // beat 2: phase 1 — the positive fits, in lineage order
  ["FA", "GQA", "MLA", "KDA", "FP8 / INT4"].forEach(function (a) {
    tl.call(flyByAbbr, [a]);
    tl.to({}, { duration: 0.95 });
  });
  DECK.markStep(tl);

  // beat 3: the chain reaction — MoE floods capacity, EP clears it
  tl.call(flyByAbbr, ["MoE"]);
  tl.to({}, { duration: 2.1 });
  tl.call(flyByAbbr, ["EP"]);
  tl.to({}, { duration: 1.6 });
  DECK.markStep(tl);

  // beat 4: MTP — the card that spends compute to buy bandwidth
  tl.call(flyByAbbr, ["MTP"]);
  tl.to({}, { duration: 1.8 });
  DECK.markStep(tl);

  // beat 5: PD — the screen splits into TTFT + TPOT
  tl.call(flyByAbbr, ["PD"]);
  tl.to({}, { duration: 1.7 });
  DECK.markStep(tl);

  // beat 6: the board freezes into the filled summary table
  tl.call(hideBoard);
  tl.to({}, { duration: 0.6 });
  tl.fromTo("#maptable", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" })
    .fromTo("#maptable .mrow", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.06, ease: "power2.out" }, "-=0.2")
    .fromTo("#tabnote", { opacity: 0 }, { opacity: 1, duration: 0.5 });

  DECK.register(tl, { reset: resetGame });
</script>
</body>
</html>
