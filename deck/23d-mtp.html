<style>
  .panel-lab { position: absolute; left: 14px; top: 8px; font-size: 10px; color: var(--ink-2); letter-spacing: 0.08em; }

  /* ---- left: serial treadmill ---- */
  #sr { position: absolute; left: 44px; top: 112px; width: 548px; height: 158px;
        border: 1.5px solid var(--line); border-radius: 14px; background: rgba(27,30,39,0.45); opacity: 0; }
  .slab { position: absolute; top: 34px; width: 78px; height: 70px; border-radius: 8px;
          border: 1.5px solid rgba(224,169,53,0.75);

  .slab b { font: 700 10.5px ui-monospace, monospace; color: #ffd98a; }

  .stok { position: absolute; top: 61px; width: 16px; height: 16px; border-radius: 4px; background: var(--accent);

  /* ---- left: speculative panel ---- */
  #sp { position: absolute; left: 44px; top: 284px; width: 548px; height: 236px;
        border: 1.5px solid var(--line); border-radius: 14px; background: rgba(27,30,39,0.45); opacity: 0; }
  #drafter { position: absolute; left: 20px; top: 56px; width: 94px; height: 46px;
             border: 1.5px solid #6b7284; border-radius: 9px; background: #0d1420;
             display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; opacity: 0; }
  #drafter .dn { font: 700 10.5px ui-monospace, monospace; color: #c7cce0; }

  #dar { position: absolute; left: 119px; top: 68px; font: 600 13px ui-monospace, monospace; color: #6b7284; opacity: 0; }

             box-shadow: 0 0 10px rgba(47,214,176,0.5); }

  .vd { position: absolute; top: 30px; width: 18px; text-align: center; font: 800 13px ui-monospace, monospace; opacity: 0; }
  .vd.y { color: var(--accent); } .vd.n { color: #e04b38; }
  .uar { position: absolute; top: 90px; font-size: 10px; color: var(--accent); opacity: 0; }
  #vslab { position: absolute; left: 140px; top: 112px; width: 232px; height: 52px; border-radius: 8px;
           border: 1.5px solid rgba(224,169,53,0.75);
           background: repeating-linear-gradient(0deg, rgba(201,133,0,0.5) 0 6px, rgba(201,133,0,0.26) 6px 12px);
           display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; opacity: 0; }
  #vslab b { font: 700 10.5px ui-monospace, monospace; color: #ffd98a; }
  #vslab i { font: 600 7.5px ui-monospace, monospace; color: rgba(255,217,138,0.8); font-style: normal; }
  #sweep { position: absolute; left: 134px; top: 50px; width: 26px; height: 42px;
           background: linear-gradient(90deg, transparent, rgba(111,177,255,0.55), transparent); opacity: 0; }
  #mpchip { position: absolute; left: 224px; top: 102px; font: 700 9.5px ui-monospace, monospace; color: var(--accent);
            border: 1.5px solid rgba(47,214,176,0.7); border-radius: 999px; padding: 2px 8px;
            background: rgba(11,13,18,0.92); opacity: 0; z-index: 5; }
  #accb { position: absolute; left: 398px; top: 48px; width: 130px; font: 700 9px ui-monospace, monospace;
          color: #c9c3ff; border: 1.5px solid rgba(144,133,233,0.8); border-radius: 10px; padding: 4px 6px;
          background: rgba(11,13,18,0.9); text-align: center; line-height: 1.35; opacity: 0; }
  #spcap { position: absolute; left: 16px; top: 172px; width: 516px; font-size: 10.5px; color: var(--ink-2); line-height: 1.35; opacity: 0; }
  #sploss { position: absolute; left: 16px; top: 204px; width: 516px; font-size: 10.5px; font-style: italic;
            color: rgba(47,214,176,0.9); line-height: 1.35; opacity: 0; }
  #sps { position: absolute; inset: 0; pointer-events: none; }
  #rdpath { fill: none; stroke: #6b7284; stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0; }
  #rdlab { position: absolute; left: 226px; top: 6px; font: 600 8.5px ui-monospace, monospace; color: #6b7284; opacity: 0; }

  /* ---- left: bottom captions ---- */
  #reframe { position: absolute; left: 44px; top: 528px; width: 548px; font-size: 11.5px; color: #c7cce0; line-height: 1.4; opacity: 0; }
  #dscap { position: absolute; left: 44px; top: 572px; width: 548px; font-size: 10.5px; color: #b9b1ff; line-height: 1.4; opacity: 0; }
  #motto { position: absolute; left: 44px; top: 616px; width: 548px; font-size: 13.5px; font-weight: 700; color: var(--accent); opacity: 0; }

  /* ---- right: the roofline, revisited ---- */
  #kick { position: absolute; left: 670px; top: 94px; font: 700 10.5px ui-monospace, monospace;
          letter-spacing: 0.2em; color: #6b7284; opacity: 0; }
  #plot { position: absolute; left: 620px; top: 108px; opacity: 0; }
  #plot text { font-family: ui-monospace, monospace; fill: #6b7284; font-size: 11px; }
  #plot .axisline { stroke: var(--line); stroke-width: 1.5; }
  #roof { fill: none; stroke: #3987e5; stroke-width: 3; stroke-linecap: round; }
  #ceil { stroke: rgba(111,177,255,0.55); stroke-width: 1.5; stroke-dasharray: 6 5; opacity: 0; }
  #wedge { fill: rgba(57,135,229,0.10); stroke: rgba(57,135,229,0.30); stroke-width: 1; opacity: 0; }
  #wedge.on { animation: wpulse 2.2s ease-in-out infinite; }
  @keyframes wpulse { 50% { opacity: 0.45; } }
  #trail { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; opacity: 0;
           filter: drop-shadow(0 0 5px rgba(47,214,176,0.7)); }
  #ach { stroke: rgba(47,214,176,0.45); stroke-width: 1.5; stroke-dasharray: 5 5; opacity: 0; }
  #dot { filter: drop-shadow(0 0 7px rgba(224,75,56,0.9)); }
  #ghost { filter: drop-shadow(0 0 6px rgba(224,169,53,0.8)); }
  #dq { position: absolute; left: 688px; top: 454px; font: 600 11px ui-monospace, monospace; color: #e04b38; white-space: nowrap; opacity: 0; z-index: 9; }
  #trk { position: absolute; left: 688px; top: 474px; font: 700 12px ui-monospace, monospace; color: #e0a935; white-space: nowrap; opacity: 0; z-index: 9; }
  #trk .xb { display: none; font: 700 10px ui-monospace, monospace; color: #0b0d12; background: var(--accent);
             border-radius: 999px; padding: 1px 6px; margin-left: 5px; vertical-align: 1px; }
  #uniq { position: absolute; left: 620px; top: 560px; width: 640px; font-size: 12.5px; font-weight: 700;
          color: var(--accent); line-height: 1.45; opacity: 0; }
  #econ { position: absolute; left: 620px; top: 602px; width: 640px; font-size: 10.5px; color: #9aa1b5; opacity: 0; }
  #cv1 { position: absolute; left: 950px; top: 348px; width: 280px; font-size: 10.5px; color: #e07a66; line-height: 1.4; opacity: 0; }
  #pdrow { position: absolute; left: 620px; top: 632px; width: 612px; display: flex; align-items: center; gap: 10px; opacity: 0; }
  #pill { width: 120px; height: 14px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; display: flex; flex: none; }
  #pdp { width: 54px; background: rgba(57,135,229,0.75); }
  #pdd { width: 64px; background: rgba(47,214,176,0.75); }
  #pill span { font: 800 8px ui-monospace, monospace; color: #0b0d12; display: flex; align-items: center; justify-content: center; height: 100%; }
  #cv2 { font-size: 10.5px; color: #9aa1b5; }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">Multi-Token Prediction: Back to the Roofline</div>
  <div class="slide-sub">the chart that condemned decode shows the way out</div>

  <div id="sr">
    <span class="panel-lab">SERIAL DECODE</span>
    <div id="srcap"></div>
  </div>

  <div id="sp">
    <span class="panel-lab">SPECULATIVE DECODE &middot; k = 4</span>
    <div id="drafter"><span class="dn">drafter</span><span class="ds">cheap draft</span></div>
    <div id="dar">&rarr;</div>
    <div id="sweep"></div>
    <div id="vslab"><b>W + KV</b><i>one read</i></div>
    <div id="mpchip">= mini-prefill</div>
    <div id="accb"></div>
    <svg id="sps" width="548" height="236">
      <path id="rdpath" d="M 373 54 C 380 30, 366 22, 340 22 L 150 22 C 112 22, 94 30, 86 54"/>
    </svg>
    <div id="rdlab">redraw from reject</div>
    <div id="spcap"></div>
    <div id="sploss"></div>
  </div>

  <div id="reframe"></div>
  <div id="dscap"></div>
  <div id="motto"></div>

  <div id="kick">THE ROOFLINE &middot; REVISITED</div>
  <svg id="plot" width="640" height="448"></svg>
  <div id="dq"></div>
  <div id="trk">decode roof &asymp; <b id="trkv"></b> TF/s <span class="xb" id="trkx"></span></div>
  <div id="uniq"></div>
  <div id="econ"></div>
  <div id="cv1"></div>
  <div id="pdrow">
    <div id="pill"><span id="pdp">P</span><span id="pdd">D</span></div>
    <div id="cv2"></div>
  </div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/mtp.js?v=4"></script>
<script src="shared/gpus.js?v=4"></script>
<script src="shared/manifest.js?v=4"></script>
<script src="shared/deck.js?v=4"></script>
<script>
  // ---- static content from shared data ----
  document.getElementById("srcap").textContent = MTP.serial;
  document.getElementById("spcap").textContent = MTP.spec.draft + " · " + MTP.spec.verify;
  document.getElementById("sploss").textContent = MTP.spec.lossless;
  document.getElementById("reframe").textContent = MTP.reframe;
  document.getElementById("dq").textContent = MTP.ai;
  document.getElementById("uniq").textContent = MTP.unique;
  document.getElementById("econ").textContent = MTP.econ;
  document.getElementById("cv1").textContent = MTP.caveats[0];
  document.getElementById("cv2").textContent = MTP.caveats[1];
  document.getElementById("accb").textContent = MTP.dsv3.accept;
  document.getElementById("dscap").textContent = MTP.dsv3.what;
  document.getElementById("motto").textContent = MTP.dsv3.point;

  // ---- serial treadmill: 3 cycles of huge read -> tiny token ----
  var sr = document.getElementById("sr");
  for (var c = 0; c < 3; c++) {
    sr.insertAdjacentHTML("beforeend",
      '<div class="slab" id="slab' + c + '" style="left:' + (24 + c * 170) + 'px"><b>W + KV</b><i>all bytes</i></div>' +
      '<div class="sar" id="sar' + c + '" style="left:' + (106 + c * 170) + 'px">&rarr;</div>' +
      '<div class="stok" id="stok' + c + '" style="left:' + (130 + c * 170) + 'px"></div>');
  }

  // ---- speculative panel: draft tokens + verdicts ----
  var sp = document.getElementById("sp");
  var TOKX = [140, 202, 264, 326];
  for (var i = 0; i < 4; i++) {
    sp.insertAdjacentHTML("beforeend",
      '<div class="dtok" id="dt' + i + '" style="left:' + TOKX[i] + 'px">t+' + (i + 1) + "</div>" +
      '<div class="vd ' + (i < 3 ? "y" : "n") + '" id="vd' + i + '" style="left:' + (TOKX[i] + 14) + 'px">' + (i < 3 ? "✓" : "✕") + "</div>" +
      '<div class="uar" style="left:' + (TOKX[i] + 18) + 'px">▲</div>');
  }

  // ---- roofline (slide-03 visual language, compact, H100 only) ----
  var h = GPUS.list[1], bal = GPUS.balance(h);        // H100, ~295 F/B
  var NS = "http://www.w3.org/2000/svg";
  var plot = document.getElementById("plot");
  var X0 = 50, W = 560, Y0 = 386, H = 340;
  function rx(ai) { return X0 + Math.log2(ai) / 10 * W; }
  function ry(tf) { return Y0 - Math.log2(tf) / 14 * H; }
  function el(tag, attrs, txt) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (txt !== undefined) e.textContent = txt;
    plot.appendChild(e);
    return e;
  }
  var P1 = [rx(1), ry(h.bw)], P2 = [rx(2), ry(h.bw * 2)], P4 = [rx(4), ry(h.bw * 4)];
  var RGX = rx(bal), CY = ry(h.tflops), GX = rx(700);

  // idle-compute wedge (under the roof, below the compute ceiling)
  el("polygon", { id: "wedge", points: X0 + "," + CY + " " + RGX + "," + CY + " " + X0 + "," + P1[1] });
  el("text", { id: "wlab", x: 116, y: 194, fill: "#6fb1ff", "font-weight": 700, opacity: 0 }, "idle compute");
  el("line", { id: "ceil", x1: X0, y1: CY, x2: RGX, y2: CY });

  // axes + ticks
  el("line", { x1: X0, y1: Y0, x2: X0 + W, y2: Y0, "class": "axisline" });
  el("line", { x1: X0, y1: Y0, x2: X0, y2: Y0 - H, "class": "axisline" });
  [1, 4, 16, 64, 256, 1024].forEach(function (v) { el("text", { x: rx(v) - 8, y: Y0 + 16 }, String(v)); });
  [1, 16, 256, 4096].forEach(function (v) { el("text", { x: X0 - 40, y: ry(v) + 4 }, v.toLocaleString()); });
  el("text", { x: X0 + W / 2 - 100, y: Y0 + 34 }, "arithmetic intensity (FLOPs / byte)");
  el("text", { x: X0 - 44, y: ry(16384) - 4 }, "TFLOPS");

  // H100 roof + ridge
  var roof = el("path", { id: "roof", d: "M " + P1[0] + " " + P1[1] + " L " + RGX + " " + CY + " L " + rx(1024) + " " + CY });
  var rlen = roof.getTotalLength();
  roof.style.strokeDasharray = rlen;
  roof.style.strokeDashoffset = rlen;
  el("circle", { id: "ridge", cx: RGX, cy: CY, r: 6, fill: h.color, opacity: 0 });
  el("text", { id: "ridgelab", x: RGX - 30, y: CY - 12, fill: h.color, "font-weight": 700, "font-size": 12, opacity: 0 }, "~" + bal);

  // climb machinery
  el("line", { id: "ach", x1: X0, y1: P1[1], x2: X0 + W, y2: P1[1] });
  el("line", { id: "trail", x1: P1[0], y1: P1[1], x2: P1[0], y2: P1[1] });
  el("circle", { id: "tk2", cx: P2[0], cy: P2[1], r: 3, fill: "#2fd6b0", opacity: 0 });
  el("text", { id: "tl2", x: P2[0] - 12, y: P2[1] + 28, fill: "#2fd6b0", "font-size": 10, opacity: 0 }, "k=2");
  el("circle", { id: "tk4", cx: P4[0], cy: P4[1], r: 3, fill: "#2fd6b0", opacity: 0 });
  el("text", { id: "tl4", x: P4[0] - 12, y: P4[1] + 28, fill: "#2fd6b0", "font-size": 10, opacity: 0 }, "k=4");

  // bytes/token ÷ k bracket under the x-axis
  el("path", { id: "bkt", d: "M " + rx(1) + " 408 L " + rx(1) + " 415 L " + rx(4) + " 415 L " + rx(4) + " 408",
               fill: "none", stroke: "#2fd6b0", "stroke-width": 1.5, opacity: 0 });
  el("text", { id: "bktlab", x: (rx(1) + rx(4)) / 2, y: 431, fill: "#2fd6b0", "font-size": 10,
               "text-anchor": "middle", opacity: 0 }, "bytes / token ÷ k");

  // the decode dot + the large-batch ghost
  el("circle", { id: "dot", cx: P1[0], cy: P1[1], r: 7, fill: "#e04b38", opacity: 0 });
  el("circle", { id: "ghost", cx: P4[0], cy: P4[1], r: 6, fill: "#e0a935", opacity: 0 });

  // ---- DOM mutators (via .call, undone in reset) ----
  var trkv = document.getElementById("trkv"), trkx = document.getElementById("trkx");
  var trk = document.getElementById("trk"), drafter = document.getElementById("drafter");
  function setTrk(k) {
    trkv.textContent = k === 1 ? h.bw.toFixed(2) : (h.bw * k).toFixed(1);
    trkx.style.display = k > 1 ? "inline-block" : "none";
    if (k > 1) trkx.textContent = "×" + k;
  }
  function tokCls(i, cls) { document.getElementById("dt" + i).classList.add(cls); }
  function drafterSet(on) {
    drafter.classList.toggle("mtp", on);
    drafter.querySelector(".dn").textContent = on ? "MTP head" : "drafter";
    drafter.querySelector(".ds").textContent = on ? "next-next token" : "cheap draft";
  }
  function wedgeOn(on) { document.getElementById("wedge").classList.toggle("on", on); }
  function ghostRed(on) { document.getElementById("ghost").setAttribute("fill", on ? "#e04b38" : "#e0a935"); }
  setTrk(1);

  // ---- timeline: 5 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the serial treadmill — and decode back on the chart that condemned it
  tl.fromTo("#sr", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" });
  for (var b = 0; b < 3; b++) {
    tl.fromTo("#slab" + b, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" })
      .fromTo("#sar" + b, { opacity: 0 }, { opacity: 1, duration: 0.12 })
      .fromTo("#stok" + b, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.5)" });
  }
  tl.fromTo("#srcap", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35 })
    .fromTo("#kick", { opacity: 0 }, { opacity: 0.9, duration: 0.3 }, "-=0.1")
    .fromTo("#plot", { opacity: 0 }, { opacity: 1, duration: 0.45 })
    .to("#roof", { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" })
    .fromTo("#ridge", { opacity: 0, scale: 0, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" })
    .to("#ridgelab", { opacity: 1, duration: 0.25 }, "-=0.1")
    .fromTo("#dot", { opacity: 0, scale: 0, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)" })
    .fromTo("#dq", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.35 })
    .fromTo("#trk", { opacity: 0 }, { opacity: 1, duration: 0.3 }, "-=0.15")
    .to("#dot", { scale: 1.35, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" });
  DECK.markStep(tl);

  // beat 2: speculative decoding — draft, verify, accept/reject; the dot climbs the roof
  tl.to("#sr", { opacity: 0.45, duration: 0.35 })
    .fromTo("#sp", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" })
    .fromTo("#drafter", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" })
    .fromTo("#dar", { opacity: 0 }, { opacity: 1, duration: 0.2 })
    .fromTo(".dtok", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.2, stagger: 0.1 })
    .fromTo("#spcap", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35 })
    .fromTo("#vslab", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" })
    .fromTo(".uar", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.06 })
    .fromTo("#sweep", { opacity: 0, x: 0 }, { opacity: 1, x: 206, duration: 0.55, ease: "power1.inOut" })
    .to("#sweep", { opacity: 0, duration: 0.15 });
  for (var v = 0; v < 3; v++) {
    tl.call(tokCls, [v, "ok"])
      .fromTo("#vd" + v, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" })
      .fromTo("#dt" + v, { scale: 1.18 }, { scale: 1, duration: 0.18 }, "<");
  }
  tl.call(tokCls, [3, "bad"])
    .fromTo("#vd3", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" })
    .to("#dt3", { x: "+=5", duration: 0.05, yoyo: true, repeat: 5 })
    .to("#dt3", { x: 0, y: 14, opacity: 0.3, duration: 0.4, ease: "power2.in" })
    .fromTo("#rdpath", { opacity: 0 }, { opacity: 1, duration: 0.35 })
    .fromTo("#rdlab", { opacity: 0 }, { opacity: 1, duration: 0.25 }, "-=0.15")
    .fromTo("#sploss", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 });
  // the same chart, the dot finally moves along the axis hardware never moved
  tl.to("#dq", { opacity: 0, duration: 0.3 })
    .fromTo("#ach", { opacity: 0 }, { opacity: 0.9, duration: 0.3 })
    .to("#trail", { opacity: 1, duration: 0.2 }, "<")
    .to("#dot", { attr: { cx: P2[0], cy: P2[1] }, duration: 0.7, ease: "power2.inOut" })
    .to("#trail", { attr: { x2: P2[0], y2: P2[1] }, duration: 0.7, ease: "power2.inOut" }, "<")
    .to("#ach", { attr: { y1: P2[1], y2: P2[1] }, duration: 0.7, ease: "power2.inOut" }, "<")
    .to("#trk", { left: 744, top: 438, duration: 0.7, ease: "power2.inOut" }, "<")
    .call(setTrk, [2])
    .fromTo("#tk2, #tl2", { opacity: 0 }, { opacity: 1, duration: 0.2 })
    .to("#dot", { attr: { cx: P4[0], cy: P4[1] }, duration: 0.7, ease: "power2.inOut" })
    .to("#trail", { attr: { x2: P4[0], y2: P4[1] }, duration: 0.7, ease: "power2.inOut" }, "<")
    .to("#ach", { attr: { y1: P4[1], y2: P4[1] }, duration: 0.7, ease: "power2.inOut" }, "<")
    .to("#trk", { left: 802, top: 410, duration: 0.7, ease: "power2.inOut" }, "<")
    .call(setTrk, [4])
    .fromTo("#tk4, #tl4", { opacity: 0 }, { opacity: 1, duration: 0.2 })
    .to("#dot", { scale: 1.3, duration: 0.3, yoyo: true, repeat: 1 });
  DECK.markStep(tl);

  // beat 3: the reframe + the economics, read off the plot
  tl.fromTo("#mpchip", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" })
    .fromTo("#reframe", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 })
    .fromTo("#bkt", { opacity: 0 }, { opacity: 0.85, duration: 0.3 })
    .fromTo("#bktlab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, "-=0.1")
    .fromTo("#econ", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35 })
    .fromTo("#ceil", { opacity: 0 }, { opacity: 0.9, duration: 0.4 })
    .fromTo("#wedge", { opacity: 0 }, { opacity: 0.9, duration: 0.5 })
    .call(wedgeOn, [true])
    .fromTo("#wlab", { opacity: 0 }, { opacity: 1, duration: 0.3 })
    .fromTo("#uniq", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5 });
  DECK.markStep(tl);

  // beat 4: DeepSeek-V3's answer — the drafter is trained into the architecture
  tl.call(drafterSet, [true])
    .fromTo("#drafter", { scale: 1.15 }, { scale: 1, duration: 0.35, ease: "back.out(2)" })
    .fromTo("#accb", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" })
    .fromTo("#dscap", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 })
    .fromTo("#motto", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 });
  DECK.markStep(tl);

  // beat 5: the fine print, drawn on the same chart
  tl.fromTo("#ghost", { opacity: 0, scale: 0, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" })
    .to("#ghost", { attr: { cx: RGX, cy: CY }, duration: 0.9, ease: "power1.inOut" })
    .call(ghostRed, [true])
    .to("#ghost", { attr: { cx: GX, cy: CY }, duration: 0.5, ease: "power1.out" })
    .to("#ghost", { x: "+=5", duration: 0.06, yoyo: true, repeat: 5 })
    .to("#ghost", { x: 0, duration: 0.08 })
    .fromTo("#cv1", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 })
    .fromTo("#pdrow", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 })
    .to("#pdp", { width: 72, duration: 0.5, ease: "power2.inOut" })
    .to("#pdd", { width: 46, duration: 0.5, ease: "power2.inOut" }, "<");

  DECK.register(tl, {
    reset: function () {
      for (var i = 0; i < 4; i++) document.getElementById("dt" + i).classList.remove("ok", "bad");
      drafterSet(false); setTrk(1); wedgeOn(false); ghostRed(false);
      trk.style.left = "688px"; trk.style.top = "474px";
    }
  });
</script>
