<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sparsity Race</title>
<link rel="stylesheet" href="shared/deck.css?v=3">
<style>
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  /* ---- three-axes cards (left) ---- */
  .axcard {
    position: absolute; left: 44px; width: 350px; height: 126px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; opacity: 0;
  }
  .axcard .axname { font: 700 12.5px ui-monospace, monospace; }
  .axcard .axdesc { margin-top: 6px; width: 210px; font-size: 9.5px; color: #9aa1b5; line-height: 1.45; }
  .axviz { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 104px; height: 78px; }

  #coarse, #fine { position: absolute; inset: 2px; display: grid; gap: 3px; }
  #coarse { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
  #fine { grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(5, 1fr); gap: 2px; }
  #coarse i { background: rgba(57,135,229,0.3); border: 1px solid rgba(57,135,229,0.5); border-radius: 3px; }
  #fine i { background: rgba(111,177,255,0.4); border-radius: 2px; opacity: 0; }

  #shgrid { position: absolute; inset: 2px; display: grid; gap: 2px; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(5, 1fr); }
  #shgrid i { background: rgba(57,135,229,0.14); border-radius: 2px; animation: shTw 3s ease-in-out infinite; }
  #shgrid i:nth-child(3n) { animation-delay: 0.8s; }
  #shgrid i:nth-child(5n) { animation-delay: 1.6s; }
  @keyframes shTw { 50% { background: rgba(57,135,229,0.32); } }
  #shgrid i.always {
    background: var(--accent); animation: shOn 1.5s ease-in-out infinite;
  }
  @keyframes shOn { 50% { box-shadow: 0 0 12px rgba(47,214,176,0.9); } }
  #shcap { position: absolute; right: 12px; bottom: 6px; font: 600 8.5px ui-monospace, monospace; color: var(--accent); }

  #vz2 { text-align: center; padding-top: 6px; }
  #vz2 .k { font: 600 9px ui-monospace, monospace; color: #6b7284; }
  #vz2 .frac { margin-top: 4px; font: 800 17px ui-monospace, monospace; color: #e8eaf0; }
  #vz2 .pct { margin-top: 4px; font: 700 13px ui-monospace, monospace; color: var(--accent); }

  /* ---- the race chart (right) ---- */
  .gline { position: absolute; left: 470px; width: 730px; height: 1px; background: rgba(42,46,59,0.9); opacity: 0; }
  .glab { position: absolute; left: 434px; width: 30px; text-align: right; font: 600 10px ui-monospace, monospace; color: #6b7284; opacity: 0; }
  #baseline { position: absolute; left: 470px; top: 560px; width: 730px; height: 1.5px; background: #3a3f4f; opacity: 0; }
  #legend { position: absolute; left: 480px; top: 118px; font-size: 11px; color: #c7cce0; opacity: 0; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin: 0 6px 0 16px; vertical-align: -1px; }
  #legend i:first-child { margin-left: 0; }

  .bar { position: absolute; width: 46px; bottom: 160px; border-radius: 4px 4px 0 0; height: 0; }
  .tb { background: linear-gradient(rgba(201,133,0,0.95), rgba(201,133,0,0.45)); }
  .ab { background: linear-gradient(#3987e5, rgba(57,135,229,0.6)); }
  .blab { position: absolute; width: 90px; text-align: center; font: 700 13px ui-monospace, monospace; opacity: 0; }
  .blab.t { color: #e0a935; } .blab.a { color: #6fb1ff; }
  .mrow { position: absolute; width: 210px; text-align: center; opacity: 0; white-space: nowrap; }
  .mname { top: 570px; font-size: 12px; font-weight: 650; color: #e8eaf0; }
  .mname span { color: var(--ink-2); font-weight: 400; font-size: 10.5px; }
  .mexp { top: 589px; font: 600 10px ui-monospace, monospace; color: #9aa1b5; }
  .mact { top: 606px; font: 700 11px ui-monospace, monospace; color: #6b7284; }
  .mact.k3 { color: var(--accent); }

  #k3frame {
    position: absolute; left: 953px; top: 146px; width: 154px; height: 478px;
    border: 1.5px dashed rgba(47,214,176,0.55); border-radius: 12px; opacity: 0;
    box-shadow: 0 0 22px rgba(47,214,176,0.14);
  }
  #k3tag {
    position: absolute; left: 968px; top: 128px; font: 700 11px ui-monospace, monospace;
    color: var(--accent); border: 1.5px solid var(--accent); border-radius: 999px;
    padding: 3px 10px; background: rgba(11,13,18,0.92); opacity: 0; z-index: 5;
  }
  #flatline {
    position: absolute; left: 500px; top: 549px; width: 620px; height: 0;
    border-top: 2px dashed #6fb1ff; opacity: 0;
  }
  #flatlab { position: absolute; left: 660px; top: 516px; font: 700 11px ui-monospace, monospace; color: #6fb1ff; opacity: 0; text-shadow: 0 0 6px #12141a, 0 0 6px #12141a; }
  #interp {
    position: absolute; left: 240px; top: 650px; width: 800px; text-align: center;
    font-size: 14px; font-style: italic; color: var(--accent); opacity: 0;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">The Sparsity Race</div>
  <div class="slide-sub">three axes of MoE evolution — then the score, 2024 → 2026</div>

  <div class="axcard" id="ax0" style="top:118px">
    <div class="axname" style="color:#6fb1ff"></div><div class="axdesc"></div>
    <div class="axviz"><div id="coarse"><i></i><i></i><i></i><i></i></div><div id="fine"></div></div>
  </div>
  <div class="axcard" id="ax1" style="top:258px">
    <div class="axname" style="color:#2fd6b0"></div><div class="axdesc"></div>
    <div class="axviz"><div id="shgrid"></div></div>
    <div id="shcap">always on</div>
  </div>
  <div class="axcard" id="ax2" style="top:398px">
    <div class="axname" style="color:#e0a935"></div><div class="axdesc"></div>
    <div class="axviz" id="vz2">
      <div class="k">top-k / routed</div>
      <div class="frac" id="frac">8 / 256</div>
      <div class="pct" id="pct">≈ 3.1%</div>
    </div>
  </div>

  <div class="gline" style="top:424px"></div><div class="glab" style="top:417px">1 T</div>
  <div class="gline" style="top:288px"></div><div class="glab" style="top:281px">2 T</div>
  <div id="baseline"></div>
  <div id="legend"><i style="background:#c98500"></i>total params<i style="background:#3987e5"></i>active / token</div>
  <div id="k3frame"></div>
  <div id="k3tag"></div>
  <div id="flatline"></div>
  <div id="flatlab">active ≈ flat</div>
  <div id="interp"></div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/moe.js?v=3"></script>
<script src="shared/manifest.js?v=3"></script>
<script src="shared/deck.js?v=3"></script>
<script>
  // ---- axes cards from MOE.axes ----
  MOE.axes.forEach(function (ax, i) {
    var c = document.getElementById("ax" + i);
    c.querySelector(".axname").textContent = ax[0];
    c.querySelector(".axdesc").textContent = ax[1];
  });
  var fine = document.getElementById("fine");
  for (var i = 0; i < 40; i++) fine.appendChild(document.createElement("i"));
  var shg = document.getElementById("shgrid");
  for (i = 0; i < 40; i++) {
    var s = document.createElement("i");
    if (i === 19) s.className = "always";
    shg.appendChild(s);
  }
  document.getElementById("k3tag").textContent = MOE.evo[2].label;
  document.getElementById("interp").textContent = "“" + MOE.interp + "”";

  // ---- chart groups from MOE.evo ----
  var S = 380 / 2800;                       // px per B
  var CX = [590, 810, 1030];
  var stage = document.querySelector(".stage");
  var groups = [];

  function fmtP(v) {
    return v >= 995 ? ((v / 1000).toFixed(1).replace(/\.0$/, "") + " T") : Math.round(v) + " B";
  }
  function el(cls, style, html) {
    var d = document.createElement("div");
    d.className = cls;
    for (var k in style) d.style[k] = style[k];
    if (html) d.innerHTML = html;
    stage.appendChild(d);
    return d;
  }

  MOE.evo.forEach(function (m, i) {
    var cx = CX[i];
    var g = {
      m: m, cnt: { t: 0, a: 0 },
      tb: el("bar tb", { left: (cx - 51) + "px" }),
      ab: el("bar ab", { left: (cx + 5) + "px" }),
      tlab: el("blab t", { left: (cx - 73) + "px", bottom: "166px" }, "0"),
      alab: el("blab a", { left: (cx - 17) + "px", bottom: "166px" }, "0"),
      name: el("mrow mname", { left: (cx - 105) + "px" },
        m.name + ' <span>· ' + m.year + "</span>"),
      exp: el("mrow mexp", { left: (cx - 105) + "px" },
        m.routed + " routed · top-" + m.topk + " + " + m.shared + " shared"),
      act: el("mrow mact" + (m.key === "k3" ? " k3" : ""), { left: (cx - 105) + "px" },
        m.key === "k3" ? MOE.k3rate : m.topk + " / " + m.routed + " ≈ " + (m.topk / m.routed * 100).toFixed(1) + "%"),
    };
    g.paint = function () {
      g.tb.style.height = (g.cnt.t * S) + "px";
      g.ab.style.height = Math.max(g.cnt.a * S, 0) + "px";
      g.tlab.style.bottom = (160 + g.cnt.t * S + 8) + "px";
      g.alab.style.bottom = (160 + g.cnt.a * S + 8) + "px";
      g.tlab.textContent = fmtP(g.cnt.t);
      g.alab.textContent = Math.round(g.cnt.a) + " B";
    };
    groups.push(g);
  });

  function growGroup(tl, i, dur) {
    var g = groups[i];
    tl.fromTo([g.name, g.exp, g.act], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.07 })
      .to([g.tlab, g.alab], { opacity: 1, duration: 0.25 }, "-=0.2")
      .to(g.cnt, { t: g.m.total, duration: dur, ease: "power2.inOut", onUpdate: g.paint }, "-=0.15")
      .to(g.cnt, { a: g.m.active, duration: 0.5, ease: "power1.out", onUpdate: g.paint }, "<");
  }

  // ---- timeline: 4 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the three axes — subdivide, lock the shared cell, collapse the rate
  tl.fromTo(".axcard", { opacity: 0, x: -22 }, { opacity: 1, x: 0, duration: 0.45, stagger: 0.16, ease: "power3.out" })
    .fromTo("#coarse", { opacity: 1 }, { opacity: 0, scale: 1.05, duration: 0.5, ease: "power2.inOut" }, "-=0.4")
    .fromTo("#fine i", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.012, ease: "power2.out" }, "<0.15")
    .fromTo("#shcap", { opacity: 0 }, { opacity: 1, duration: 0.35 })
    .fromTo("#pct", { scale: 1.35 }, { scale: 1, duration: 0.45, ease: "back.out(2)" });
  DECK.markStep(tl);

  // beat 2: chart frame + DeepSeek-V3 opens the race
  tl.fromTo("#baseline", { opacity: 0 }, { opacity: 1, duration: 0.3 })
    .fromTo(".gline", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.08 }, "-=0.1")
    .fromTo(".glab", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.08 }, "<")
    .fromTo("#legend", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.35 }, "-=0.1");
  growGroup(tl, 0, 0.8);
  DECK.markStep(tl);

  // beat 3: K2, then K3 — total soars, active barely moves
  var frac = document.getElementById("frac"), pct = document.getElementById("pct");
  function setRate(f, p) { frac.textContent = f; pct.textContent = p; }
  growGroup(tl, 1, 0.8);
  tl.call(function () { setRate("8 / 384", "≈ 2.1%"); });
  growGroup(tl, 2, 1.2);
  tl.call(function () { setRate("16 / 896", "≈ 1.8%"); })
    .fromTo("#pct", { scale: 1.35 }, { scale: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false })
    .fromTo("#k3frame", { opacity: 0 }, { opacity: 1, duration: 0.4 }, "-=0.2")
    .fromTo("#k3tag", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, "-=0.15");
  DECK.markStep(tl);

  // beat 4: the flat line through the active bars + the interpretation
  tl.fromTo("#flatline", { opacity: 0, scaleX: 0, transformOrigin: "left center" },
      { opacity: 0.9, scaleX: 1, duration: 0.7, ease: "power2.inOut" })
    .fromTo("#flatlab", { opacity: 0 }, { opacity: 1, duration: 0.35 }, "-=0.2")
    .fromTo("#interp", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" });

  DECK.register(tl, { reset: function () { setRate("8 / 256", "≈ 3.1%"); } });
</script>
</body>
</html>
