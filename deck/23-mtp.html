<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speculative Decoding &amp; Multi-Token Prediction</title>
<link rel="stylesheet" href="shared/deck.css?v=20">
<link rel="stylesheet" href="shared/bottlenecks.css?v=20">
<style>
  /* ---- the GPU-package machine (slides 16-22 language) ---- */
  #machine { position: absolute; inset: 0; opacity: 0.13; filter: grayscale(0.9); }
  #pkg {
    position: absolute; left: 44px; top: 150px; width: 380px; height: 246px;
    border: 1.5px solid var(--line); border-radius: 18px; background: rgba(27,30,39,0.45);
  }
  #pkg .pkglab { position: absolute; left: 14px; top: 8px; font-size: 10.5px; color: var(--ink-2); letter-spacing: 0.08em; }

  #hbm {
    position: absolute; left: 66px; top: 184px; width: 92px; height: 180px;
    border: 2px solid rgba(201,133,0,0.7); border-radius: 8px;
  }
  #hbm .hlab { position: absolute; bottom: 4px; width: 100%; text-align: center; font-size: 10px; color: #e0a935; font-weight: 700; }
  #wblock { position: absolute; left: 8px; top: 10px; right: 8px; display: flex; flex-wrap: wrap; gap: 2px; align-content: flex-start; }
  .wcell {
    flex: none; width: 32px; height: 11px; border-radius: 2px;
    background: linear-gradient(rgba(201,133,0,0.45), rgba(201,133,0,0.85));
    animation: wGlow 2.6s ease-in-out infinite;
  }
  .wcell:nth-child(3n) { animation-delay: 0.6s; }
  .wcell:nth-child(4n) { animation-delay: 1.3s; }
  @keyframes wGlow { 50% { opacity: 0.55; } }

  .pipe {
    position: absolute; left: 162px; top: 262px; width: 76px; height: 14px;
    border: 2px solid rgba(47,214,176,0.55); border-radius: 7px; overflow: hidden;
  }
  .pipe i {
    position: absolute; top: 2px; width: 6px; height: 6px; border-radius: 50%;
    background: #2fd6b0; animation: qFlow 1.1s linear infinite;
  }
  .pipe i:nth-child(2) { animation-delay: 0.37s; }
  .pipe i:nth-child(3) { animation-delay: 0.74s; }
  @keyframes qFlow { from { left: -8px; } to { left: 84px; } }

  #die {
    position: absolute; left: 246px; top: 198px; width: 150px; height: 152px;
    border: 2.5px solid #3987e5; border-radius: 10px; background: #0d1420;
    animation: bnChipPulse 1.8s ease-in-out infinite;
  }
  #die .dlab { position: absolute; bottom: 5px; width: 100%; text-align: center; font-size: 11px; color: #9ec7f5; font-weight: 600; }
  .tiles {
    position: absolute; inset: 9px 9px 24px; display: grid; gap: 3px;
    grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr);
  }
  .tiles i { background: rgba(57,135,229,0.22); border-radius: 2px; animation: smTwinkle 2.6s ease-in-out infinite; }
  .tiles i:nth-child(3n) { animation-delay: 0.5s; }
  .tiles i:nth-child(4n) { animation-delay: 1.1s; }
  @keyframes smTwinkle { 50% { background: rgba(111,177,255,0.6); } }
  #die.hot { animation: none; border-color: #6fb1ff; box-shadow: 0 0 22px rgba(111,177,255,0.55); }
  #die.hot .tiles i { animation: hotTwinkle 0.9s ease-in-out infinite; background: rgba(111,177,255,0.55); }
  @keyframes hotTwinkle { 50% { background: #9ec7f5; } }

  /* the whole weight block, streaming down the pipe once per read */
  #slab {
    position: absolute; left: 70px; top: 196px; width: 84px; height: 150px;
    border-radius: 6px; background: rgba(224,169,53,0.35);
    border: 1.5px solid rgba(224,169,53,0.7); opacity: 0; z-index: 11;
  }

  /* zone flashes, the machine arc's */
  .zflash { position: absolute; opacity: 0; pointer-events: none; z-index: 20; border-radius: 12px; }
  #fl-cap { left: 58px; top: 176px; width: 108px; height: 196px; border: 3px solid #c98500; box-shadow: 0 0 26px rgba(201,133,0,0.8); }
  #fl-bw { left: 154px; top: 254px; width: 92px; height: 30px; border: 3px solid #2fd6b0; box-shadow: 0 0 26px rgba(47,214,176,0.8); }
  #fl-comp { left: 240px; top: 192px; width: 162px; height: 164px; border: 3px solid #3987e5; box-shadow: 0 0 26px rgba(57,135,229,0.8); }
  #stampfl { left: 458px; top: 256px; width: 238px; height: 48px; border: 3px solid #3987e5; box-shadow: 0 0 26px rgba(57,135,229,0.8); }

  /* ---- the conveyor out of the package ---- */
  #belt {
    position: absolute; left: 424px; top: 296px; width: 800px; height: 18px;
    border: 2px solid var(--line); border-radius: 9px; opacity: 0;
    background: repeating-linear-gradient(90deg, rgba(154,161,181,0.16) 0 16px, rgba(154,161,181,0.04) 16px 32px);
    animation: beltMove 0.9s linear infinite;
  }
  @keyframes beltMove { to { background-position: 32px 0; } }
  #beltlab { position: absolute; left: 1122px; top: 322px; font: 600 9.5px ui-monospace, monospace; color: var(--ink-2); letter-spacing: 0.06em; opacity: 0; }

  .stok, .gtok {
    position: absolute; width: 26px; height: 24px; border-radius: 6px; z-index: 12;
    display: flex; align-items: center; justify-content: center;
    font: 700 10px ui-monospace, monospace; opacity: 0;
  }
  .stok { background: #2fd6b0; color: #0b0d12; box-shadow: 0 0 10px rgba(47,214,176,0.65); }
  #corr { background: #6fb1ff; color: #0b0d12; box-shadow: 0 0 10px rgba(111,177,255,0.8); }
  .gtok {
    background: rgba(47,214,176,0.08); border: 1.5px dashed rgba(47,214,176,0.55);
    color: rgba(47,214,176,0.85);
  }

  /* the draft model — a separate little model, NOT part of the die (until beat 4) */
  #drafter {
    position: absolute; left: 464px; top: 330px; width: 62px; height: 42px;
    border: 1.5px solid rgba(154,161,181,0.75); border-radius: 8px;
    background: rgba(27,30,39,0.96); z-index: 13; opacity: 0;
    display: flex; align-items: center; justify-content: center;
    font: 700 9px ui-monospace, monospace; color: #c7cce0; text-align: center; line-height: 1.3;
  }

  /* ---- chips / captions ---- */
  .chip {
    position: absolute; font: 700 10.5px ui-monospace, monospace;
    border: 1.5px solid; border-radius: 999px; padding: 4px 10px;
    background: rgba(11,13,18,0.9); opacity: 0; white-space: nowrap; z-index: 9;
  }
  #serialcap { position: absolute; left: 470px; top: 154px; width: 720px; font-size: 12.5px; color: #c7cce0; opacity: 0; }
  #aichip { left: 470px; top: 202px; color: #6fb1ff; border-color: rgba(111,177,255,0.7); }
  #balchip { left: 826px; top: 202px; color: #9aa1b5; border-color: #3a3f4f; }
  #tally { right: 46px; top: 242px; color: #c7cce0; border-color: #3a3f4f; }
  #tally .am { color: #e0a935; } #tally .tl { color: var(--accent); }

  #specname { position: absolute; left: 540px; top: 328px; font-size: 15px; font-weight: 800; color: #e8eaf0; letter-spacing: -0.01em; opacity: 0; }
  #classic { position: absolute; left: 540px; top: 351px; width: 680px; font-size: 11px; color: #9aa1b5; opacity: 0; }
  #draftchip { left: 540px; top: 376px; color: #6fb1ff; border-color: rgba(111,177,255,0.7); }
  #verifychip { left: 736px; top: 376px; color: var(--accent); border-color: rgba(47,214,176,0.7); }
  #lossless { position: absolute; left: 540px; top: 404px; width: 680px; font-size: 11.5px; font-style: italic; color: var(--accent); opacity: 0; }

  /* ---- the economics (beat 3) ---- */
  #reframe { position: absolute; left: 470px; top: 426px; width: 740px; font-size: 13.5px; font-weight: 700; color: var(--accent); line-height: 1.4; opacity: 0; }

  #meters { position: absolute; left: 44px; top: 452px; width: 380px; }
  .mrow { position: absolute; left: 0; width: 100%; opacity: 0; }
  #mrow-b { top: 0; } #mrow-c { top: 74px; }
  .mrow .mtop { display: flex; justify-content: space-between; align-items: center; font: 700 11.5px ui-monospace, monospace; margin-bottom: 4px; }
  .mtrack { height: 13px; border: 1px solid var(--line); border-radius: 6px; background: rgba(11,13,18,0.6); overflow: hidden; }
  .mfill { height: 100%; border-radius: 5px; transform-origin: left; }
  #mf-b { background: linear-gradient(90deg, rgba(201,133,0,0.4), #e0a935); }
  #mf-c { background: linear-gradient(90deg, rgba(57,135,229,0.4), #3987e5); transform: scaleX(0.12); }
  .mrow .mcap { margin-top: 3px; font-size: 10px; color: #9aa1b5; line-height: 1.35; }
  #divk {
    font: 700 10px ui-monospace, monospace; color: #0b0d12; background: var(--accent);
    border-radius: 999px; padding: 1px 8px; opacity: 0;
  }

  /* ---- architecture answer + fine print (beat 4) ---- */
  #dsv3 {
    position: absolute; left: 470px; top: 530px; width: 766px;
    background: var(--panel); border: 1.5px solid rgba(111,177,255,0.5); border-radius: 12px;
    padding: 10px 14px; opacity: 0; height: auto;
  }
  #dsv3 .df { font-size: 12.5px; font-weight: 700; color: #6fb1ff; line-height: 1.4; opacity: 0; }
  #dsv3 .dw { font-size: 11.5px; color: #c7cce0; line-height: 1.4; margin-top: 6px; opacity: 0; }
  #dsv3 .drow { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  #dsv3 .da {
    font: 700 10.5px ui-monospace, monospace; color: var(--accent);
    border: 1.5px solid rgba(47,214,176,0.7); border-radius: 999px; padding: 3px 10px;
    white-space: nowrap; opacity: 0;
  }
  #dsv3 .dp { font-size: 12px; font-weight: 700; color: var(--accent); opacity: 0; }
  #dsv3 .dk3 { font-size: 11.5px; font-weight: 600; color: #e8eaf0; margin-top: 7px; opacity: 0; }

</style>
</head>
<body>
<div class="stage">
  <div class="slide-title">Speculative Decoding &amp; Multi-Token Prediction</div>
  <div class="slide-sub">the last lever — and the drafter that moves into the model</div>

  <div id="machine">
    <div id="pkg"><span class="pkglab">GPU PACKAGE</span></div>
    <div id="hbm">
      <div id="wblock"></div>
      <div class="hlab">HBM</div>
    </div>
    <div class="pipe"><i></i><i></i><i></i></div>
    <div id="die"><div class="dlab">Processor</div></div>
  </div>

  <div id="belt"></div>
  <div id="beltlab">TOKEN CONVEYOR</div>
  <div id="slab"></div>

  <div class="stok" id="st0" style="left:432px;top:270px">t&#8321;</div>
  <div class="stok" id="st1" style="left:432px;top:270px">t&#8322;</div>
  <div class="stok" id="st2" style="left:432px;top:270px">t&#8323;</div>
  <div class="gtok" id="g0" style="left:482px;top:338px">t&#8324;</div>
  <div class="gtok" id="g1" style="left:482px;top:338px">t&#8325;</div>
  <div class="gtok" id="g2" style="left:482px;top:338px">t&#8326;</div>
  <div class="gtok" id="g3" style="left:482px;top:338px">t&#8327;</div>
  <div class="stok" id="corr" style="left:340px;top:290px">t&#8326;</div>

  <div id="drafter"><span id="draflab">draft<br>model</span></div>

  <div class="zflash" id="fl-cap"></div>
  <div class="zflash" id="fl-bw"></div>
  <div class="zflash" id="fl-comp"></div>
  <div class="zflash" id="stampfl"></div>

  <div id="serialcap"></div>
  <div class="chip" id="aichip"></div>
  <div class="chip" id="balchip"></div>
  <div class="chip" id="tally"></div>

  <div id="specname"></div>
  <div id="classic"></div>
  <div class="chip" id="draftchip"></div>
  <div class="chip" id="verifychip"></div>
  <div id="lossless"></div>

  <div id="reframe"></div>
  <div id="meters">
    <div class="mrow" id="mrow-b">
      <div class="mtop"><span style="color:#e0a935">HBM bytes / token</span><span id="divk"></span></div>
      <div class="mtrack"><div class="mfill" id="mf-b"></div></div>
      <div class="mcap" id="cap-b"></div>
    </div>
    <div class="mrow" id="mrow-c">
      <div class="mtop"><span style="color:#6fb1ff">idle die tiles at work</span><span style="color:#6fb1ff">&uarr;</span></div>
      <div class="mtrack"><div class="mfill" id="mf-c"></div></div>
    </div>
  </div>

  <div id="dsv3">
    <div class="df"></div>
    <div class="dw"></div>
    <div class="drow"><span class="da"></span><span class="dp"></span></div>
    <div class="dk3"></div>
  </div>
</div>

<script src="../vendor/gsap.min.js"></script>
<script src="shared/mtp.js?v=20"></script>
<script src="shared/gpus.js?v=20"></script>
<script src="shared/manifest.js?v=20"></script>
<script src="shared/deck.js?v=20"></script>
<script>
  // ---- static content from shared data ----
  var h100 = GPUS.list.filter(function (g) { return g.key === "h100"; })[0];
  document.getElementById("serialcap").textContent = MTP.serial;
  document.getElementById("aichip").textContent = MTP.ai;
  document.getElementById("balchip").textContent = h100.name + " balance ≈ " + GPUS.balance(h100) + " FLOP/byte";
  document.getElementById("specname").textContent = MTP.spec.name;
  document.getElementById("classic").textContent = MTP.spec.classic;
  document.getElementById("draftchip").textContent = MTP.spec.draft;
  document.getElementById("verifychip").textContent = MTP.spec.verify;
  document.getElementById("lossless").textContent = MTP.spec.lossless;
  document.getElementById("reframe").textContent = MTP.reframe;
  document.getElementById("cap-b").textContent = MTP.econ;
  document.getElementById("divk").textContent = "÷ ~k";
  document.querySelector("#dsv3 .df").textContent = MTP.dsv3.frame;
  document.querySelector("#dsv3 .dw").textContent = MTP.dsv3.what;
  document.querySelector("#dsv3 .da").textContent = MTP.dsv3.accept;
  document.querySelector("#dsv3 .dp").textContent = MTP.dsv3.point;
  document.querySelector("#dsv3 .dk3").textContent = MTP.dsv3.k3;

  // machine furniture
  var wblock = document.getElementById("wblock");
  for (var i = 0; i < 12; i++) { var c = document.createElement("i"); c.className = "wcell"; wblock.appendChild(c); }
  var die = document.getElementById("die");
  var tiles = document.createElement("div"); tiles.className = "tiles";
  for (i = 0; i < 20; i++) tiles.appendChild(document.createElement("i"));
  die.appendChild(tiles);

  // ---- DOM mutators (via .call, restored in reset) ----
  var tally = document.getElementById("tally");
  var draflab = document.getElementById("draflab");
  function setTally(reads, toks) {
    tally.innerHTML = '<span class="am">' + reads + '</span> &rarr; <span class="tl">' + toks + "</span>";
  }
  function dieHot(on) { die.classList.toggle("hot", on); }

  // the speculative cycle: draft k ghosts -> one verify read -> accept 3, reject 1.
  // Runs as an ambient loop from beat 2 onward.
  var loopTl = null;
  function startLoop() {
    if (loopTl) { loopTl.play(0); return; }
    loopTl = gsap.timeline({ repeat: -1 });
    loopTl.call(function () {
      ["g0", "g1", "g2", "g3"].forEach(function (id) {
        gsap.set("#" + id, { clearProps: "backgroundColor,borderColor,color,rotation", left: 482, top: 338, opacity: 0 });
      });
      gsap.set("#corr", { left: 340, top: 290, opacity: 0, scale: 0.6 });
    })
      .fromTo("#drafter", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.1);
    ["#g0", "#g1", "#g2", "#g3"].forEach(function (sel, i) {
      loopTl.to(sel, { opacity: 0.85, duration: 0.15 }, 0.15 + i * 0.14)
        .to(sel, { left: 472 + i * 60, top: 270, duration: 0.35, ease: "power1.out" }, 0.2 + i * 0.14);
    });
    weightRead(loopTl, 1.1);
    loopTl.fromTo("#fl-comp", { opacity: 0 }, { opacity: 1, duration: 0.09, yoyo: true, repeat: 3, immediateRender: false }, 1.8)
      .fromTo("#stampfl", { opacity: 0 }, { opacity: 1, duration: 0.12, yoyo: true, repeat: 3, immediateRender: false }, 1.8)
      .to("#g0", { backgroundColor: "rgba(47,214,176,0.95)", color: "#0b0d12", borderColor: "#2fd6b0", opacity: 1, duration: 0.25 }, 2.3)
      .to("#g1", { backgroundColor: "rgba(47,214,176,0.95)", color: "#0b0d12", borderColor: "#2fd6b0", opacity: 1, duration: 0.25 }, 2.42)
      // t6 is REJECTED — and swapped: the verify pass already holds the base
      // model's own token for that position, so it flies out of the die
      .to("#g2", { borderColor: "#e04b38", color: "#e04b38", duration: 0.2 }, 2.56)
      .to("#g2", { top: 372, rotation: 40, opacity: 0, duration: 0.5, ease: "power1.in" }, 2.8)
      .fromTo("#die", { scale: 1.07 }, { scale: 1, duration: 0.3, immediateRender: false }, 2.8)
      .to("#corr", { left: 592, top: 270, opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 2.85)
      // t7 came after the rejection — discarded unjudged
      .to("#g3", { borderColor: "#6b7284", color: "#6b7284", duration: 0.2 }, 3.0)
      .to("#g3", { top: 372, rotation: -30, opacity: 0, duration: 0.55, ease: "power1.in" }, 3.25)
      .to(["#g0", "#g1", "#corr"], { left: "+=560", duration: 1.4, ease: "none" }, 3.55)
      .to(["#g0", "#g1", "#corr"], { opacity: 0, duration: 0.3 }, 4.65)
      .to({}, { duration: 0.75 });
  }

  // one full weight read: HBM flash + the whole block funnels down the pipe into the die
  function weightRead(t, at) {
    t.fromTo("#fl-cap", { opacity: 0 }, { opacity: 1, duration: 0.09, yoyo: true, repeat: 1, immediateRender: false }, at)
      .fromTo("#slab", { left: 70, top: 196, scaleX: 1, scaleY: 1, opacity: 0 }, { opacity: 0.9, duration: 0.12, immediateRender: false }, at)
      .to("#slab", { left: 250, top: 224, scaleX: 0.25, scaleY: 0.35, duration: 0.4, ease: "power1.in" }, at + 0.1)
      .to("#slab", { opacity: 0, duration: 0.12 }, at + 0.5)
      .fromTo("#die", { scale: 1.06 }, { scale: 1, duration: 0.25, immediateRender: false }, at + 0.5);
  }

  // ---- timeline: 4 beats ----
  var tl = gsap.timeline({ paused: true });

  // beat 1: the serial treadmill — one full read per tiny token
  tl.to("#machine", { opacity: 1, filter: "grayscale(0)", duration: 0.6, ease: "power2.out" })
    .fromTo("#belt", { opacity: 0 }, { opacity: 1, duration: 0.4 }, "-=0.2")
    .fromTo("#beltlab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, "<")
    .fromTo("#serialcap", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 })
    .addLabel("b1");
  ["#st0", "#st1", "#st2"].forEach(function (sel, i) {
    var em = gsap.timeline();
    weightRead(em, 0);
    em.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.55)
      .to(sel, { left: 1090, duration: 1.5, ease: "none" }, 0.6)
      .to(sel, { opacity: 0, duration: 0.3 }, 1.8);
    tl.add(em, "b1+=" + (i * 0.9));
  });
  tl.fromTo("#aichip", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, "b1+=2.6")
    .fromTo("#balchip", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, "b1+=2.8")
    .call(function () { setTally("3 reads", "3 tokens"); }, [], "b1+=3.3")
    .fromTo("#tally", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, "b1+=3.35");
  DECK.markStep(tl);

  // beat 2: SPECULATIVE DECODING, the classic form — a separate small draft
  //         model. The draft -> verify -> accept/reject cycle starts here and
  //         keeps looping through the following clicks.
  tl.fromTo("#specname", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" })
    .fromTo("#classic", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 }, "<0.15")
    .fromTo("#drafter", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" })
    .fromTo("#draftchip", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3 })
    .fromTo("#verifychip", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35 }, "<0.15")
    .call(startLoop)
    .call(function () { setTally("1 read", "3 tokens"); }, [], "+=3.6")
    .fromTo("#tally", { scale: 1.25 }, { scale: 1, duration: 0.3, ease: "power2.out" })
    .fromTo("#lossless", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 }, "+=0.5")
    .to({}, { duration: 1.2 });
  DECK.markStep(tl);

  // beat 3: the reframe + the economics — bytes/token ÷ ~k, paid for by the idle tiles
  tl.fromTo("#reframe", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" })
    .fromTo("#mrow-b", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35 })
    .fromTo("#mf-b", { scaleX: 1 }, { scaleX: 0.27, duration: 0.9, ease: "power2.inOut" })
    .fromTo("#fl-bw", { opacity: 0 }, { opacity: 1, duration: 0.09, yoyo: true, repeat: 3 }, "-=0.4")
    .fromTo("#divk", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" })
    .fromTo("#mrow-c", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35 })
    .call(function () { dieHot(true); })
    .fromTo("#mf-c", { scaleX: 0.12 }, { scaleX: 0.85, duration: 0.8, ease: "power2.inOut" })
    .fromTo("#fl-comp", { opacity: 0 }, { opacity: 1, duration: 0.09, yoyo: true, repeat: 3, immediateRender: false }, "-=0.4");
  DECK.markStep(tl);

  // beat 4: the twist — the draft model is trained INTO the die (DeepSeek-V3 MTP head)
  tl.to("#drafter", {
      left: 330, top: 262, borderColor: "rgba(111,177,255,0.9)", color: "#6fb1ff",
      duration: 0.7, ease: "power2.inOut"
    })
    .to("#draftchip", { opacity: 0.35, duration: 0.4 }, "<")
    .call(function () { draflab.textContent = "MTP head"; })
    .fromTo("#drafter", { boxShadow: "0 0 0px rgba(111,177,255,0)" }, { boxShadow: "0 0 18px rgba(111,177,255,0.8)", duration: 0.3, yoyo: true, repeat: 1 })
    .fromTo("#fl-comp", { opacity: 0 }, { opacity: 1, duration: 0.09, yoyo: true, repeat: 3, immediateRender: false }, "<")
    .fromTo("#dsv3", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" })
    .fromTo("#dsv3 .df", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 }, "-=0.15")
    .fromTo("#dsv3 .dw", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 })
    .fromTo("#dsv3 .da", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" })
    .fromTo("#dsv3 .dp", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 }, "<0.15")
    .fromTo("#dsv3 .dk3", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 });

  DECK.register(tl, {
    reset: function () {
      if (loopTl) loopTl.pause(0);
      ["g0", "g1", "g2", "g3"].forEach(function (id) {
        gsap.set("#" + id, { clearProps: "backgroundColor,borderColor,color,rotation", left: 482, top: 338, opacity: 0 });
      });
      gsap.set("#corr", { left: 340, top: 290, opacity: 0, scale: 0.6 });
      dieHot(false);
      draflab.innerHTML = "draft<br>model";
      tally.innerHTML = "";
    }
  });
</script>
